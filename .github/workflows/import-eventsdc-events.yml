name: Import Events DC Events

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Events DC import SQL
        run: npm run import:eventsdc
      - name: Apply import to Supabase
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: npx supabase db query --db-url "$SUPABASE_DB_URL" --file supabase/sql/import-eventsdc-events.sql
      - name: Explain skipped Supabase import
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "Set the SUPABASE_DB_URL repository secret to enable scheduled Events DC imports."
