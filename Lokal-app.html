  localStorage.setItem("lokalFriendSignupCredits", JSON.stringify(Array.from(state.friendSignupCredits)));
  recordLokalPoints(1, `Added ${name} as a friend`, `friend-${name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`);
  if (!state.friendConnections[you]) state.friendConnections[you] = [];
  if (!state.friendConnections[name]) state.friendConnections[name] = [];
  if (!state.friendConnections[you].includes(name)) state.friendConnections[you].push(name);
  if (!state.friendConnections[name].includes(you)) state.friendConnections[name].push(you);
  submitFriendRelationship(name, "accepted", "friend");
  return true;
}

function personalizedEvents(limit = 3) {
  const tastes = (state.tastes || []).map(taste => taste.toLowerCase());
  const cats = (state.tastes || []).map(taste => typeof categoryFromTaste === "function" ? categoryFromTaste(taste) : "").filter(Boolean);
  const pool = displayableDcEvents().filter(event => matchesFilter(event, "all", false));
  const scored = pool.map(event => {
    const text = `${event.cat} ${eventTags(event).join(" ")} ${event.title}`.toLowerCase();
    let score = 0;
    cats.forEach(category => { if (event.cat === category) score += 4; });
    tastes.forEach(taste => { if (taste && text.includes(taste)) score += 2; });
    return { event, score };
  }).filter(item => item.score > 0).sort((a, b) => b.score - a.score || sortEventsByStart(a.event, b.event));
  // collapse recurring occurrences so a single event isn't recommended repeatedly
  return dedupeFeedEvents([...scored.map(item => item.event), ...pool]
    .filter((event, index, all) => all.findIndex(item => item.id === event.id) === index))
    .slice(0, limit);
}

function savedPlannerEvents(mode = "all") {
  const savedIds = state.saved || new Set();
  const rsvpIds = state.rsvps || new Set();
  const calendarIds = state.calendarAdds || new Set();
  const attendedIds = state.attended || new Set();
  const matchesMode = event => mode === "saved"
    ? savedIds.has(event.id)
    : mode === "rsvp"
      ? rsvpIds.has(event.id)
      : savedIds.has(event.id) || rsvpIds.has(event.id) || calendarIds.has(event.id) || attendedIds.has(event.id);
  const livePlans = events
    .filter(event => !state.removedPlans?.has(event.id))
    .filter(matchesMode)
    .filter(event => !planIsPast(event) || attendedIds.has(event.id))
    .map(event => attendedIds.has(event.id) && planIsPast(event) ? { ...event, __attendedHistory: true } : event);
  if (mode !== "all") return livePlans.sort(sortEventsByStart);
  const seen = new Set(livePlans.map(planEventKey));
  const attendedHistory = (typeof profileReceipts === "function" ? profileReceipts() : [])
    .map(receiptToCalendarEvent)
    .filter(event => planIsPast(event))
    .filter(event => {
      const key = planEventKey(event);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  return [...livePlans, ...attendedHistory]
    .sort(sortEventsByStart);
}

function planEventKey(event) {
  return typeof receiptEventKey === "function" ? receiptEventKey(event) : String(event?.id || "");
}

function planIsPast(event) {
  return Number.isFinite(event?.startSort) && event.startSort < Date.now();
}

function planDateIso(event) {
  const date = eventDateValue(event);
  return date ? calendarIsoDay(date) : "";
}

function receiptToCalendarEvent(receipt) {
  const existing = events.find(event => planEventKey(event) === planEventKey(receipt));
  if (existing) return { ...existing, __attendedHistory: true };
  const startSort = Number(receipt?.startSort || receipt?.attendedAt || 0);
  const startDate = Number.isFinite(startSort) && startSort > 0 ? new Date(startSort).toISOString().slice(0, 10) : "";
  return {
    id: `receipt:${planEventKey(receipt)}`,
    receiptId: receipt?.id || receipt?.eventId || planEventKey(receipt),
    title: receipt?.title || "Attended event",
    time: receipt?.time || "",
    venue: receipt?.venue || "",
    area: "",
    price: receipt?.price || "",
    cat: receipt?.cat || "community",
    desc: receipt?.desc || "",
    friends: receipt?.friends || [],
    startSort,
    startDate,
    __attendedHistory: true,
    __receiptOnly: true
  };
}

function plannerCalendar(plans, emptyText = "Save or RSVP to an event and it will appear in Your Plans.") {
  if (!plans.length) return `<p class="section-helper empty-planner">${escapeHtml(emptyText)}</p>`;
  const start = new Date();
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() + state.plannerWeekOffset * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  // Same anatomy as the filter calendar: month header with nav, a weekday
  // row, and circular day cells. Days holding plans carry a mint dot.
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const monthOffset = Number(state.plannerMonthOffset) || 0;
  const monthCursor = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const monthLabel = monthCursor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const total = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 0).getDate();
  const planCounts = new Map();
  plans.forEach(event => {
    const date = eventDateValue(event);
    if (date) planCounts.set(calendarIsoDay(date), (planCounts.get(calendarIsoDay(date)) || 0) + 1);
  });
  const cells = new Array(monthCursor.getDay()).fill(null);
  for (let number = 1; number <= total; number += 1) cells.push(new Date(monthCursor.getFullYear(), monthCursor.getMonth(), number));
  while (cells.length % 7) cells.push(null);
  const weekdays = ["S", "M", "T", "W", "T", "F", "S"];
  const grid = cells.map(date => {
    if (!date) return `<span class="cal-cell"></span>`;
    const iso = calendarIsoDay(date);
    const count = planCounts.get(iso) || 0;
    const isToday = date.getTime() === today.getTime();
    return `<span class="cal-cell"><button class="cal-day ${count ? "has-plans" : ""} ${isToday ? "cal-today" : ""}" data-calendar-day="${iso}" aria-label="${date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}${count ? `, ${count} plan${count === 1 ? "" : "s"}` : ""}">${date.getDate()}${count ? `<i class="cal-plan-dot"></i>` : ""}</button></span>`;
  }).join("");
  const upcoming = plans
    .filter(event => { const date = eventDateValue(event); return date && date >= today; })
    .sort(sortEventsByStart)
    .slice(0, 3);
  return `<div class="planner-cal">
    <div class="cal-head"><b>${escapeHtml(monthLabel)}</b><span class="cal-nav"><button data-planner-month="-1" aria-label="Previous month">&lsaquo;</button><button data-planner-month="1" aria-label="Next month">&rsaquo;</button></span></div>
    <div class="cal-weekdays" aria-hidden="true">${weekdays.map(day => `<span>${day}</span>`).join("")}</div>
    <div class="cal-grid">${grid}</div>
    ${upcoming.length ? `<div class="planner-next">${upcoming.map(event => `<button class="top-ten-row" data-event="${event.id}">
      <span class="tt-thumb"><img src="${escapeHtml(eventCardImageSrc(event))}" data-fallback-src="${escapeHtml(eventFallbackImageSrc(event))}" onerror="this.onerror=null;this.src=this.dataset.fallbackSrc;this.classList.add('is-fallback-image');" alt="" loading="lazy"></span>
      <span class="tt-copy"><b>${escapeHtml(eventDisplayTitle(event))}</b><small>${escapeHtml(eventMetaLine(event))}</small></span>
    </button>`).join("")}</div>` : ""}
  </div>`;
}

function tasteColor(taste) {
  const category = typeof categoryFromTaste === "function" ? categoryFromTaste(taste) : "";

  const palette = ["#00C9A7", "#FF7B54", "#B07EDB", "#5F9FC3", "#F59E0B", "#FF6B9D", "#7BC67E", "#7C6BFF"];
  const seed = Array.from(String(taste || "")).reduce((total, character) => total + character.charCodeAt(0), 0);
  return palette[seed % palette.length];
}

function receiptEventKey(receipt) {
  return String(receipt?.eventId || receipt?.id || `${receipt?.title || ""}|${receipt?.venue || ""}|${receipt?.time || ""}`).toLowerCase();
}

function attendanceTimeKey(item) {
  const raw = Number(item?.startSort || item?.attendedAt || 0);
  if (Number.isFinite(raw) && raw > 0) return String(Math.floor(raw / 60000));
  return String(item?.time || "").toLowerCase().trim();
}

function sameTimeAttendanceCount(event) {
  const key = attendanceTimeKey(event);
  if (!key) return 0;
  return profileReceipts().filter(receipt => attendanceTimeKey(receipt) === key).length;
}

function profileReceipts() {
  const legacySeedReceiptIds = new Set(["receipt-songbyrd", "receipt-open-streets", "receipt-hirshhorn"]);
  const stored = state.receipts || [];
  const attendedRows = Array.from(state.attended || []).map(id => {
    const event = events.find(item => item.id === Number(id));
    if (!event) return null;
    return { id: event.id, title: event.title, time: event.time, venue: eventLocationLine(event), price: event.price, cat: event.cat, desc: event.desc, friends: event.friends || [], attendedAt: event.startSort || Date.now(), startSort: event.startSort || 0 };
  }).filter(Boolean);
  return [...stored, ...attendedRows]
    .filter(receipt => !legacySeedReceiptIds.has(String(receipt?.id || "")))
    .filter((receipt, index, all) => all.findIndex(item => receiptEventKey(item) === receiptEventKey(receipt)) === index)
    .sort((a, b) => (b.attendedAt || 0) - (a.attendedAt || 0));
}

function receiptRow(receipt) {
  const date = receipt.attendedAt ? new Date(receipt.attendedAt) : new Date();
  const month = date.toLocaleDateString("en-US", { month: "short" });

  const people = receipt.friends?.length ? `with ${receipt.friends.map(fullFriendName).join(" + ")}` : "solo plan";
  return `<button class="receipt" data-receipt-event="${receipt.id}"><div class="date-block">${month}<b>${day}</b></div><div><h3>${escapeHtml(receipt.title)}</h3><p>${escapeHtml(receipt.cat)} / ${escapeHtml(receipt.venue)} / ${escapeHtml(people)}</p></div></button>`;
}

function bestFriendsList() {
  const base = {};
  profileReceipts().forEach(receipt => (receipt.friends || []).forEach(initials => {
    const name = fullFriendName(initials);
    base[name] = (base[name] || 0) + 1;
  }));
  return Object.entries(base)
    .map(([name, score]) => ({ name, score, initials: friendInitials(name) }))
    .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
    .slice(0, 5);
}

function markEventAttended(id) {
  const event = events.find(item => item.id === Number(id));
  if (!event) return { ok: false, message: "Event not found" };
  if (Number.isFinite(event.startSort) && event.startSort > Date.now()) return { ok: false, message: "You can add this after the event starts" };
  if (state.attended.has(event.id) || profileReceipts().some(receipt => receiptEventKey(receipt) === receiptEventKey(event))) return { ok: false, message: "This event is already counted once" };
  if (sameTimeAttendanceCount(event) >= 2) return { ok: false, message: "You can only mark two events at the same time" };
  state.attended.add(event.id);
  state.rsvps.delete(event.id);
  const receipt = { id: event.id, eventId: event.id, title: event.title, time: event.time, venue: eventLocationLine(event), price: event.price, cat: event.cat, desc: event.desc, friends: event.friends || [], attendedAt: event.startSort || Date.now(), startSort: event.startSort || 0 };
  state.receipts = [receipt, ...(state.receipts || []).filter(item => Number(item.id) !== Number(event.id))];
  localStorage.setItem("lokalAttended", JSON.stringify(Array.from(state.attended)));
  localStorage.setItem("lokalReceipts", JSON.stringify(state.receipts));
  if (typeof submitAttendanceReceipt === "function") submitAttendanceReceipt(receipt);
  return { ok: true, message: "Receipt and best friends updated" };
}

// --- When? date filter (Lokal Design System, turn 3 / 3a) ---------------
// state.filter.date holds "Any date", a preset label, "YYYY-MM-DD",
// or "YYYY-MM-DD..YYYY-MM-DD". matchesDateFilter() reads all four.
const DATE_PRESETS = ["Any date", "Today", "This weekend", "This week"];
const CALENDAR_MONTH_SPAN = 12;

function calendarIsoDay(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function filterDateSelection() {
  const value = String(state.filter.date || "");
  const range = value.match(/^(\d{4}-\d{2}-\d{2})\.\.(\d{4}-\d{2}-\d{2})$/);
  if (range) return { start: range[1], end: range[2] };
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return { start: value, end: value };
  return { start: "", end: "" };
}

function activeDatePreset() {
  const value = String(state.filter.date || "Any date");
  return DATE_PRESETS.includes(value) ? value : "";
}

// Month cursor is an offset from the current month, clamped to the span.
function calendarMonthOffset() {
  const offset = Number(state.filterCalMonth);
  if (!Number.isFinite(offset)) return 0;
  return Math.min(Math.max(Math.round(offset), 0), CALENDAR_MONTH_SPAN - 1);
}

function calendarMonthGrid(offset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const first = new Date(today.getFullYear(), today.getMonth() + offset, 1);
  const total = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const days = new Array(first.getDay()).fill(null);
  for (let number = 1; number <= total; number += 1) {
    const date = new Date(first.getFullYear(), first.getMonth(), number);
    days.push({ iso: calendarIsoDay(date), number, past: date < today, isToday: date.getTime() === today.getTime() });
  }
  while (days.length % 7) days.push(null);
  return { label: first.toLocaleDateString("en-US", { month: "long", year: "numeric" }), days };
}

function calendarEventCount(start, end) {
  if (!start) return 0;
  const list = typeof displayableDcEvents === "function" ? displayableDcEvents() : events;
  return list.filter(event => {
    const date = eventDateValue(event);
    if (!date) return false;
    const iso = calendarIsoDay(date);
    return iso >= start && iso <= (end || start);
  }).length;
}

function calendarDayLabel(iso) {
  return new Date(`${iso}T00:00:00`).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}

function calendarDayCell(day, selection) {
  if (!day) return `<span class="cal-cell"></span>`;
  const { start, end } = selection;
  const spans = Boolean(start && end && end > start);
  const isStart = day.iso === start;
  const isEnd = day.iso === end;
  const inside = spans && day.iso > start && day.iso < end;
  const band = [];
  if (spans && (inside || isStart || isEnd)) {
    band.push("cal-band");
    if (isStart) band.push("cal-band-start");
    else if (isEnd) band.push("cal-band-end");
  }
  const marks = [isStart || isEnd ? "cal-picked" : "", day.isToday ? "cal-today" : ""].filter(Boolean).join(" ");
  return `<span class="cal-cell ${band.join(" ")}"><button class="cal-day ${marks}" data-calendar-date="${day.iso}" aria-pressed="${isStart || isEnd}" aria-label="${calendarDayLabel(day.iso)}"${day.past ? " disabled" : ""}>${day.number}</button></span>`;
}

function dateFilterModule() {
  const offset = calendarMonthOffset();
  const month = calendarMonthGrid(offset);
  const selection = filterDateSelection();
  const preset = activeDatePreset() || (selection.start ? "" : "Any date");
  const weekdays = ["S", "M", "T", "W", "T", "F", "S"];
  const nights = selection.end ? Math.round((new Date(`${selection.end}T00:00:00`) - new Date(`${selection.start}T00:00:00`)) / 86400000) + 1 : 0;
  const count = calendarEventCount(selection.start, selection.end);
  const summary = selection.start
    ? `<div class="cal-summary"><span>${escapeHtml(calendarDayLabel(selection.start))}${selection.end && selection.end !== selection.start ? ` &rarr; ${escapeHtml(calendarDayLabel(selection.end))}` : ""}</span><small>${nights > 1 ? `${nights} days Â· ` : ""}${count} ${count === 1 ? "event" : "events"}</small></div>`
    : `<p class="cal-hint">Tap a day, then tap another to build a range.</p>`;
  return `<div class="date-module" data-date-module>
    <div class="date-module-head"><h3>When?</h3>${selection.start ? `<button class="text-button" data-calendar-clear>Clear dates</button>` : ""}</div>
    <div class="date-presets">${DATE_PRESETS.map(option => `<button class="${option === preset ? "selected" : ""}" data-filter-option data-filter-key="date" data-filter-value="${option}">${option}</button>`).join("")}</div>
    <div class="cal-head"><b>${month.label}</b><span class="cal-nav"><button data-calendar-nav="-1" aria-label="Previous month"${offset === 0 ? " disabled" : ""}>&lsaquo;</button><button data-calendar-nav="1" aria-label="Next month"${offset >= CALENDAR_MONTH_SPAN - 1 ? " disabled" : ""}>&rsaquo;</button></span></div>
    <div class="cal-weekdays" aria-hidden="true">${weekdays.map(day => `<span>${day}</span>`).join("")}</div>
    <div class="cal-grid">${month.days.map(day => calendarDayCell(day, selection)).join("")}</div>
    ${summary}
  </div>`;
}

/* ============================================================
   Notifications
   Only things that actually happened to this account belong here. Nothing is
   manufactured to fill the sheet: no seeded friend requests, no "just posted"
   recommendations invented from the feed. If the list is empty, it stays empty.
   ============================================================ */

const NOTIFICATION_SEEN_KEY = "lokalNotificationsSeen";

// A saved or RSVP'd event that starts today or tomorrow. Earned twice over: the
// user put it on their list, and the clock is what makes it newsworthy.
function notificationPlanReminders() {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const endOfWindow = new Date(startOfToday.getTime() + 2 * 86400000);
  return events
    .filter(event => state.rsvps.has(event.id) || state.saved.has(event.id))
    .map(event => ({ event, date: typeof eventDateValue === "function" ? eventDateValue(event) : null }))
    .filter(entry => entry.date && entry.date >= startOfToday && entry.date < endOfWindow)
    .sort((a, b) => a.date - b.date)
    .map(entry => {
      const isToday = entry.date < new Date(startOfToday.getTime() + 86400000);
      return {
        id: `plan-${entry.event.id}`,
        eventId: entry.event.id,
        title: state.rsvps.has(entry.event.id)
          ? `You're going ${isToday ? "today" : "tomorrow"}`
          : `Saved event ${isToday ? "today" : "tomorrow"}`,
        body: `${eventDisplayTitle(entry.event)} at ${eventLocationLine(entry.event)}.`,
        meta: eventMetaLine(entry.event)
      };
    })
    .slice(0, 6);
}

function notificationPointItems() {
  const hiddenPointActions = new Set(["Copied an invite link", "Sent an invite link"]);
  const items = (state.pointNotifications || [])
    .filter(item => !hiddenPointActions.has(item.action))
    .slice(0, 12)
    .map(item => ({
      id: `points-${item.id}`,
      points: item.points,
      title: `+${item.points}`,
      body: item.action,
      meta: item.createdAt ? new Date(item.createdAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "Just now"
    }));
  return items;
}

function notificationItems() {
  const requests = (state.pendingRequests || [])
    .filter(request => request.type === "friend")
    .map(request => ({ id: request.id, request }));
  return [...notificationPointItems(), ...requests, ...notificationPlanReminders()];
}

function notificationSignature() {
  return notificationItems().map(item => item.id).join("|");
}

function unreadNotificationCount() {
  const items = notificationItems();
  if (!items.length) return 0;
  return localStorage.getItem(NOTIFICATION_SEEN_KEY) === notificationSignature() ? 0 : items.length;
}

// The bell dot is markup that ships with index.html, so the only honest way to
// hide it is to toggle a class from whatever the current list actually holds.
function refreshNotificationBadge() {

    button.classList.toggle("has-unread", unreadNotificationCount() > 0);
  });
}

function openNotifications(skipSync = false) {
  if (!skipSync && typeof syncReferralPointNotifications === "function") {
    syncReferralPointNotifications().then(() => {
      if (document.querySelector(".notification-sheet")) openNotifications(true);
    });
  }
  const items = notificationItems();
  const cards = items.map(item => item.request
    ? `<div class="notification-card request-notification"><b>${escapeHtml(item.request.from)} sent you a friend request</b><p>${escapeHtml(item.request.detail)}</p><small>${escapeHtml(item.request.time)}</small><div class="request-actions"><button data-accept-request="${item.request.id}">Accept</button><button data-decline-request="${item.request.id}">Decline</button></div></div>`
    : item.points
    ? `<div class="notification-card points-notification"><span class="points-badge">+${escapeHtml(item.points)}</span><span><b>${escapeHtml(item.body)}</b><p>Lokal points earned</p><small>${escapeHtml(item.meta)}</small></span></div>`
    : `<button class="notification-card" data-event="${item.eventId}"><b>${escapeHtml(item.title)}</b><p>${escapeHtml(item.body)}</p><small>${escapeHtml(item.meta)}</small></button>`).join("");
  const empty = `<div class="notification-empty"><b>You're all caught up</b><p>Friend requests and reminders for events you've saved or RSVP'd to will show up here.</p></div>`;

// A run of weekdays reads better as a range than as a list.
function weekdayRunLabel(days) {
  if (!days.length) return "";
  const short = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  if (days.length === 7) return "Every day";
  const contiguous = days.every((day, index) => index === 0 || day === days[index - 1] + 1);
  if (contiguous && days.length > 2) return `${short[days[0]]}â€“${short[days[days.length - 1]]}`;
  return days.map(day => short[day]).join(", ");
}

// Recurring events used to print one row per occurrence â€” dozens of them. The
// detail card only needs the readable cadence and time window.
function detailScheduleBlock(event) {
  const all = occurrencesForEvent(event);
  if (all.length < 2) return "";
  const dated = all
    .map(item => ({ item, date: eventDateValue(item) }))
    .filter(entry => entry.date)
    .sort((a, b) => a.date - b.date);
  if (dated.length < 2) return "";

  const weekdays = [...new Set(dated.map(entry => entry.date.getDay()))].sort((a, b) => a - b);
  const cardSchedule = typeof recurringCardScheduleParts === "function" ? recurringCardScheduleParts(event) : null;
  const timeLabel = cardSchedule?.detail || recurringTimeWindowLabel(event);
  return `<div class="detail-schedule">
    <div class="detail-schedule-head detail-schedule-simple">
      <span class="detail-schedule-copy detail-schedule-inline"><b>${escapeHtml(weekdayRunLabel(weekdays))}</b>${timeLabel ? `<small>| ${escapeHtml(timeLabel)}</small>` : ""}</span>
    </div>
  </div>`;
}

function recurringTimeWindowLabel(event) {
  const text = typeof eventDisplayTime === "function" ? String(eventDisplayTime(event) || "") : "";
  const clean = text.replace(/^[A-Za-z]{3,9},\s+[A-Za-z]{3,9}\s+\d{1,2},\s*/i, "").trim();
  return typeof normalizeClockLabel === "function" ? normalizeClockLabel(clean) : clean;
}

function shareableGroupNames() {
  return userGroupNames().filter(name => !state.leftGroups.has(name));

function eventOccurrenceSummary(event, recurrence, otherOccurrences) {
  if (!event || !otherOccurrences.length) return null;
  const allOccurrences = occurrencesForEvent(event);
  const timeText = String(event.time || "").replace(/^[A-Za-z]{3,9},\s+[A-Za-z]{3,9}\s+\d{1,2},\s*/i, "").trim();
  const weekdayCodes = occurrenceWeekdayCodes(allOccurrences);
  if (weekdayCodes.length > 1) {
    return { title: formatRecurringWeekdays(weekdayCodes), detail: timeText };
  }
  if (recurrence?.label) {
    return { title: recurrence.label.replace(/^every /i, "Every "), detail: timeText };
  }
  if (weekdayCodes.length === 1) {
    return { title: formatRecurringWeekdays(weekdayCodes), detail: timeText };
  }
  return null;
}

function occurrenceWeekdayCodes(occurrences) {
  return occurrences
    .map(occurrence => eventDateValue(occurrence))
    .filter(Boolean)
    .map(date => ICS_WEEKDAY_CODES[date.getDay()])
    .filter((code, index, all) => code && all.indexOf(code) === index)
    .sort((a, b) => ICS_WEEKDAY_CODES.indexOf(a) - ICS_WEEKDAY_CODES.indexOf(b));
}

function formatRecurringWeekdays(codes) {
  const key = codes.join(",");
  if (key === "SU,MO,TU,WE,TH,FR,SA") return "Daily";
  if (key === "MO,TU,WE,TH,FR") return "Every weekday";
  if (key === "SU,SA") return "Every weekend";
  const ranges = [];
  let start = 0;
  for (let index = 1; index <= codes.length; index += 1) {
    const previous = ICS_WEEKDAY_CODES.indexOf(codes[index - 1]);
    const current = ICS_WEEKDAY_CODES.indexOf(codes[index]);
    if (index === codes.length || current !== previous + 1) {
      ranges.push(codes.slice(start, index));
      start = index;
    }
  }
  const parts = ranges.map(range => {
    const names = range.map(code => ICS_CODE_LABEL[code]);
    if (names.length >= 3) return `${names[0]} through ${names[names.length - 1]}`;
    return names.join(" & ");
  });
  return `Every ${parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`}`;
}

// --- Add a recurring event to the user's calendar as a repeating series ---
function icsEscape(value) {
  return String(value || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}

function icsStamp(date) {
  const p = n => String(n).padStart(2, "0");
  return `${date.getFullYear()}${p(date.getMonth() + 1)}${p(date.getDate())}T${p(date.getHours())}${p(date.getMinutes())}00`;
}

function icsStampUtc(date) {
  const p = n => String(n).padStart(2, "0");
  return `${date.getUTCFullYear()}${p(date.getUTCMonth() + 1)}${p(date.getUTCDate())}T${p(date.getUTCHours())}${p(date.getUTCMinutes())}${p(date.getUTCSeconds())}Z`;
}

// First on/after the event date that matches the rule, so DTSTART is a valid
// instance even if the stored date drifts from the detected cadence.
function firstRecurrenceDate(startDate, recurrence) {
  const base = new Date(`${startDate}T00:00:00`);
  if (Number.isNaN(base.getTime())) return null;
  const matches = date => {
    const code = ICS_WEEKDAY_CODES[date.getDay()];
    if (recurrence.freq === "WEEKLY") return recurrence.byday.includes(code);
    return recurrence.byday.some(token => {
      const parsed = token.match(/^(-?\d+)([A-Z]{2})$/);
      if (!parsed || parsed[2] !== code) return false;
      const ordinal = Number(parsed[1]);
      const nth = Math.floor((date.getDate() - 1) / 7) + 1;
      const isLast = new Date(date.getTime() + 7 * 86400000).getMonth() !== date.getMonth();
      return ordinal === -1 ? isLast : nth === ordinal;
    });
  };
  for (let i = 0; i < 400; i++) {
    const day = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    if (matches(day)) return day;
  }
  return base;
}

function buildEventIcs(event, recurrence) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(event.startDate || ""))) return null;
  const first = firstRecurrenceDate(event.startDate, recurrence);
  if (!first) return null;
  const hasTime = Number.isFinite(event.startHour);
  const start = new Date(first.getFullYear(), first.getMonth(), first.getDate(), hasTime ? event.startHour : 9, 0, 0);
  const rrule = [`FREQ=${recurrence.freq}`];
  if (recurrence.interval > 1) rrule.push(`INTERVAL=${recurrence.interval}`);
  if (recurrence.byday && recurrence.byday.length) rrule.push(`BYDAY=${recurrence.byday.join(",")}`);
  const description = [String(event.desc || "").replace(/<[^>]*>/g, "").trim(), lokalEventShareUrl(event)].filter(Boolean).join("\n");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lokal//DC Events//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT"];
  lines.push(`UID:lokal-${event.sourceId || event.id}-${recurrence.freq.toLowerCase()}@lokal.app`);
  lines.push(`DTSTAMP:${icsStampUtc(new Date())}`);
  if (hasTime) {
    const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
    lines.push(`DTSTART:${icsStamp(start)}`, `DTEND:${icsStamp(end)}`);
  } else {
    const p = n => String(n).padStart(2, "0");
    lines.push(`DTSTART;VALUE=DATE:${start.getFullYear()}${p(start.getMonth() + 1)}${p(start.getDate())}`);
  }
  lines.push(`RRULE:${rrule.join(";")}`);
  lines.push(`SUMMARY:${icsEscape(event.title)}`);
  lines.push(`DESCRIPTION:${icsEscape(description)}`);
  lines.push(`LOCATION:${icsEscape(eventLocationLine(event))}`);
  lines.push("END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcsFile(filename, content) {
  const blob = new Blob([content], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function eventCalendarStart(event) {
  if (Number.isFinite(event.startSort) && event.startSort !== Number.MAX_SAFE_INTEGER) return new Date(event.startSort);
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(event.startDate || ""))) return new Date(`${event.startDate}T${String(event.startHour || 9).padStart(2, "0")}:00:00`);
  return null;
}

function buildSingleEventIcs(event) {
  const start = eventCalendarStart(event);
  if (!start) return null;
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const description = [String(event.desc || "").replace(/<[^>]*>/g, "").trim(), lokalEventShareUrl(event)].filter(Boolean).join("\n");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lokal//DC Events//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT"];
  lines.push(`UID:lokal-${event.sourceId || event.id}-single@lokal.app`);
  lines.push(`DTSTAMP:${icsStampUtc(new Date())}`);
  lines.push(`DTSTART:${icsStamp(start)}`, `DTEND:${icsStamp(end)}`);
  lines.push(`SUMMARY:${icsEscape(event.title)}`);
  lines.push(`DESCRIPTION:${icsEscape(description)}`);
  lines.push(`LOCATION:${icsEscape(eventLocationLine(event))}`);
  lines.push("END:VEVENT", "END:VCALENDAR");
  return lines.join("\r\n");
}

function googleCalendarUrl(event) {
  const start = eventCalendarStart(event);
  if (!start) return "";
  const end = new Date(start.getTime() + 2 * 60 * 60 * 1000);
  const recurrence = eventRecurrence(event);
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: event.title || "Lokal event",
    dates: `${icsStampUtc(start)}/${icsStampUtc(end)}`,
    details: [String(event.desc || "").replace(/<[^>]*>/g, "").trim(), lokalEventShareUrl(event)].filter(Boolean).join("\n"),
    location: eventLocationLine(event)
  });
  if (recurrence) {
    const rrule = [`FREQ=${recurrence.freq}`];
    if (recurrence.interval > 1) rrule.push(`INTERVAL=${recurrence.interval}`);
    if (recurrence.byday?.length) rrule.push(`BYDAY=${recurrence.byday.join(",")}`);
    params.set("recur", `RRULE:${rrule.join(";")}`);
  }
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function addEventToCalendar(id, provider = "apple") {
  const event = events.find(item => item.id === Number(id));
  if (!event) return;
  if (provider === "google") {
    const url = googleCalendarUrl(event);
    if (!url) { toast("This event is missing a date to schedule."); return; }
    addCalendarPlan(event.id);
    window.open(url, "_blank", "noopener,noreferrer") || window.location.assign(url);
    toast("Added to Your Plans as a calendar item.");
    return;
  }
  const recurrence = eventRecurrence(event);
  const ics = recurrence ? buildEventIcs(event, recurrence) : buildSingleEventIcs(event);
  if (!ics) { toast("This event is missing a date to schedule."); return; }
  addCalendarPlan(event.id);
  const slug = String(event.title || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "event";
  downloadIcsFile(`${slug}.ics`, ics);
  toast(recurrence ? `Calendar file ready â€” repeats ${recurrence.label}.` : "Calendar file ready.");
}

function addCalendarPlan(id) {
  const eventId = Number(id);
  if (!Number.isFinite(eventId)) return;
  state.calendarAdds.add(eventId);
  localStorage.setItem("lokalCalendarAdds", JSON.stringify(Array.from(state.calendarAdds)));
  setPlanSource("calendar", eventId, true);
  if (state.route === "social") renderSocial();
}

function addRecurringEventToCalendar(id) {
  const event = events.find(item => item.id === Number(id));
  if (!event) return;
  const recurrence = eventRecurrence(event);
  if (!recurrence) { toast("This event doesn't repeat on a set schedule."); return; }
  const ics = buildEventIcs(event, recurrence);
  if (!ics) { toast("This event is missing a date to schedule."); return; }
  addCalendarPlan(event.id);
  const slug = String(event.title || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "event";
  downloadIcsFile(`${slug}.ics`, ics);
  toast(`Added to your calendar â€” repeats ${recurrence.label}.`);
}

const LOKAL_MARK_SVG = `<svg width="40" height="40" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

// A warm, hand-typed welcome letter from the founders. Each block is typed out in
// sequence with a blinking cursor; green segments (g:true) are the emphasized words.
// `role` drives styling/placement: greeting + body flow as the message; from + sign
// are the closing signature. Edit the blocks freely â€” the markup is generated from
// this array, so adding or removing a block never desyncs the layout.
const WELCOME_LETTER_BLOCKS = [
  { role: "greeting", speed: 46, segs: [{ t: "Hey, friend" }] },
  { role: "body", speed: 30, segs: [{ t: "As " }, { t: "DC locals", g: true }, { t: ", we know this city has so much more than meets the eye, but most people just never find it." }] },
  { role: "body", speed: 32, segs: [{ t: "So...we built Lokal because we want to get the most out of our " }, { t: "lives;", g: true }, { t: " to experience more with more " }, { t: "people", g: true }, { t: "." }] },
  { role: "body", speed: 34, segs: [{ t: "And we bet you are here because you feel the same way." }] },
  { role: "body", speed: 34, segs: [{ t: "Come " }, { t: "join the community", g: true }, { t: " :)" }] },
  { role: "from", speed: 40, segs: [{ t: "your friends," }] },
  { role: "sign", speed: 44, segs: [{ t: "Jack, Will & Reese" }] }
];

const WELCOME_LETTER_ROLE_CLASS = { greeting: "letter-line", body: "letter-mono", from: "letter-from", sign: "letter-sign" };

// Build the letter markup straight from WELCOME_LETTER_BLOCKS. Message blocks
// (greeting/body) stack in the flowing body; the signature (from/sign) sits in the
// footer above the buttons. Each paragraph carries its array index as data-letter.
function welcomeLetterMarkup() {
  const bodyHtml = WELCOME_LETTER_BLOCKS
    .map((block, index) => ({ block, index }))
    .filter(({ block }) => block.role !== "from" && block.role !== "sign")
    .map(({ block, index }, position) => `${position > 0 ? '<div class="letter-sp"></div>' : ""}<p class="${WELCOME_LETTER_ROLE_CLASS[block.role] || "letter-mono"}" data-letter="${index}"></p>`)
    .join("");
  const footHtml = WELCOME_LETTER_BLOCKS
    .map((block, index) => ({ block, index }))
    .filter(({ block }) => block.role === "from" || block.role === "sign")
    .map(({ block, index }) => `<p class="${WELCOME_LETTER_ROLE_CLASS[block.role]}" data-letter="${index}"></p>`)
    .join("");
  return `<div class="letter-screen">
        <div class="letter-logo">${LOKAL_MARK_SVG}</div>
        <div class="letter-body">${bodyHtml}</div>
        <div class="letter-foot">
          ${footHtml}
          <button class="letter-btn letter-cta show" data-onboard-start data-account-type="person">get started</button>
          <p class="auth-swap letter-signin letter-cta">Already have an account? <button class="letter-inline-link" data-show-login>Sign in</button></p>
        </div>
      </div>`;
}

function welcomeLetterTotal(segs) {
  return segs.reduce((sum, seg) => sum + [...seg.t].length, 0);
}

// Build the partial HTML for a block, revealing `upTo` characters, wrapping the
// emphasized segments in a green span.
function welcomeLetterHtml(segs, upTo) {
  let count = 0;
  let html = "";
  for (const seg of segs) {
    let piece = "";
    for (const character of [...seg.t]) {
      if (count >= upTo) break;
      piece += escapeHtml(character);
      count++;
    }
    if (piece) html += seg.g ? `<span class="letter-g">${piece}</span>` : piece;
    if (count >= upTo) break;
  }
  return html;
}

// Runs the typewriter reveal after the welcome letter is inserted. Tapping the
// letter (anywhere but a button) fast-forwards to the end; reduced-motion users
// get the whole letter instantly.
async function playWelcomeLetter() {
  const screen = document.querySelector(".onboard-letter-screen");
  if (!screen || screen.dataset.played) return;
  screen.dataset.played = "1";
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const reveal = () => { screen.querySelectorAll(".letter-cta").forEach(node => node.classList.add("show")); };
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let skip = reduce;
  screen.addEventListener("click", event => { if (!event.target.closest("button")) skip = true; });

  const typeBlock = async (block, index) => {
    const el = screen.querySelector(`[data-letter="${index}"]`);
    if (!el) return;
    const total = welcomeLetterTotal(block.segs);
    if (skip) { el.innerHTML = welcomeLetterHtml(block.segs, total); return; }
    const cursor = document.createElement("span");
    cursor.className = "letter-cur";
    for (let i = 1; i <= total; i++) {
      if (skip) break;
      el.innerHTML = welcomeLetterHtml(block.segs, i);
      el.appendChild(cursor);
      await sleep(block.speed + (Math.random() * 16 - 8));
    }
    el.innerHTML = welcomeLetterHtml(block.segs, total);
  };

  await sleep(skip ? 0 : 380);
  for (const [index, block] of WELCOME_LETTER_BLOCKS.entries()) {
    await typeBlock(block, index);
    if (!skip) await sleep(block.speed * 4);
  }
  reveal();
}

// Discover / Saved / Profile sit left-to-right along the tab bar, so moving
// between them should read as travelling sideways: the page you are leaving
// slides off the way you came from, the new one slides in behind it. Short
// enough (about a fifth of a second, end to end) that it never feels like a wait.
const ROUTE_EXIT_MS = 130;

function renderRoute(route) {
  ({ home: renderHome, social: renderSocial, profile: renderProfile }[route] || renderHome)();
}

function setRoute(route) {
  if (route === "map") route = "home";
  const routeChanged = state.route !== route;
  state.route = route;
  document.body.dataset.route = route;
  if (routeChanged && typeof trackAppPageView === "function") trackAppPageView(route, {
    account_type: state.profile?.accountType || "person"
  });
  if (typeof refreshNotificationBadge === "function") refreshNotificationBadge();
  // Bo leans on the wordmark in the topbar; give the main pages their own
  // little posture so Saved and Profile do not feel like cloned headers.
  const boSlot = document.querySelector(".topbar-bo");
  if (boSlot && typeof boPoseMarkup === "function") {
    const routePose = route === "social" ? "Hello"
      : route === "profile" ? "Dancing"
        : "Leaning on the wordmark";
    if (boSlot.dataset.pose !== routePose) {
      boSlot.dataset.pose = routePose;
      boSlot.innerHTML = boPoseMarkup(routePose);
    }
  }
  document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.route === route));

  const leaving = routeChanged ? app.querySelector(".page") : null;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!leaving || reduceMotion || typeof leaving.animate !== "function") {
    renderRoute(route);
    return;
  }
  // Travelling right along the tab bar pushes the old page left, and vice versa.
  const back = document.body.classList.contains("nav-back");
  let rendered = false;
  const swap = () => {
    if (rendered) return;
    rendered = true;
    renderRoute(route);
  };
  try {
    const animation = leaving.animate([
      { opacity: 1, transform: "translate3d(0, 0, 0)" },
      { opacity: 0, transform: `translate3d(${back ? "26px" : "-26px"}, 0, 0)` }
    ], { duration: ROUTE_EXIT_MS, easing: "cubic-bezier(.4, 0, 1, 1)", fill: "forwards" });
    animation.onfinish = swap;
    animation.oncancel = swap;
  } catch { swap(); }
  // A backstop: an animation on a backgrounded tab may never fire onfinish, and
  // the route must land either way.
  setTimeout(swap, ROUTE_EXIT_MS + 60);
}

function resetAppScroll() {
  const scrollers = [
    window,
    document.scrollingElement,
    document.documentElement,
    document.body,
    document.querySelector(".app-stage"),
    document.querySelector(".app-shell"),
    document.querySelector("#app")
  ].filter(Boolean);
  const reset = () => scrollers.forEach(scroller => {
    if (scroller === window) scroller.scrollTo({ top: 0, left: 0, behavior: "auto" });
    else {
      scroller.scrollTop = 0;
      scroller.scrollLeft = 0;
    }
  });
  reset();
  requestAnimationFrame(reset);
  setTimeout(reset, 80);
}

function queueDiscoverSearch(input) {
  state.discoverSearch = input.value;
  window.clearTimeout(discoverSearchTimer);
  if (discoverSearchFrame) window.cancelAnimationFrame(discoverSearchFrame);
  discoverSearchTimer = window.setTimeout(() => {
    const query = String(state.discoverSearch || "").trim().toLowerCase();
    if (query === lastRenderedDiscoverSearch) return;
    discoverSearchFrame = window.requestAnimationFrame(() => {
      const isNewSearch = query !== lastRenderedDiscoverSearch;
      lastRenderedDiscoverSearch = query;
      state.searchFeedShown = query ? (isNewSearch ? 20 : (state.searchFeedShown || 20)) : 20;
      const visible = renderDiscoverEventSearch(query);
      document.querySelectorAll("#app .following-chip").forEach(card => {
        const match = !query || card.dataset.searchText.includes(query);
        card.style.display = match ? "" : "none";
      });
      const results = document.querySelector("[data-discover-results]");
      if (results) { results.hidden = true; results.innerHTML = ""; }
      const feed = document.querySelector(".feed-section");
      const venueMatches = query ? venueSearchMatches(query, 8).length : 0;
      if (query && typeof recordAppAction === "function") recordAppAction("search_performed", {
        query,
        eventResultCount: visible,
        venueResultCount: venueMatches
      });
      if (feed) feed.classList.toggle("search-empty-feed", Boolean(query) && visible === 0 && venueMatches === 0);
      if (!query) {
        const nextInput = document.querySelector("[data-discover-search]");
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length);
        }
      }
    });
  }, input.value.trim() ? 220 : 80);
}

    try { validateSignupEmail(email); formattedPhone = formatSignupPhone(phone); validateBirthday(birthdate); validateSignupPassword(password); }
    catch (contactError) { error.textContent = contactError.message; return; }
    if (password !== confirmPassword) { error.textContent = "Those passwords don't match."; return; }
    // One account per email address â€” checked here so the duplicate is caught on
    // the form the user is looking at, not after they have picked interests.
    if (t.disabled) return;
    t.disabled = true;
    const continueLabel = t.textContent;
    t.textContent = "Checking...";
    let taken = false;
    try { taken = await emailAlreadyRegistered(email); }
    finally { t.disabled = false; t.textContent = continueLabel; }
    if (taken) { error.textContent = "That email already has a Lokal account. Log in instead, or use a different address."; return; }
    error.textContent = "";
    state.signupDraft.firstName = first;
    state.signupDraft.lastName = last;
    state.signupDraft.email = email;
    state.signupDraft.phone = formattedPhone;
    state.signupDraft.birthdate = birthdate;
    state.signupDraft.password = password;
    document.querySelector(".onboarding")?.remove();
    state.onboardStep = 3;
    renderOnboarding();
  }
  if (t.dataset.onboardFinish !== undefined) {
    mark();
    if (t.disabled) return;
    const card = t.closest(".onboard-card");
    const error = card.querySelector("[data-account-error]");
    const draft = state.signupDraft || {};
    const isVenue = false;
    const age = typeof calculateAge === "function" && draft.birthdate ? calculateAge(draft.birthdate) : 27;
    const eventInterests = (draft.interests || []).filter(interest => isVenue || age >= 21 || !["Happy hours", "Nightlife"].includes(interest));
    const areaInterests = draft.areas || [];
    if (!eventInterests.length) { error.textContent = "Pick at least one interest so we can tune your feed."; return; }
    const ownerName = `${draft.firstName || ""} ${draft.lastName || ""}`.trim();
    const fullName = ownerName;
    const username = ((draft.firstName || "lokal") + (draft.lastName || "")).toLowerCase().replace(/[^a-z0-9]+/g, "");
    const onboardingProfile = {
      fullName,
      email: draft.email,
      phone: formatSignupPhone(draft.phone),
      username,
      birthdate: draft.birthdate,
      eventInterests,
      areaInterests,
      accountType: "person",
      ownerName: "",
      venueName: "",
      venueAddress: "",
      venueWebsite: "",
      venueImageUrl: "",
      venueDescription: ""
    };
    t.disabled = true;
    finalizeLokalProfile(onboardingProfile);
    let supabaseSynced = true;
    // Create the real Supabase auth account (email + password) so the user can log
    // back in and reset their password later. Failures don't block local entry.
    if (draft.password) {
      try {
        await createLokalAccount({
          fullName: fullName || username,
          email: draft.email,
          phone: draft.phone,
          username,
          birthdate: onboardingProfile.birthdate,
          password: draft.password,
          eventInterests,
          areaInterests,
          accountType: onboardingProfile.accountType,
          ownerName: onboardingProfile.ownerName,
          venueName: onboardingProfile.venueName,
          venueAddress: onboardingProfile.venueAddress,
          venueWebsite: onboardingProfile.venueWebsite,
          venueImageUrl: onboardingProfile.venueImageUrl,
          venueDescription: onboardingProfile.venueDescription
        });
      } catch (accountError) {
        // A duplicate address is the one failure that must not fall through to a
        // local-only account: it would leave two profiles on one email.
        if (isDuplicateAccountError(accountError)) {
          error.textContent = "That email already has a Lokal account. Go back and use a different address, or log in instead.";
          t.disabled = false;
          return;
        }
        supabaseSynced = false;
        console.warn("[supabase] account creation failed", accountError);
      }
    }
    try { await submitOnboardingProfile(onboardingProfile); }
    catch (error) { supabaseSynced = false; console.warn("[supabase] onboarding submission failed", error); }
    try { await submitReferralJoin(onboardingProfile); }
    catch (error) { console.warn("[supabase] referral join failed", error); }
    localStorage.setItem("lokalAccountCreated", "true");
    // Mark that an account now exists on this device, so a later logout returns the
    // user to the login screen (not the first-run welcome letter).
    localStorage.setItem("lokalHasAccount", "true");
    localStorage.setItem("lokalLastIdentifier", draft.email || username);
    // Store their credentials (password hashed, not raw) so a logout/login round-trip
    // works on this device. They are NOT forced to log in â€” boot auto-enters while
    // lokalAccountCreated is set; this only matters if they choose to log out.
    if (draft.password) { try { await storeLokalCredentials({ email: draft.email, phone: draft.phone, username, password: draft.password }); } catch (credError) { console.warn("[auth] could not store local credentials", credError); } }
    document.querySelector(".onboarding")?.remove();
    state.onboardStep = 0;
    state.signupDraft = {};
    recordLokalPoints(100, "Joined Lokal", "joined-lokal");
    renderHome();
    toast(supabaseSynced ? "Welcome to Lokal" : "Profile saved locally. Supabase sync needs attention.");
    showDiscoverHint();
  }
  if (t.dataset.createAccount !== undefined) {
    mark();
    const card = t.closest(".onboard-card");
    const error = card.querySelector("[data-account-error]");
    const eventInterests = [...card.querySelectorAll("[data-signup-interest].selected")].map(button => button.dataset.signupInterest);
    const areaInterests = [...card.querySelectorAll("[data-signup-area].selected")].map(button => button.dataset.signupArea);
    t.disabled = true;
    error.textContent = "";
    try {
      const result = await createLokalAccount({
        fullName: card.querySelector("[data-signup-full-name]").value.trim(),
        email: card.querySelector("[data-signup-email]").value.trim(),
        phone: card.querySelector("[data-signup-phone]").value.trim(),
        username: card.querySelector("[data-signup-username]").value.trim(),
        birthdate: card.querySelector("[data-signup-birthdate]").value,
        password: card.querySelector("[data-signup-password]").value,
        eventInterests,
        areaInterests
      });
      document.querySelector(".onboarding").remove();
      finalizeLokalProfile(state.pendingSignupProfile);
      state.onboardStep++;
      recordLokalPoints(100, "Joined Lokal", "joined-lokal");
      renderOnboarding();
      toast(result.access_token ? "100 Lokal points for joining" : "100 Lokal points for joining. Check your email to confirm it.");
    } catch (accountError) {
      error.textContent = accountError.message;
      t.disabled = false;
    }
  }
  if (t.dataset.verifyPhone !== undefined) { const card = t.closest(".onboard-card"); const error = card.querySelector("[data-account-error]"); t.disabled = true; error.textContent = ""; try { await verifyLokalPhone(card.querySelector("[data-signup-code]").value); document.querySelector(".onboarding").remove(); state.onboardStep++; renderOnboarding(); toast("Phone number verified"); } catch (verificationError) { error.textContent = verificationError.message; t.disabled = false; } }
  if (t.dataset.next !== undefined) { document.querySelector(".onboarding").remove(); state.onboardStep++; state.selections.clear(); if (state.onboardStep < 3) renderOnboarding(); else { localStorage.setItem("lokalAccountCreated","true"); recordLokalPoints(100, "Joined Lokal", "joined-lokal"); toast("100 Lokal points for joining"); showDiscoverHint(); } }
  if (t.dataset.showLogin !== undefined) { mark(); renderLogin(); }
  if (t.dataset.showForgot !== undefined) { mark(); renderForgotPassword(); }
  if (t.dataset.showSignup !== undefined) { mark(); document.querySelector(".onboarding")?.remove(); state.signupDraft = {}; state.onboardStep = 0; renderOnboarding(); }
  if (t.dataset.loginSubmit !== undefined) {
    mark();
    const card = t.closest(".auth-card");
    const error = card.querySelector("[data-account-error]");
    const identifier = card.querySelector("[data-login-id]").value.trim();
    const password = card.querySelector("[data-login-password]").value;
    t.disabled = true; error.textContent = "";
    try {
      await loginLokalUser({ identifier, password });
      document.querySelector(".onboarding")?.remove();
      state.onboardStep = 0;
      setRoute("home");
      updateProfileShortcut();
      syncSupabaseEvents(); syncSupabaseProfiles(); syncSupabaseGroups();
      toast("Welcome back to Lokal");
    } catch (loginError) { error.textContent = loginError.message; t.disabled = false; }
  }
  if (t.dataset.resetSubmit !== undefined) {
    mark();
    const card = t.closest(".auth-card");
    const error = card.querySelector("[data-account-error]");
    const email = card.querySelector("[data-reset-email]").value.trim();
    t.disabled = true; error.textContent = "";
    try {
      await sendPasswordReset(email);
      card.querySelector(".auth-fields").innerHTML = `<p class="auth-confirm">Check your inbox â€” we sent a reset link to <b>${escapeHtml(email)}</b>. Follow it to set a new password, then come back and log in.</p>`;
      t.remove();
      toast("Reset link sent");
    } catch (resetError) { error.textContent = resetError.message; t.disabled = false; }
  }
  // Saving, RSVP'ing and answering a request all change what the bell owes you.
  if (typeof refreshNotificationBadge === "function") refreshNotificationBadge();
  if (!handled && state.route === "home" && state.openFilterSheet && !clickedDiscoverFilter) {
    state.openFilterSheet = "";
    renderHome();
    return;
  }
  if (!handled && !t.disabled) toast("Action opened");
});

// A venue avatar whose artwork 404s should fall back to the initial rather than
// leave a blank disc. Image errors do not bubble, so this listens on the way
// down instead.
document.addEventListener("error", event => {
  const image = event.target;
  if (!(image instanceof HTMLImageElement)) return;
  const holder = image.closest(".has-venue-image");
  if (!holder) return;
  holder.classList.remove("has-venue-image", "is-logo");
  holder.textContent = holder.dataset.avatarInitial || "";
}, true);

// Venue artwork arrives in every shape: square crests, wide wordmarks, tall
// posters, photographs of the room. A near-square image can safely fill the
// circle; anything further from square is contained instead, so a wordmark is
// never cropped down to "pital O". The filename guess made at render time is
// only a first pass â€” the real proportions settle it. Also capture-phase,
// because load doesn't bubble either.
document.addEventListener("load", event => {
  const image = event.target;
  if (!(image instanceof HTMLImageElement)) return;
  const holder = image.closest(".has-venue-image");
  if (!holder || !image.naturalWidth || !image.naturalHeight) return;
  const ratio = image.naturalWidth / image.naturalHeight;
  holder.classList.toggle("is-logo", ratio < 0.78 || ratio > 1.28);
}, true);

document.addEventListener("keydown", event => {
  if (!["Enter", " "].includes(event.key)) return;
  const descriptionExpander = event.target.closest?.("[data-expand-description]");
  if (!descriptionExpander) return;
  event.preventDefault();
  descriptionExpander.click();
});

let storyTouchStart = null;
modalRoot.addEventListener("touchstart", event => {
  if (event.target.closest("[data-story-sheet]")) storyTouchStart = event.changedTouches[0].clientX;
}, { passive: true });
modalRoot.addEventListener("touchend", event => {
  const sheet = event.target.closest("[data-story-sheet]");
  if (!sheet || storyTouchStart === null) return;
  const distance = event.changedTouches[0].clientX - storyTouchStart;
  storyTouchStart = null;
  if (Math.abs(distance) < 45) return;
  openStory(Number(sheet.dataset.storySheet) + (distance < 0 ? 1 : -1));
}, { passive: true });

document.addEventListener("input", event => {
  const input = event.target;
  const filterFriendCards = (query, listSelector, emptySelector) => {
    const list = document.querySelector(listSelector);
    if (!list) return;
    let visible = 0;
    list.querySelectorAll("[data-friend-card]").forEach(card => {
      const match = card.dataset.searchText.includes(query);
      card.style.display = match ? "" : "none";
      if (match) visible++;
    });
    const empty = document.querySelector(emptySelector);
    if (empty) empty.style.display = visible ? "none" : "block";
  };
  if (input.matches("[data-signup-phone], [data-onboard-phone]")) {
    const digits = input.value.replace(/\D/g, "").slice(0, 10);
    input.value = digits.length > 6 ? `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}` : digits.length > 3 ? `(${digits.slice(0, 3)}) ${digits.slice(3)}` : digits.length ? `(${digits}` : "";
  }
  if (input.matches("[data-group-search]")) {
    const query = input.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll("[data-group-card]").forEach(card => { const match = card.dataset.searchText.includes(query); card.style.display = match ? "" : "none"; if (match) visible++; });
    const empty = document.querySelector("[data-group-empty]"); if (empty) empty.style.display = visible ? "none" : "block";
  }
  if (input.matches("[data-public-group-search]")) {
    const query = input.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll("[data-public-directory-card]").forEach(card => { const match = card.dataset.searchText.includes(query); card.style.display = match ? "" : "none"; if (match) visible++; });
    const empty = document.querySelector("[data-public-group-empty]"); if (empty) empty.style.display = visible ? "none" : "block";
  }
  if (input.matches("[data-friend-search]")) {
    const query = input.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll("[data-friend-card]").forEach(card => { const match = card.dataset.searchText.includes(query); card.style.display = match ? "" : "none"; if (match) visible++; });
    const empty = document.querySelector("[data-friend-empty]"); if (empty) empty.style.display = visible ? "none" : "block";
  }
  if (input.matches("[data-add-friends-search]")) {
    filterFriendCards(input.value.trim().toLowerCase(), "[data-add-friends-results]", "[data-add-friends-empty]");
  }
  if (input.matches("[data-existing-friend-search]")) {
    filterFriendCards(input.value.trim().toLowerCase(), "[data-existing-friend-list]", "[data-existing-friend-empty]");
  }
  if (input.matches("[data-new-friend-search]")) {
    filterFriendCards(input.value.trim().toLowerCase(), "[data-new-friend-list]", "[data-new-friend-empty]");
  }
  if (input.matches("[data-followed-venue-search]")) {
    const list = document.querySelector("[data-followed-venue-list]");
    if (list && typeof followedVenueRows === "function") {
      list.innerHTML = followedVenueRows(input.value) || `<p class="section-helper">You are not following any matching venues yet.</p>`;
    }
  }
  if (input.matches("[data-create-friends]")) {
    const query = input.value.trim().toLowerCase();
    const autocomplete = document.querySelector("[data-autocomplete]");
    const matches = query ? friendDirectory.filter(friend => friend[1].toLowerCase().includes(query) || friend[2].toLowerCase().includes(query)).slice(0, 5) : [];
    autocomplete.hidden = !matches.length;
    autocomplete.innerHTML = matches.map(friend => `<button data-group-friend-option="${friend[1]}">${friend[1]} <small>${friend[2]}</small></button>`).join("");
  }
  if (input.matches("[data-invite-people-search]")) {
    const query = input.value.trim().toLowerCase();
    const results = document.querySelector("[data-invite-people-results]");
    const matches = query ? friendDirectory.filter(friend => friend[1].toLowerCase().includes(query) || friend[2].toLowerCase().includes(query)).slice(0, 5) : [];
    results.hidden = !matches.length;
    results.innerHTML = matches.map(friend => `<button data-invite-people-option="${friend[1]}" data-group-name="${input.dataset.groupName}">${friend[1]} <small>${friend[2]}</small></button>`).join("");
  }
  if (input.matches("[data-category-genre-search]")) {
    state.discoverGenreFilter = input.value;
    renderHome();
    const nextInput = document.querySelector("[data-category-genre-search]");
    if (nextInput) { nextInput.focus(); nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length); }
  }
  if (input.matches("[data-neighborhood-search]")) {
    state.neighborhoodFilter = input.value;
    state.feedExpanded = false;
    renderHome();
    const nextInput = document.querySelector("[data-neighborhood-search]");
    if (nextInput) { nextInput.focus(); nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length); }
  }
  if (input.matches("[data-discover-search]")) {
    queueDiscoverSearch(input);
  }
  if (input.matches("[data-share-group-search]")) {
    const query = input.value.trim();
    const eventId = input.dataset.eventId;
    const results = document.querySelector("[data-share-group-results]");
    results.innerHTML = shareGroupResultsHtml(eventId, query);
  }
  if (input.matches("[data-friend-group-search]")) {
    const query = input.value.trim().toLowerCase();
    const friend = input.dataset.friendName;
    const groups = userGroupNames().filter(name => name.toLowerCase().includes(query));
    const results = document.querySelector("[data-friend-group-results]");
    results.innerHTML = !query ? `<p class="section-helper">Start typing to find a group.</p>` : groups.length ? groups.map(name => `<button class="share-group" data-confirm-invite-group="${name}" data-friend-name="${friend}"><span class="group-icon">${name[0]}</span><span class="share-group-copy"><h3>${name}</h3><p>Add ${friend} to this group</p></span><span class="share-arrow">+</span></button>`).join("") : `<p class="section-helper">No groups match that search.</p>`;
  }
  if (input.matches("[data-map-search]")) {
    state.mapSearch = input.value;
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Enter" && event.target.matches("[data-map-search]")) {
    state.mapSearch = event.target.value.trim();
    applyMapSearch();
    renderMap();
    toast(state.mapSearch ? `Showing ${state.mapSearch}` : "Showing all DC events");
  }
});

const activeMapPointers = new Map();
let mapDragStart = null;
let mapPinchStart = null;

function mapPointerDistance() {
  const points = [...activeMapPointers.values()];
  if (points.length < 2) return 0;
  return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
}

document.addEventListener("pointerdown", event => {
  const canvas = event.target.closest("[data-map-canvas]");
  if (!canvas || event.target.closest("input, button")) return;
  event.preventDefault();
  try { canvas.setPointerCapture(event.pointerId); } catch {}
  activeMapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  if (activeMapPointers.size >= 2) {
    mapPinchStart = { distance: mapPointerDistance(), zoom: state.mapZoom };
    mapDragStart = null;
    return;
  }
  mapDragStart = { x: event.clientX, y: event.clientY };
  canvas.classList.add("dragging");
});
document.addEventListener("pointermove", event => {
  if (!activeMapPointers.has(event.pointerId)) return;
  event.preventDefault();
  activeMapPointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  const canvas = document.querySelector("[data-map-canvas]");
  if (activeMapPointers.size >= 2 && mapPinchStart?.distance) {
    const distance = mapPointerDistance();
    setMapZoom(mapPinchStart.zoom * (distance / mapPinchStart.distance));
    renderMap();
    return;
  }
  if (!mapDragStart) return;
  const deltaX = mapDragStart.x - event.clientX;
  const deltaY = mapDragStart.y - event.clientY;
  mapDragStart = { x: event.clientX, y: event.clientY };
  panMap(deltaX, deltaY);
  renderMap();
  canvas?.classList.add("dragging");
});
function endMapPointer(event) {
  if (event.pointerId !== undefined) activeMapPointers.delete(event.pointerId);
  mapPinchStart = activeMapPointers.size >= 2 ? { distance: mapPointerDistance(), zoom: state.mapZoom } : null;
  mapDragStart = activeMapPointers.size === 1 ? [...activeMapPointers.values()][0] : null;
  if (activeMapPointers.size === 0) mapDragStart = null;
  document.querySelector("[data-map-canvas]")?.classList.remove("dragging");
}
document.addEventListener("pointerup", endMapPointer);
document.addEventListener("pointercancel", endMapPointer);
document.addEventListener("wheel", event => {
  const canvas = event.target.closest("[data-map-canvas]");
  if (!canvas || event.target.closest("input")) return;
  event.preventDefault();
  if (event.ctrlKey) {
    setMapZoom(state.mapZoom - event.deltaY * 0.006);
  } else {
    panMap(event.deltaX, event.deltaY);
  }
  renderMap();
}, { passive: false });

document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = icons[el.dataset.icon]);
const startupParams = new URLSearchParams(location.search);
const startupAccountType = String(startupParams.get("account") || "").toLowerCase();
const forceOnboarding = startupParams.has("newUser") || startupParams.get("fresh") === "onboarding" || startupParams.get("reset") === "onboarding";
if (startupParams.has("newUser") || startupAccountType === "person" || startupAccountType === "local") {
  ["lokalAccountCreated", "lokalHasAccount", "lokalLastIdentifier", "lokalCredentials", "lokalProfile", "lokalAttended", "lokalReceipts", "lokalVerifiedVenues", "lokalVerifiedVenueNames", "lokalPendingVenueRequests", "lokalVenueVerificationDismissed"].forEach(key => localStorage.removeItem(key));
  state.profile = { fullName: "Lokal user", username: "lokaluser", phone: "", birthdate: "", age: 27, initials: "L", tastes: [], privateAccount: false, accountType: "person", venueName: "" };
  state.signupDraft = {};
  state.onboardStep = 0;
  state.verifiedVenues = new Set();
  state.verifiedVenueNames = [];
  state.pendingVenueRequests = [];
  state.venueVerificationDismissed = false;
  state.privateAccount = false;
  if (!forceOnboarding) history.replaceState(null, "", location.pathname);
}
// Boot routing: an active local session enters the app (auto sign-in); a returning
// user who logged out sees the login screen; a brand-new device sees the welcome letter.
if (forceOnboarding) {
  state.route = "home";
  renderOnboarding();
} else if (!localStorage.getItem("lokalAccountCreated")) {
  state.route = "home";
  if (localStorage.getItem("lokalHasAccount")) renderLogin();
  else renderOnboarding();
} else {
  setRoute("home");
}
updateProfileShortcut();
syncSupabaseEvents();
syncSupabaseProfiles();
syncSupabaseGroups();
if (typeof syncReferralPointNotifications === "function") syncReferralPointNotifications().then(() => refreshNotificationBadge());
updateProfileShortcut();
checkPhoneSignupStatus();
showWelcomeBanner();
showDiscoverHint();

    </script>
