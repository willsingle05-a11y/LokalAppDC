  letter-spacing: .14em;
  text-transform: uppercase;
}
.search-card-row .sc-copy b { display: block; margin-top: 3px; font-size: 14px; font-weight: 800; line-height: 1.2; }
.search-card-row.is-empty .sc-copy b { color: rgba(25, 26, 25, .45); font-weight: 600; }
.search-card-row .sc-caret { flex: none; color: rgba(25, 26, 25, .3); font-size: 15px; font-weight: 700; }
.search-card .wide-button { display: block; width: 100%; margin: 0; text-align: center; }

/* Search sits directly under the card. Shaped after the Substack / Zocdoc /
   Cleo pattern: one tall pill, leading stroked magnifier, wide gap, muted
   placeholder. It carries a hairline instead of a shadow so it reads as a
   field rather than as another card competing with the one above it. */
.discover-page .discover-search-box.subtle-search {
  gap: 14px;
  min-height: 56px;
  margin: 0 0 18px;
  padding: 15px 20px;
  border: 1px solid rgba(25, 26, 25, .18);
  border-radius: 999px;
  background: var(--paper);
  box-shadow: none;
  transition: border-color .15s ease;
}
.discover-page .discover-search-box.subtle-search:hover { border-color: rgba(25, 26, 25, .34); }
.discover-page .discover-search-box.subtle-search:focus-within { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.discover-page .discover-search-box.subtle-search .search-ic {
  display: grid;
  flex: none;
  place-items: center;
  color: rgba(25, 26, 25, .5);
  font-size: 0;
}
.discover-page .discover-search-box.subtle-search .search-ic svg { width: 21px; height: 21px; stroke-width: 2; }
.discover-page .discover-search-box.subtle-search input { font-size: 16px; font-weight: 500; }
.discover-page .discover-search-box.subtle-search input::placeholder { color: rgba(25, 26, 25, .5); font-weight: 500; }

.top-types-head { display: flex; align-items: baseline; gap: 8px; margin: -2px 0 5px; }
.top-types-head .eyebrow { margin: 0; }
.top-types-head .text-button { margin-left: auto; }
.top-types { display: flex; gap: 8px; margin-bottom: 4px; }
.top-type {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 9px 6px;
  border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}
/* Following uses the same tiles but scrolls, since the list is open-ended. */
.top-types-scroll { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.top-types-scroll::-webkit-scrollbar { display: none; }
.top-types-scroll .top-type { flex: 0 0 126px; min-height: 112px; padding: 12px 8px; }
.following-stories-row { margin-top: -2px; margin-bottom: 2px; }
.top-type .tt-initial {
  display: grid;
  place-items: center;
  color: var(--accent-strong);
  font-size: var(--fs-small);
  font-weight: 800;
}
.top-type .tt-initial svg { width: 17px; height: 17px; }
.search-card-clear {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 2px 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-small);
  font-weight: 600;
  text-align: center;
  text-decoration: underline;
}
.search-card-clear:hover { color: var(--ink); }
.top-type .tt-art { width: 30px; height: 30px; overflow: hidden; border-radius: 50%; background: var(--mint-tint); }
.top-type .tt-art img { width: 100%; height: 100%; object-fit: cover; }
.top-type b { max-width: 100%; overflow: hidden; font-size: 11px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
.top-type small {
  max-width: 100%;
  overflow: hidden;
  color: rgba(25, 26, 25, .5);
  font-weight: 400;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-ten {
  margin-bottom: 20px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: var(--shadow);
}
.top-ten-head { display: flex; align-items: center; gap: 8px; }
.top-ten-head .eyebrow { margin: 0; color: var(--accent-strong); }
.top-ten-head span { margin-left: auto; color: var(--muted); font-size: 10.5px; font-weight: 700; }
.top-ten h2 { margin: 6px 0 0; font-size: 19px; font-weight: 900; letter-spacing: -.025em; }
.top-ten-list { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.top-ten-row { display: flex; gap: 11px; align-items: center; width: 100%; background: transparent; text-align: left; }
.top-ten-row .tt-num { flex: none; width: 24px; font-size: 19px; font-weight: 900; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.top-ten-row .tt-thumb { flex: none; width: 42px; height: 42px; overflow: hidden; border-radius: 10px; background: var(--mint-tint); }
.top-ten-row .tt-thumb img { width: 100%; height: 100%; object-fit: cover; }
.top-ten-row .tt-copy { flex: 1; min-width: 0; }
.top-ten-row .tt-copy b { display: block; font-size: 13px; font-weight: 800; line-height: 1.2; }

.top-ten-more {

  font-size: 12px;
  font-weight: 800;
}
.top-ten-more:hover { border-color: var(--ink); }

/* ============================================================
   No results â€” loosen a filter
   ============================================================ */

.no-results { display: flex; flex-direction: column; align-items: center; padding: 18px 4px 0; text-align: center; }
.no-results-art {
  display: grid;
  width: 150px;
  height: 150px;

}

/* ============================================================
   Event detail â€” canvas anatomy
   ============================================================ */

.detail-info-row {
  display: flex;

}
.detail-info-row .dir-art { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--mint-tint); }
.detail-info-row .dir-copy { flex: 1; min-width: 0; }
.detail-info-row .dir-copy b { display: block; font-size: 13px; font-weight: 800; line-height: 1.2; }
.detail-info-row .dir-copy small { display: block; margin-top: 1px; color: var(--muted); font-size: 11.5px; font-weight: 500; line-height: 1.2; }

/* Sticky Save / Going bar replaces the ticket row */

  position: sticky;
  bottom: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 1fr;

}

.detail-decide-bar .decide-going:hover { background: #000; }
.detail-decide-bar button.selected { border-color: var(--accent); color: var(--accent-strong); background: var(--mint-tint); }
.detail-decide-bar .decide-going.selected { color: var(--accent-strong); background: var(--mint-tint); }

   You're going â€” confirmation
   ============================================================ */

.going-sheet { padding: 26px 20px 24px; text-align: center; }
.going-check { display: grid; width: 84px; height: 84px; margin: 8px auto 0; place-items: center; border-radius: 50%; background: var(--accent); }
.going-check svg { width: 42px; height: 42px; color: var(--ink); }
.going-sheet h2 { margin: 20px 0 0; font-size: 24px; font-weight: 900; letter-spacing: -.025em; }
.going-sheet .lede { max-width: 34ch; margin: 8px auto 0; }
.going-card {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 20px;

  background: var(--paper);

}

.going-actions { display: flex; flex-direction: column; gap: 9px; margin-top: 20px; }
.going-actions .wide-button { width: 100%; margin: 0; }
.going-actions .going-invite { color: var(--accent-strong); background: var(--mint-tint); text-transform: none; letter-spacing: 0; font-weight: 800; }
.going-actions .going-invite:hover { background: #DCF3EA; }

  white-space: nowrap;
}
.pid-taste-icons {

}

}

.profile-counts { display: flex; width: 100%; margin: 12px 0; }
.profile-counts button, .profile-counts div { flex: 1; background: transparent; text-align: center; }
.profile-counts b { display: block; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.profile-counts small { display: block; margin-top: 5px; color: var(--muted); font-size: 11.5px; font-weight: 500; }

.profile-list-rows { margin: 0 -18px; border-top: 1px solid rgba(25, 26, 25, .09); }

}

.profile-list-row .plr-count { font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }

.profile-stat-pair { display: flex; gap: 9px; margin-top: 14px; }

}

.profile-taste-chips .taste-pill,

.filter-block .eyebrow { margin-bottom: 8px; }
.filter-options button {

  background: var(--paper);
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;

.filter-options button:hover { border-color: var(--ink); }
.filter-options button.selected { border-color: var(--ink); color: #fff; background: var(--ink); font-weight: 800; }
.what-sheet .filter-options {

.what-sheet .filter-options .what-option {

}
.what-option-art svg { width: 24px; height: 24px; stroke-width: 2.3; }
.what-option.selected .what-option-art { background: rgba(255, 255, 255, .18); }
.what-option span:last-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.active-filter-summary {
  margin: 2px 0 4px;
  padding: 11px;
  border: 0;
  border-radius: 14px;
  background: var(--mint-tint);
}
.active-filter-summary span {
  border: 0;
  border-radius: 999px;
  color: var(--accent-strong);
  background: var(--paper);
  font-size: 10.5px;
  font-weight: 800;
}

/* ============================================================
   When? â€” date filter
   Canvas theme f: ink endpoints with mint numerals, mint-tint
   range band, 34px circles inside 36px cells.
   ============================================================ */

.date-module { margin: 4px 0 18px; }

.date-module-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.date-module-head h3 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -.03em; }

.date-presets { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; scrollbar-width: none; }
.date-presets::-webkit-scrollbar { display: none; }
.date-presets button {
  flex: 0 0 auto;
  padding: 9px 13px;
  border: 1.5px solid rgba(25, 26, 25, .14);
  border-radius: 999px;
  color: var(--ink);
  background: var(--paper);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
}
.date-presets button:hover { border-color: var(--ink); }
.date-presets button.selected { border-color: var(--ink); color: #fff; background: var(--ink); font-weight: 800; }

.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.cal-head b { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
.cal-nav { display: flex; gap: 6px; margin-left: auto; }
.cal-nav button {
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border-radius: 50%;
  color: var(--ink);
  background: #F1F1EE;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}
.cal-nav button:hover:not(:disabled) { background: #E6E4DF; }
.cal-nav button:disabled { opacity: .3; cursor: default; }

.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 2px; }
.cal-weekdays span {
  color: rgba(25, 26, 25, .45);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.6;
  text-align: center;
}

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
/* Cells carry the range band so it runs unbroken across the row */
.cal-cell { display: flex; align-items: center; justify-content: center; height: 36px; }
.cal-cell.cal-band { background: var(--mint-tint); }
.cal-cell.cal-band-start { border-radius: 18px 0 0 18px; }
.cal-cell.cal-band-end { border-radius: 0 18px 18px 0; }
.cal-day {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 50%;
  color: var(--ink);
  background: transparent;
  font-family: var(--ds-font);
  font-size: 13.5px;
  font-weight: 800;
}
.cal-day:hover:not(:disabled):not(.cal-picked) { background: #F1F1EE; }
.cal-day.cal-picked { color: var(--accent); background: var(--ink); }
.cal-day.cal-today:not(.cal-picked) { box-shadow: inset 0 0 0 1.5px rgba(25, 26, 25, .25); }
.cal-day:disabled { color: rgba(25, 26, 25, .28); cursor: default; text-decoration: line-through; }

.cal-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  color: var(--accent-strong);
  background: var(--mint-tint);
  font-size: 12px;
  font-weight: 800;
}
.cal-summary small { margin-left: auto; font-size: 11px; font-weight: 700; }
.cal-hint { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; font-weight: 500; }

/* Sheet footer â€” underlined Clear, ink Apply pill */
.filter-footer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
  padding: 14px 0 20px;
  border-top: 1px solid var(--line);
  background: var(--paper);
}
.filter-footer .text-button { color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: underline; }
.filter-footer .wide-button { width: auto; margin: 0; padding: 13px 30px; }

/* ============================================================
   Type scale normalisation â€” LAST in the file on purpose.
   Every module above tuned its own sizes; this pulls them all
   back onto the six steps declared in :root so the app reads as
   one document. Add new sizes here, not in the modules.
   ============================================================ */

.event-card-title, .event-location, .top-ten-row .tt-copy b, .going-card b,
.detail-info-row .dir-copy b, .profile-list-row b, .search-card-row .sc-copy b,
.attend-copy b, .follow-card b, .notification-card b, .share-group h3,
.top-ten h2, .going-sheet h2, .no-results h3, .date-module-head h3,
.pid-handle, .profile-goal b, .cal-head b {
  font-size: var(--fs-title);
  font-weight: 700;
  letter-spacing: -.01em;
}
h1, .discover-heading h1 { font-size: var(--fs-page); }
h2, .filter-sheet h2, .section-heading h2 { font-size: var(--fs-section); }

.event-card-meta, .event-card-venue, .top-ten-row .tt-copy small, .going-card small,
.detail-info-row .dir-copy small, .top-type small, .cal-hint, .pid-since,
.profile-goal .goal-foot small, .no-results p, .following-hint,
.top-ten-head span, .following-chip small, .search-card-row .sc-copy b {
  font-size: var(--fs-small);
  font-weight: 400;
}
.search-card-row .sc-copy b { font-weight: 600; font-size: var(--fs-title); }

.chip, .filter-chip, .filter-options button, .date-presets button, .event-tag,
.top-type b, .detail-info-row .dir-action, .text-button, .filter-button,
.share-shortcut, .cal-summary, .profile-id-actions button, .top-ten-more,
.following-chip b, .cal-summary small, .active-filter-summary span,
.detail-decide-bar button, .profile-list-row .plr-count {
  font-size: var(--fs-small);
}
.wide-button, .letter-btn, .explore-cta { font-size: var(--fs-body); letter-spacing: .02em; }
.eyebrow, .feed-label, .settings-group-label, .event-meta,
.top-types-head .eyebrow, .top-ten-head .eyebrow { font-size: var(--fs-label); }
.nav-item, .nav-item.active { font-size: var(--fs-label); letter-spacing: 0; text-transform: none; }
.cal-day { font-size: var(--fs-body); }
.cal-weekdays span { font-size: var(--fs-micro); }
.profile-counts b, .tt-num { font-size: var(--fs-section); }
.profile-counts small { font-size: var(--fs-small); }
input, textarea, select { font-size: var(--fs-body); }
.splash-word { font-size: 38px; }
.splash-city, .splash-tagline { font-size: var(--fs-label); }

/* Stragglers that out-specified the block above. Scoped to .app-shell so they
   win the tie, and kept here so every size still traces back to the scale. */
.app-shell .event-tag,
.app-shell .feed-mode-btn,
.app-shell .event-card-price,
.app-shell .event-card-price.is-free,
.app-shell .sync-note span,
.app-shell .event-card-reason,
.app-shell .following-hint { font-size: var(--fs-small); }
.app-shell .brand small,
.app-shell .avatar,
.app-shell .avatar.avatar-me,
.app-shell .account-label,
.app-shell .event-card-pill { font-size: var(--fs-label); }
.app-shell .brand b { font-size: var(--fs-page); }
.top-ten-row .tt-num { font-size: var(--fs-section); }
.app-shell .search-card-row .sc-copy small { font-size: var(--fs-label); }

/* Remaining per-screen strays: detail title, plan-card and profile numerals,
   avatar initials, and the empty-state glyph. */
.app-shell .detail-body h1,
.app-shell .detail-title-block h1 { font-size: var(--fs-page); }
.app-shell .toast b,
.app-shell .event-card-info b,
.app-shell .plan-card b,
.app-shell .attend-copy b,
.app-shell .score-block b { font-size: var(--fs-title); }
.app-shell .profile-id .pid-avatar { font-size: var(--fs-section); }
.app-shell .profile-summary-strip b,
.app-shell .score-block b,
.app-shell .profile-counts b { font-size: var(--fs-section); }
.app-shell .profile-summary-strip small,
.app-shell .score-block small,
.app-shell .score-block em,
.app-shell .detail-info-row small { font-size: var(--fs-small); }
.app-shell .saved-empty-icon { font-size: 34px; }

/* Modals render into #modal-root and the toast into #toast â€” both outside
   .app-shell, so they need their own scope to win the same ties. */
#modal-root .modal h1,
#modal-root .detail-title-block h1 { font-size: var(--fs-page); }
#modal-root .modal h2 { font-size: var(--fs-section); }
#modal-root .modal b,
#modal-root .detail-info-row .dir-copy b { font-size: var(--fs-title); }
#modal-root .modal small,
#modal-root .detail-info-row .dir-copy small,
#modal-root .modal .lede { font-size: var(--fs-small); }
#modal-root .detail-info-row { padding: 8px 0; gap: 10px; }
#modal-root .detail-info-row .dir-art { width: 26px; height: 26px; border-radius: 8px; }
#modal-root .detail-info-row .dir-copy b { font-size: 15px; line-height: 1.12; }
#modal-root .detail-info-row .dir-copy small { margin-top: 1px; line-height: 1.2; }
#modal-root .modal .lede { font-size: var(--fs-body); }
#toast, #toast b { font-size: var(--fs-body); }
.app-shell .saved-empty-icon { font-size: 38px; }

/* ============================================================
   Illustrated category tiles (Profile â†’ Your top types)
   Glovo-style: art in a white circle, ring highlight on select.
   ============================================================ */

.taste-tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px 8px;
  margin-top: 14px;
}
.taste-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0;
  background: transparent;
}
.taste-tile-art {
  display: grid;
  width: 72px;
  height: 72px;
  place-items: center;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: 0 2px 0 rgba(25, 26, 25, .10);
  transition: box-shadow .15s ease, transform .15s ease;
}
.taste-tile-art svg { width: 44px; height: 44px; }
.taste-tile b {
  max-width: 100%;
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 600;
  line-height: 1.2;
  text-align: center;
  text-wrap: balance;
}
.taste-tile:hover .taste-tile-art { transform: translateY(-1px); }
/* The ring sits outside the circle, so nothing shifts on select */
.taste-tile.selected .taste-tile-art {
  box-shadow: 0 0 0 3px var(--accent), 0 2px 0 rgba(25, 26, 25, .10);
}
.taste-tile.selected b { color: var(--accent-strong); font-weight: 800; }
@media (prefers-reduced-motion: reduce) { .taste-tile-art { transition: none; } }

/* ---- Filter intro ---------------------------------------------------- */
.filter-intro { margin: 2px 0 14px; }
.filter-intro h2 { margin: 0 0 6px; }
.filter-intro p { margin: 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.45; text-wrap: pretty; }

/* ---- Where / What sheets, matching the When sheet -------------------- */
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.sheet-head h3 { margin: 0; font-size: var(--fs-title); font-weight: 800; letter-spacing: -.02em; }
.where-sheet .filter-options, .what-sheet .filter-options { gap: 8px; }

/* ---- Detail secondary actions --------------------------------------- */
.detail-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 0; }
.detail-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 13px 10px;
  border: 1.5px solid rgba(25, 26, 25, .16);
  border-radius: 999px;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--ds-font);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0;
  text-align: center;
  text-transform: none;
}
.detail-action:hover { border-color: var(--ink); }
.detail-action .cal-ic { display: grid; place-items: center; }
.detail-action .cal-ic svg { width: 16px; height: 16px; stroke-width: 1.8; }
/* Save / Going match the same shape, weight and casing */
.detail-decide-bar button {
  font-family: var(--ds-font);
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}
.detail-decide-bar .decide-going { font-weight: 700; letter-spacing: 0; text-transform: none; }
.taste-more-link { display: block; margin: 16px auto 0; }

/* ============================================================
   Route transition â€” Discover / Saved / Profile slide in the
   direction you travelled along the tab bar.
   ============================================================ */

/* The incoming half of the swipe: the new page arrives from the side you were
   heading towards, just after the old one has slid off (see setRoute). It comes
   in from further out than it left, which is what sells it as one gesture. */
@keyframes page-slide-left {
  from { opacity: 0; transform: translate3d(38px, 0, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes page-slide-right {
  from { opacity: 0; transform: translate3d(-38px, 0, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
.page { animation: page-slide-left .24s cubic-bezier(.16, .84, .44, 1) both; }
body.nav-back .page { animation-name: page-slide-right; }
@media (prefers-reduced-motion: reduce) {
  .page, body.nav-back .page { animation: none; }
}

/* ---- Filter rows: criterion only ------------------------------------ */
.search-card-row .sc-copy b { font-size: var(--fs-title); font-weight: 600; color: var(--muted); }
.search-card-row.is-set .sc-copy b { color: var(--ink); font-weight: 800; }
.search-card-row.is-set .sc-dot { color: #fff; background: var(--accent); }
.search-card-row.is-set .sc-dot svg { color: #fff; stroke: #fff !important; }
.filter-intro { margin: 2px 0 12px; }

/* ---- Saved calendar, matching the filter calendar -------------------- */
.planner-cal { margin-top: 6px; }
.planner-cal .cal-day { position: relative; font-weight: 600; }
.planner-cal .cal-day.has-plans { color: var(--accent-strong); font-weight: 800; }
.planner-cal .cal-plan-dot {
  position: absolute;
  bottom: 3px;
  left: 50%;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: var(--accent);
}
.planner-next { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }

/* ============================================================
   Search row â€” pill field with a round filter button beside it
   ============================================================ */

.search-row { display: flex; align-items: center; gap: 10px; margin: 3px 6px 0; }

.search-field {
  display: flex;
  flex: 1;
  min-width: 0;
  align-items: center;
  gap: 9px;
  height: 46px;
  padding: 0 15px;
  border: 1px solid rgba(25, 26, 25, .18);
  border-radius: 999px;
  background: var(--paper);
  transition: border-color .15s ease;
}
.search-field:hover { border-color: rgba(25, 26, 25, .34); }
.search-field:focus-within { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.search-field .search-ic { display: grid; flex: none; place-items: center; color: rgba(25, 26, 25, .55); font-size: 0; }
.search-field .search-ic svg { width: 20px; height: 20px; stroke-width: 2; }
.search-field input {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--ds-font);
  font-size: var(--fs-body);
  font-weight: 500;
  outline: 0;
}
.search-field input::placeholder { color: rgba(25, 26, 25, .5); font-weight: 400; }

.filter-round-btn {
  position: relative;
  display: grid;
  flex: none;
  width: 46px;
  height: 46px;
  place-items: center;
  border: 1.5px solid rgba(25, 26, 25, .28);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink);
  transition: border-color .15s ease, background .15s ease;
}
.filter-round-btn svg { width: 20px; height: 20px; stroke-width: 1.9; }
.filter-round-btn:hover { border-color: var(--ink); }
.filter-round-btn.open { border-color: var(--ink); color: #fff; background: var(--ink); }
.filter-round-count {
  position: absolute;
  top: -2px;
  right: -2px;
  display: grid;
  min-width: 20px;
  height: 20px;
  place-items: center;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--ink);
  font-size: var(--fs-label);
  font-style: normal;
  font-weight: 800;
}

/* Criteria revealed by the filter button */
.filter-panel-rows {
  overflow: hidden;
  margin-bottom: 16px;
  padding: 4px 14px 10px;
  border-radius: 20px;
  background: var(--paper);
  box-shadow: 0 4px 0 rgba(25, 26, 25, .10);
  animation: filter-panel-in .22s cubic-bezier(.22, .61, .36, 1) both;
}
@keyframes filter-panel-in {
  from { opacity: 0; transform: translate3d(0, -8px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}
@media (prefers-reduced-motion: reduce) { .filter-panel-rows { animation: none; } }
.filter-panel-rows .search-card-clear { margin-top: 4px; }

/* ============================================================
   Bo the Bear â€” mascot lockup at the top of Discover
   ============================================================ */

  align-items: flex-end;

}
.bo-lockup-card b { color: var(--accent-strong); font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
.bo-lockup-card small {
  margin-top: 5px;
  color: rgba(25, 26, 25, .5);
  font-size: var(--fs-label);

}

/* Bo standing in for a missing photo should sit on the card, not fill it */

body[data-route="home"] .topbar,
body[data-route="social"] .topbar,
body[data-route="profile"] .topbar { align-items: flex-end; height: 66px; padding: 4px 18px 0 10px; }

body[data-route="social"] .topbar-bo,

/* Detail cards should read dense and scannable instead of stretching every

/* App canvas is pure white. redesign.css paints .page/main/.app-stage with a
   warm cream, so those are overridden here alongside the shell. */
.app-shell, .page, main, .onboarding, .app-stage { background: var(--cream); }
.topbar, .bottom-nav { background: var(--paper); }
/* Cards are white on white now, so the hard offset shadow does the separating
   and gets a hairline to sit on. */
.event-card, .event-row, .feature-card, .insight-card, .follow-card, .stat-card,
.activity-card, .group-card, .community-card, .interest-event, .friend-feed-card,
.share-group, .suggestion-card, .anchor-pick, .managed-list-row, .attend-row,
.occurrence-row, .top-type, .search-card, .filter-panel-rows, .going-card,
.profile-goal, .top-ten {
  border: 1px solid rgba(25, 26, 25, .08);
}

/* ---- Repeat strip: which weekdays a series lands on ------------------ */
.repeat-strip {
  display: flex;
  gap: 3px;
  margin-top: 8px;
}
.repeat-strip i {
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  border-radius: 50%;
  background: rgba(25, 26, 25, .05);
  color: rgba(25, 26, 25, .35);
  font-size: 10px;
  font-style: normal;
  font-weight: 700;
  line-height: 1;
}
.repeat-strip i.on { color: var(--accent-strong); background: var(--mint-tint); font-weight: 800; }

/* ---- Detail schedule: pattern + month grid for recurring events ------ */
.detail-schedule { margin: 18px 0 4px; }
.detail-schedule-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.detail-schedule-head .repeat-strip { margin-top: 0; }
.detail-schedule-copy { display: flex; flex-direction: column; }
.detail-schedule-copy.detail-schedule-inline { flex-direction: row; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.detail-schedule-copy b { font-size: var(--fs-title); font-weight: 700; letter-spacing: -.01em; }
.detail-schedule-copy small { margin-top: 2px; color: var(--muted); font-size: var(--fs-small); }
.detail-schedule-copy.detail-schedule-inline small { margin-top: 0; }
.detail-schedule .cal-hint { margin: 8px 0 12px; }
.detail-schedule .cal-day.is-off { color: rgba(25, 26, 25, .25); font-weight: 500; }
.detail-schedule .cal-day.has-plans { color: var(--accent-strong); font-weight: 800; }
.detail-schedule .cal-day.cal-picked { color: var(--accent); background: var(--ink); }
.detail-schedule .cal-day.cal-picked .cal-plan-dot { background: var(--accent); }
.detail-schedule .cal-plan-dot {
  position: absolute;
  bottom: 3px;
  left: 50%;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: var(--accent);
}
.detail-schedule .cal-day { position: relative; }

/* ============================================================
   Today's five â€” the card deck at the top of Discover.
   Modelled on the Strava "Instant Workouts" and Wabi decks: the
   card you are on sits square in the middle, the rest fan out
   behind it on both sides, and you throw the front one away to
   get to the next. CSS owns what each depth looks like; the JS
   in initTodayHero owns which card is at which depth.
   ============================================================ */

.today-hero { margin: 2px 0 22px; }
/* The numeral badge deliberately echoes the "10" on Top 10 events this week,
   so the two ranked surfaces read as one family. */
.today-hero-head {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 2px 15px;
}
.today-hero-badge {
  display: grid;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  place-items: center;
  border-radius: 15px;
  background: var(--ink);
  color: var(--accent);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: -.03em;
  box-shadow: 0 6px 16px -6px rgba(9, 12, 10, .5);
}
.today-hero-headings { min-width: 0; }
.today-hero-head h2 {
  margin: 2px 0 0;
  font-size: var(--fs-page);
  font-weight: 900;
  letter-spacing: -.035em;
}
.today-hero-head .eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  color: var(--accent-strong);
}
.today-hero-live {
  flex: 0 0 auto;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--mint-tint);
  animation: today-live-pulse 2.4s ease-in-out infinite;
}
@keyframes today-live-pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--mint-tint); }
  50% { box-shadow: 0 0 0 6px rgba(0, 200, 151, .16); }
}

/* ---- "What's happening" ---------------------------------------------- */
/* Same weight and tracking as the deck heading, with a mint rule under it so
   the feed reads as a section start rather than another row of text. */
.feed-section .section-heading .feed-heading-copy { min-width: 0; }
.feed-section .section-heading .eyebrow { margin: 0 0 1px; color: var(--accent-strong); }
.feed-section .section-heading h2 {
  position: relative;
  display: inline-block;
  padding-bottom: 7px;
  font-size: var(--fs-page);
  font-weight: 900;
  letter-spacing: -.035em;
}
.feed-section .section-heading h2::after {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 46px;
  height: 4px;
  border-radius: 999px;
  background: var(--accent);
  content: "";
}

/* The deck is the stage. Cards are absolutely centred inside it and the fan
   spills past the edges, so nothing here may clip. */
.today-deck {
  position: relative;
  height: clamp(392px, 96vw, 476px);
  /* Room for the fanned corners at either side. */
  margin: 0 6px;
  touch-action: pan-y;
}
.today-deck:focus-visible { outline: 3px solid var(--accent); outline-offset: 10px; border-radius: 30px; }

.today-card {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  width: min(83%, 342px);
  height: 100%;
  /* Auto margins against both edges, not a 50% offset â€” a percentage/pixel
     min() pair resolves on different branches for width and margin and lands
     the card off-centre. */
  margin: 0 auto;
  overflow: hidden;
  border-radius: 28px;
  background: var(--ink);
  box-shadow: 0 18px 38px -12px rgba(9, 12, 10, .42), 0 2px 8px rgba(9, 12, 10, .16);
  transform-origin: 50% 50%;
  transition: transform .42s cubic-bezier(.22, .61, .36, 1), opacity .34s ease, filter .34s ease;
  will-change: transform;
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.today-card.is-front { cursor: grab; }
.today-card.is-dragging { cursor: grabbing; transition: none; }
/* Used for one frame while a thrown card is restacked at the back, so it
   doesn't visibly sail back across the screen. */
.today-card.no-transition { transition: none; }

/* The fan. Depth 0 is the card you are on; 1 and 2 lean out either side of it,
   3 is the tail of the stack, and "out" is the card being thrown away. */
.today-card[data-depth="0"] { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); opacity: 1; }
.today-card[data-depth="1"] { transform: translate3d(-22px, 0, 0) rotate(-5.5deg) scale(.955); opacity: 1; filter: brightness(.84); }
.today-card[data-depth="2"] { transform: translate3d(22px, 0, 0) rotate(5.5deg) scale(.918); opacity: 1; filter: brightness(.74); }
.today-card[data-depth="3"] { transform: translate3d(3px, 0, 0) rotate(1.5deg) scale(.884); opacity: .85; filter: brightness(.66); }
.today-card[data-depth="out"] { opacity: 0; transition: transform .3s cubic-bezier(.4, 0, .8, .3), opacity .3s ease; }
/* Only the front card takes pointer events, so a fanned corner is never a
   tap target for the event underneath it. */
.today-card:not(.is-front) { pointer-events: none; }

.today-card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  /* A slow drift on the live card, so a still photo still feels alive. */
  transform: scale(1.04);
  transition: transform 7s ease-out;
}
.today-card.is-front .today-card-img { transform: scale(1.11); }
.today-card-img.is-fallback-image { object-fit: contain; background: #f7fafc; transform: none; }
.today-card.is-front .today-card-img.is-fallback-image { transform: none; }

.today-card-shade {
  position: absolute;
  inset: 0;
  /* Heavy at both ends: the facts sit on the top scrim and the title on the
     bottom one, and event photos are as often near-white as they are dark. */
  background: linear-gradient(to top, rgba(9, 12, 10, .9) 0%, rgba(9, 12, 10, .58) 30%, rgba(9, 12, 10, .1) 56%, rgba(9, 12, 10, .3) 82%, rgba(9, 12, 10, .58) 100%);
  pointer-events: none;
}
/* The glassy diagonal the reference decks all carry. */
.today-card-sheen {
  position: absolute;
  inset: 0;
  background: linear-gradient(118deg, rgba(255, 255, 255, .17) 0%, rgba(255, 255, 255, .05) 26%, rgba(255, 255, 255, 0) 46%, rgba(255, 255, 255, .07) 78%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
}
.today-card-hit { position: absolute; inset: 0; width: 100%; background: transparent; }

.today-card-top {
  position: absolute;
  top: 17px;
  right: 16px;
  left: 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  pointer-events: none;
}
/* Label over value, the way the reference cards head their stats. */
.today-card-facts { display: flex; gap: 16px; min-width: 0; }
.today-fact { display: flex; min-width: 0; flex-direction: column; gap: 1px; color: #fff; }
.today-fact small {
  font-size: var(--fs-micro);
  font-weight: 600;
  opacity: .72;
  text-shadow: 0 1px 8px rgba(0, 0, 0, .4);
}
.today-fact b {
  overflow: hidden;
  font-size: var(--fs-body);
  font-weight: 800;
  letter-spacing: -.01em;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-shadow: 0 1px 10px rgba(0, 0, 0, .45);
}
.today-card-tools {
  display: flex;
  flex: 0 0 auto;
  gap: 7px;
  pointer-events: auto;
  transition: opacity .28s ease;
}
/* Only the card you are on carries its copy. On the fanned ones all you see is
   a sliver, so a truncated "Staâ€¦ 4:â€¦" is noise â€” they read as plain slabs until
   they come forward, the way the reference decks do. */
.today-card-top,
.today-card-copy { transition: opacity .22s ease; }
.today-card:not(.is-front) .today-card-top,
.today-card:not(.is-front) .today-card-copy { opacity: 0; }
.today-card-tool {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(9, 12, 10, .42);
  color: #fff;
  backdrop-filter: blur(7px);
}
.today-card-tool svg { width: 17px; height: 17px; stroke-width: 2; }
.today-card-tool.card-save.is-saved { background: var(--accent); color: #fff; }
.today-card-tool.card-save.is-saved svg { fill: currentColor; }

.today-card-copy {
  position: absolute;
  right: 18px;
  bottom: 20px;
  left: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #fff;
  pointer-events: none;
  text-shadow: 0 1px 14px rgba(0, 0, 0, .42);
}
.today-card-title {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.14;
  letter-spacing: -.028em;
  /* Two lines maximum, so every card in the deck has the same footprint. */
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.today-card-venue {
  font-size: var(--fs-body);
  font-weight: 600;
  opacity: .95;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.today-card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  margin-top: 3px;
  font-size: var(--fs-small);
  font-weight: 500;
  opacity: .84;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.today-card-price {
  flex: 0 0 auto;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .2);
  font-size: var(--fs-micro);
  font-style: normal;
  font-weight: 700;
}

.today-hero-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 26px 18px 0;
}
.today-dot {
  width: 6px;
  height: 6px;
  padding: 0;
  border-radius: 999px;
  background: rgba(25, 26, 25, .18);
  transition: width .3s cubic-bezier(.22, .61, .36, 1), background .3s ease;
}
.today-dot.is-on { width: 20px; background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  .today-hero-live { animation: none; }
  .today-card { transition: none; }
  .today-card-img,
  .today-card.is-front .today-card-img { transform: none; transition: none; }
  .today-dot { transition: none; }
}

/* ============================================================
   PHONE PROPORTIONS + iOS SAFE AREAS
   The shell used to be 620px wide with zero top inset, so on device the
   wordmark sat behind the clock and battery, and in the browser the preview
   was far wider than any iPhone. Two fixes:
     - one shell width that matches a real phone (430px = iPhone Pro Max)
     - every fixed/sticky edge padded by the device's own safe-area insets
   `viewport-fit=cover` in index.html is what makes env() return real numbers.
   ============================================================ */

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --shell-max: 430px;
}

.app-shell {
  width: min(100%, var(--shell-max));
  padding-right: var(--safe-right);
  padding-left: var(--safe-left);
}

/* Reserve the status bar strip. `max()` keeps the old 4px breathing room on
   hardware that reports no inset (Android, desktop, older iPhones). */
body[data-route="home"] .topbar,
body[data-route="social"] .topbar,
body[data-route="profile"] .topbar {
  height: auto;
  min-height: 66px;
  padding-top: max(4px, var(--safe-top));
}
.topbar { padding-top: max(10px, var(--safe-top)); }

/* Mirror image at the bottom: clear the home indicator. */
.bottom-nav { bottom: calc(9px + var(--safe-bottom)); }
#toast { bottom: calc(87px + var(--safe-bottom)); }

/* The desktop preview has no hardware insets to read, so hand it the metrics of
   a notched iPhone. What you see while testing then matches what ships. */
@media (min-width: 700px) {
  .app-shell {
    --safe-top: 47px;
    --safe-bottom: 22px;
    min-height: min(calc(100vh - 32px), 932px);
    max-height: min(calc(100vh - 32px), 932px);
  }
  .app-shell::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    z-index: 11;
    height: 47px;
    background: var(--paper);
    pointer-events: none;
  }
  .bottom-nav { bottom: calc(25px + 22px); }
}
@media (min-width: 1040px) {
  .app-stage { grid-template-columns: 330px var(--shell-max); }
  .app-shell { width: var(--shell-max); }
  .bottom-nav { left: auto; width: calc(var(--shell-max) - 20px); }
}

/* ============================================================
   EVENT DETAIL SHEET
   Travels the full height of the screen on open rather than nudging up 35px,
   then holds the facts in grouped cards on a recessed background.
   ============================================================ */

.detail-backdrop { align-items: flex-end; }

.modal.event-detail-sheet {
  display: flex;
  flex-direction: column;
  width: min(100%, var(--shell-max));
  height: calc(100dvh - max(12px, var(--safe-top)));
  max-height: calc(100dvh - max(12px, var(--safe-top)));
  padding-right: var(--safe-right);
  padding-left: var(--safe-left);
  overflow: hidden;
  border-radius: 22px 22px 0 0;
  background: var(--cream);
  animation: detail-rise .42s cubic-bezier(.22, .68, .3, 1);
}
@supports not (height: 100dvh) {
  .modal.event-detail-sheet { height: calc(100vh - max(12px, var(--safe-top))); max-height: calc(100vh - max(12px, var(--safe-top))); }
}

/* The whole point of the redesign: the card rises from off-screen. */
@keyframes detail-rise {
  from { transform: translate3d(0, 100%, 0); }
  to { transform: translate3d(0, 0, 0); }
}

.detail-topbar {
  position: relative;
  z-index: 4;
  flex: 0 0 auto;
  padding: 7px 10px 8px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.detail-grabber {
  display: block;
  width: 38px;
  height: 4px;
  margin: 0 auto 9px;
  border-radius: 999px;
  background: rgba(25, 26, 25, .18);
}
.detail-topbar-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  align-items: center;
}
.detail-topbar-title {
  color: var(--ink);
  font-family: var(--display);
  font-size: var(--fs-title);
  font-weight: 800;
  text-align: center;
}
#modal-root .event-detail-sheet .detail-topbar-btn {
  position: static;
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 0;
  border-radius: 50%;
  color: var(--ink);
  background: rgba(25, 26, 25, .06);
  box-shadow: none;
  font-size: 19px;
  line-height: 1;
}
.detail-topbar-share svg { width: 16px; height: 16px; stroke-width: 2; }

.detail-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

#modal-root .event-detail-sheet .detail-hero { position: relative; min-height: 0; height: 216px; padding: 0; overflow: hidden; }
#modal-root .event-detail-sheet .detail-hero.has-image { min-height: 0; height: 216px; }
.event-detail-sheet .detail-hero.has-image::after {
  content: none;
}
.event-detail-sheet .detail-hero-img { z-index: 1; object-fit: contain; background: #f7fafc; }
.event-detail-sheet .detail-hero.has-knockout-image,
.event-detail-sheet .detail-hero-img.is-knockout-image {
  background: #111715;
}

#modal-root .event-detail-sheet .detail-body {
  display: grid;
  gap: 14px;
  padding: 18px 16px 26px;
  background: var(--cream);
}
#modal-root .event-detail-sheet .detail-title-block { gap: 4px; margin: 0; }
/* Sentence case here only. Long event titles set in all caps become a wall. */
#modal-root .event-detail-sheet .detail-title-block h1 { font-size: 28px; line-height: 1.08; letter-spacing: -.5px; text-transform: none; }
.event-detail-sheet .detail-title-block .event-meta {
  color: var(--accent-strong);
  font-size: var(--fs-label);
  font-weight: 800;
  letter-spacing: .9px;
  text-transform: uppercase;
}
#modal-root .event-detail-sheet .detail-description { margin: 0; color: var(--muted); font-size: var(--fs-body); line-height: 1.45; }

/* Grouped fact cards, per the reference screens. */
.detail-group {
  display: grid;
  overflow: hidden;
  border-radius: 16px;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(25, 26, 25, .05), 0 6px 18px -12px rgba(25, 26, 25, .3);
}
.detail-group-flat { box-shadow: none; }
#modal-root .event-detail-sheet .detail-group-row {
  display: grid;
  gap: 2px;
  width: 100%;
  padding: 13px 15px;
  border: 0;
  border-radius: 0;
  background: transparent;
  text-align: left;
}
.detail-group-row + .detail-group-row,
.detail-group-row + .detail-occurrences { border-top: 1px solid var(--line); }
.detail-group-label { color: var(--muted); font-size: var(--fs-small); font-weight: 600; }
.detail-group-row b { color: var(--ink); font-family: var(--display); font-size: var(--fs-body); font-weight: 700; line-height: 1.25; }
.detail-group-row small { color: var(--muted); font-size: var(--fs-micro); }
.detail-group-links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 5px; }
#modal-root .event-detail-sheet .detail-group-link {
  margin-top: 3px;
  padding: 0;
  border: 0;
  border-radius: 0;
  color: var(--accent-strong);
  background: transparent;
  font-size: var(--fs-small);
  font-weight: 700;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
}
.detail-group-links .detail-group-link { margin-top: 0; }
.detail-group-row.selected .detail-group-link { color: var(--muted); }
.detail-group-static { cursor: default; }

#modal-root .event-detail-sheet .detail-occurrences,
#modal-root .event-detail-sheet .detail-schedule { margin: 0; padding: 10px 15px 12px; }
#modal-root .event-detail-sheet .detail-schedule-head { margin: 0; padding: 0; border: 0; background: transparent; }
.event-detail-sheet .detail-occurrences .eyebrow { margin: 0 0 5px; }

.event-detail-sheet .attendee-line { margin: 0; }
.event-detail-sheet .event-source-credit { margin: 0; }
.event-detail-sheet .rsvp-hint { margin: 0; }

/* Pinned to the sheet, not sticky inside a scroller â€” so it never overhangs. */
#modal-root .event-detail-sheet .detail-decide-bar {
  position: relative;
  z-index: 3;
  flex: 0 0 auto;
  margin: 0;
  padding: 11px 16px calc(11px + var(--safe-bottom));
  border-top: 1px solid var(--line);
  background: var(--paper);
}

@media (prefers-reduced-motion: reduce) {
  .modal.event-detail-sheet { animation: none; }
}

/* The collapsed-description fade was offset for the old sheet's action row.
   Inside the new sheet the clamped text ends where the block ends. */
#modal-root .event-detail-sheet .detail-description-wrap { gap: 0; }
#modal-root .event-detail-sheet .things-to-do-description.collapsed::after { bottom: 0; height: 30px; background: linear-gradient(180deg, rgba(252, 252, 250, 0), var(--cream)); }

/* ============================================================
   Venue avatars
   A followed venue shows its own artwork. The letter disc is the fallback, not
   the default. Logos are contained so a wordmark never gets its name cropped;
   photographs fill the frame.
   ============================================================ */

.group-icon.has-venue-image,
.top-type .tt-art.has-venue-image {
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
}
.group-icon.has-venue-image img,
.top-type .tt-art.has-venue-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.group-icon.has-venue-image.is-logo img,
.top-type .tt-art.has-venue-image.is-logo img {
  object-fit: contain;
  padding: 2px;
}
/* White-on-transparent wordmarks need something to be white against. */
.group-icon.has-venue-image.is-knockout,
.top-type .tt-art.has-venue-image.is-knockout {
  border-color: var(--ink);
  background: var(--ink);
}
.followed-venue-card .group-icon,
.follow-card .group-icon { flex: 0 0 auto; border-radius: 50%; }

/* ============================================================
   Profile page width
   .profile-page is a grid, and a grid item's automatic minimum size is its
   min-content width. The one-line bio is `white-space: nowrap`, so its
   min-content was the entire un-wrapped sentence â€” ~557px of it â€” which sized
   the single column and pushed every card on the page off the right edge of the
   phone. min-width: 0 lets the column shrink back to the shell, and the bio
   ellipsises the way it was always meant to.
   ============================================================ */

.page > * { min-width: 0; }
.profile-id { width: 100%; min-width: 0; }
.profile-id .pid-bio { width: 100%; min-width: 0; max-width: 100%; }
/* A long display name wraps onto a second line rather than shoving the Share
   and Edit buttons off the edge. */
.profile-page .discover-heading { gap: 10px; }
.profile-page .discover-heading > div:first-child { min-width: 0; }
.profile-page .discover-heading h1 { overflow-wrap: anywhere; }
.profile-page .profile-top-actions { flex: 0 0 auto; }

/* ============================================================
   Tab bar
   The active tab still turns green; behind it a soft grey oval slides across to
   whichever tab you are on. It is a single pseudo-element on the bar, moved a
   column at a time, so the travel is continuous instead of a cross-fade.
   ============================================================ */

.bottom-nav::before {
  content: "";
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: 8px;
  z-index: 0;
  width: calc((100% - 16px) / 3);
  border-radius: 999px;
  background: rgba(25, 26, 25, .07);
  transition: transform .34s cubic-bezier(.22, .68, .3, 1);
  pointer-events: none;
}
body[data-route="social"] .bottom-nav::before { transform: translateX(100%); }
body[data-route="profile"] .bottom-nav::before { transform: translateX(200%); }
.nav-item { position: relative; z-index: 1; }

@media (prefers-reduced-motion: reduce) {
  .bottom-nav::before { transition: none; }
}

/* ============================================================
   Tab bar â€” docked to the bottom of the phone
   The bar is the floor of the screen, not a pill floating above it. It used to
   sit 9px up with 10px of air either side and a translucent background, so event
   cards showed through below and beside it while the feed scrolled. It is now
   flush to the bottom edge, full width and opaque: nothing passes underneath.
   The home-indicator inset is paid as padding inside the bar rather than as an
   offset beneath it, which is what left the gap in the first place.
   ============================================================ */

:root { --nav-row: 58px; }

.bottom-nav {
  right: 0;
  bottom: 0;
  left: 0;
  width: min(100%, var(--shell-max));
  height: calc(var(--nav-row) + var(--safe-bottom));
  margin: 0 auto;
  padding: 8px 8px calc(8px + var(--safe-bottom));
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  box-shadow: 0 -8px 20px -14px rgba(25, 26, 25, .3);
  backdrop-filter: none;
}
/* The sliding oval sits in the row, not in the home-indicator strip below it. */
.bottom-nav::before { bottom: calc(6px + var(--safe-bottom)); }

/* Content has to end above the bar rather than behind it â€” the feed keeps its
   own breathing room on top of the bar's height. */
main { padding-bottom: calc(var(--nav-row) + var(--safe-bottom) + 22px); }
#toast { bottom: calc(var(--nav-row) + var(--safe-bottom) + 14px); }

/* In the desktop preview "the bottom of the phone" is the bottom of the fake
   handset, which is shorter than the window. Same expressions that size the
   frame, so the bar cannot drift away from it. */
@media (min-width: 700px) {
  .bottom-nav { bottom: calc(100vh - 16px - min(100vh - 32px, 932px)); }
}
@media (min-width: 1040px) {
  /* The stage centres a 330px sidebar + 44px gap + the handset, so the handset's
     left edge is a fixed distance from the middle of the window. */
  .bottom-nav {
    right: auto;
    bottom: calc(100vh - 24px - min(100vh - 32px, 932px));
    left: calc(50vw - (374px + var(--shell-max)) / 2 + 374px);
    width: var(--shell-max);
    margin: 0;
  }
  /* Production drops the sidebar, so the handset is centred again. */
  .production-app .bottom-nav { right: 0; left: 0; margin: 0 auto; }
}

/* The signup interest picker is the profile's taste picker, so it inherits the
   circles, the labels and the mint selection ring. It only needs the spacing the
   text grid it replaced used to provide. */
.onboard-taste-tiles { margin-bottom: 22px; }
.onboarding .taste-tile-art { border: 1px solid var(--line); }
.onboarding .taste-tile.selected .taste-tile-art { border-color: var(--accent); }

function isAlcoholSpecificEvent(event) {
  const category = String(event?.cat || "").toLowerCase();
  if (category === "happy-hours") return true;
  if (category === "nightlife") return true;
  const text = `${event?.title || ""} ${event?.venue || ""} ${event?.area || ""} ${event?.desc || ""} ${event?.tag || ""} ${(eventTags(event) || []).join(" ")}`.toLowerCase();
  return /\b(happy\s*hour|cocktail|cocktails|beer|draft beer|wine|shots?|drink specials?|open bar|bar crawl|boozy|bottomless|brewery|brewing|distillery|distilling|cider|seltzer|margarita|martini|whiskey|whisky|bourbon|vodka|tequila|rum|gin|21\+|adults only|adults-only)\b/.test(text);
}

function isAgeAllowedEvent(event) {
  return !userIsUnder21() || !isAlcoholSpecificEvent(event);
}

function registerLocalVenueProfile() {
  const name = accountVenueName();
  const image = currentVenueImage();
  if (!name || !image) return;
  const key = venueImageKeyName(name);
  venueImageMap[key] = image;
  venueImageKeys = Object.keys(venueImageMap).sort((a, b) => b.length - a.length);
  const existing = venueDirectory.find(venue => venueImageKeyName(venue.name) === key);
  if (existing) existing.image_url = image;
  else venueDirectory.unshift({ name, address: state.profile.venueAddress || "", neighborhood: (state.profile.areas || [])[0] || "", venue_type: "Venue", website_url: state.profile.venueWebsite || "", image_url: image });
}

// Record a save/RSVP by the event's stable source id and persist it.
function setPlanSource(kind, id, on) {
  const event = events.find(item => item.id === Number(id));
  if (!event) return;
  const sourceId = String(event.sourceId || event.id);
  const store = kind === "saved" ? state.savedSources : kind === "rsvp" ? state.rsvpSources : state.calendarSources;
  on ? store.add(sourceId) : store.delete(sourceId);
  const storageKey = kind === "saved" ? "lokalSavedSources" : kind === "rsvp" ? "lokalRsvpSources" : "lokalCalendarSources";
  localStorage.setItem(storageKey, JSON.stringify(Array.from(store)));
}

// Re-link persisted saves/RSVPs onto the freshly loaded events (runtime ids change
// every sync, so we match by stable source id).
function reconcileUserPlans() {
  events.forEach(event => {
    const sourceId = String(event.sourceId || event.id);
    if (state.savedSources.has(sourceId)) state.saved.add(event.id);
    if (state.rsvpSources.has(sourceId)) state.rsvps.add(event.id);
    if (state.calendarSources.has(sourceId)) state.calendarAdds.add(event.id);
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
}

async function copyText(value) {
  const text = String(value || "");
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return true;
  }
  const input = document.createElement("textarea");
  input.value = text;
  input.setAttribute("readonly", "");
  input.style.position = "fixed";
  input.style.opacity = "0";
  document.body.appendChild(input);
  input.select();
  const copied = document.execCommand("copy");
  input.remove();
  return copied;
}

function publicAppBaseUrl() {
  const isLocal = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname);
  if (isLocal) return "https://willsingle05-a11y.github.io/LokalAppDC/";
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  return url.toString();
}

function stableHash(value) {
  return Array.from(String(value || "")).reduce((hash, character) => ((hash << 5) - hash + character.charCodeAt(0)) | 0, 0);
}

function currentReferralCode() {
  const stored = localStorage.getItem("lokalReferralCode");
  if (stored) return stored;
  const name = state.profile?.username || state.profile?.fullName || "lokal";
  const userKey = typeof currentInteractionUserId === "function" ? currentInteractionUserId() : localStorage.getItem("lokalInteractionUserId") || name;
  const slug = String(name).toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "lokal";
  const suffix = Math.abs(stableHash(userKey)).toString(36).slice(0, 6) || "invite";
  const code = `${slug}-${suffix}`;
  localStorage.setItem("lokalReferralCode", code);
  return code;
}

function captureIncomingReferral() {
  const params = new URLSearchParams(location.search);
  const hashInvite = decodeURIComponent(location.hash || "").match(/#\/?([a-z0-9-]+)\.invite/i)?.[1] || "";
  const code = params.get("ref") || params.get("invite") || params.get("r") || hashInvite;
  if (!code) return;
  localStorage.setItem("lokalIncomingReferralCode", code);
  localStorage.setItem("lokalIncomingInviterKey", params.get("inviter") || "");
  localStorage.setItem("lokalIncomingInviterName", params.get("from") || "");
}

function appInviteDetails() {
  const code = currentReferralCode();
  const url = new URL(publicAppBaseUrl());
  url.hash = `/${code}.invite`;
  return {
    code,
    url: url.toString(),
    displayUrl: `https://LokalAppDC/#/${code}.invite`,
    inviterUserKey: typeof currentInteractionUserId === "function" ? currentInteractionUserId() : "",
    inviterName: state.profile?.fullName || "",
    inviterUsername: state.profile?.username || ""
  };
}

function savePointAwardLedger() {

}

function pointWeekStart(timestamp = Date.now()) {
  const date = new Date(timestamp);
  const day = date.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + mondayOffset).getTime();
}

function pointCapKeyForAction(action) {
  const text = String(action || "").toLowerCase();
  if (text.includes("saved an event") || text.includes("rsvp")) return "event-plan";
  if (text.includes("followed")) return "venue-follow";
  return "";
}

function weeklyPointCount(capKey, weekStart = pointWeekStart()) {
  if (!capKey) return 0;
  return (state.pointAwardLedger || state.pointNotifications || [])
    .filter(item => (item.capKey || pointCapKeyForAction(item.action)) === capKey && (item.weekStart || pointWeekStart(item.createdAt)) === weekStart)
    .length;
}

function recordLokalPoints(points, action, key = "", options = {}) {
  const amount = Number(points) || 0;
  if (!amount || !action) return null;
  const id = key || `${Date.now()}-${String(action).toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;
  state.pointNotifications = state.pointNotifications || [];
  if (state.pointNotifications.some(item => item.id === id)) return null;
  const weekStart = pointWeekStart();
  if (options.weeklyCapKey && weeklyPointCount(options.weeklyCapKey, weekStart) >= Number(options.weeklyCapLimit || 0)) {
    return null;
  }
  const item = { id, points: amount, action, createdAt: Date.now(), capKey: options.weeklyCapKey || "", weekStart };
  state.pointAwardLedger = [item, ...(state.pointAwardLedger || []).filter(entry => entry.id !== id)].slice(0, 120);
  savePointAwardLedger();
  state.pointNotifications = [item, ...state.pointNotifications].slice(0, 30);
  savePointNotifications();
  if (typeof refreshNotificationBadge === "function") refreshNotificationBadge();
  return item;
}

function avatarStack(friends) {
  if (!friends.length) return "";
  return `<span class="avatars">${friends.map(f => `<span class="avatar">${f}</span>`).join("")}</span>`;
}

function interestedFriendsForEvent(event) {
  const sourceKey = String(event?.sourceId || event?.id || "");
  const live = state.friendEventInterests?.get(sourceKey) || state.friendEventInterests?.get(String(event?.id || "")) || [];
  const fromLive = live
    .filter(friend => state.friends.has(friend.name))
    .map(friend => friend.initials || friendInitials(friend.name));
  return fromLive.filter((friend, index, all) => friend && all.indexOf(friend) === index).slice(0, 2);
}

function eventInterestSignal(event, detail = false) {
  const friends = interestedFriendsForEvent(event);
  if (!friends.length) return "";
  const live = state.friendEventInterests?.get(String(event?.sourceId || event?.id || "")) || state.friendEventInterests?.get(String(event?.id || "")) || [];
  const names = friends.map(friend => {
    const liveFriend = live.find(item => (item.initials || friendInitials(item.name)) === friend);
    return liveFriend?.name?.split(/\s+/)[0] || friendNames[friend] || friend;
  });
  const wording = names.length === 1 ? `${names[0]} is interested` : `${names[0]} and ${names[1]} are interested`;
  return `<div class="${detail ? "attendee-line" : "signal"}">${avatarStack(friends)} ${wording}</div>`;
}

function eventArtKind(event) {
  const tags = eventTags(event).join(" ").toLowerCase();
  const titleText = `${event.title || ""} ${event.venue || ""} ${event.cat || ""} ${tags}`.toLowerCase();
  let key = event.cat || "community";
  if (["happy-hours", "trivia-nights"].includes(key)) key = "nightlife";
  if (/museum|smithsonian|hirshhorn|renwick|portrait gallery|american art museum|air and space|natural history|american history/.test(titleText)) return "museum";
  if (/run club|running|run\b|5k|10k|marathon|jog/.test(titleText)) return "run";
  if (/baseball|mlb|nationals|nats\b/.test(titleText)) return "baseball";
  if (/basketball|nba|wnba|wizards|mystics/.test(titleText)) return "basketball";
  if (/soccer|mls|nwsl|d\.?c\.? united|dc united|washington spirit/.test(titleText)) return "soccer";
  if (/hockey|nhl|capitals|caps\b/.test(titleText)) return "hockey";
  if (/football|nfl|commanders/.test(titleText)) return "football";
  if (/comedy|stand-up|standup/.test(titleText)) key = "comedy";
  if (/film|cinema|movie|screening/.test(titleText)) key = "film";
  if (/gallery|art|exhibit|exhibition/.test(titleText)) key = "arts";
  if (/yoga|fitness|wellness|pickleball/.test(titleText)) key = "fitness";
  if (/nightlife|nightclub|club|bar|lounge|rooftop|cocktail|dance party|after dark|late night|dj set/.test(titleText)) key = "nightlife";
  if (/food|market|chef|brunch|wine|beer|cocktail|restaurant/.test(titleText)) key = "food";
  if (/embassy|ambassador|international|cultural|culture|heritage|global|foreign soil/.test(titleText)) key = "culture";

function eventImageLooksLogoLike(imageUrl) {
  const value = String(imageUrl || "").trim();
  if (!value) return false;
  if (/^data:image\//i.test(value)) return true;
  let path = value.toLowerCase();
  try {
    const parsed = new URL(value);
    path = `${parsed.pathname} ${parsed.search}`.toLowerCase();
  } catch (_) {}
  const fileName = path.split(/[/?#]/).filter(Boolean).pop() || path;
  return /\b(logo|logos|brand-image|icon|mark)\b/.test(fileName)
    || /(?:^|[._-])(logo|logos|icon|mark)(?:[._-]|$)/.test(fileName)
    || /\btr=w-(?:\d{1,2}|1\d\d)\b/.test(path);
}

function eventImageLooksKnockout(imageUrl) {
  const value = String(imageUrl || "").trim();
  if (!value || /^data:image\//i.test(value)) return false;
  let path = value.toLowerCase();
  try {
    const parsed = new URL(value);
    path = `${parsed.pathname} ${parsed.search}`.toLowerCase();

  return eventTags(event).slice(0, limit).map(tag => `<span class="event-tag">${escapeHtml(tag)}</span>`).join("");
}

function eventPriceLabel(event) {
  const category = String(event.cat || event.category || "").toLowerCase();
  if (["happy-hours", "trivia-nights", "museums"].includes(category)) return "";
  const price = String(event.price || "").trim();
  // Never surface "Price unknown" â€” show nothing when the price isn't known.
  if (!price || /^price unknown$/i.test(price)) return "";
  return price;
}

function eventDisplayTime(event) {
  // Recurring museum exhibits/programs read as "Ongoing"; true one-off museum
  // events (a single occurrence) keep their actual date/time.
  if (String(event.cat || "").toLowerCase() === "museums" && occurrencesForEvent(event).length > 1) return "Ongoing";
  return event.time;
}

function eventMetaLine(event) {
  return [eventDisplayTime(event), eventPriceLabel(event)].filter(Boolean).join(" / ");
}

function normalizeClockLabel(value) {
  return String(value || "")
    .replace(/\b(1[3-9]|2[0-3]):([0-5]\d)\s*(AM|PM)\b/gi, (_, hour, minute) => {
      const numericHour = Number(hour);
      const suffix = numericHour >= 12 ? "PM" : "AM";
      const displayHour = numericHour % 12 || 12;
      return `${displayHour}:${minute} ${suffix}`;
    })
    .replace(/\b0([1-9]):([0-5]\d)\s*(AM|PM)\b/gi, "$1:$2 $3")
    .replace(/\s+/g, " ")
    .trim();
}

function compactEventTimeLabel(event) {
  const text = String(eventDisplayTime(event) || "").trim();
  if (!text) return "";
  return normalizeClockLabel(text.replace(/^([A-Za-z]{3,9},\s+[A-Za-z]{3,9}\s+\d{1,2}),\s+/, "$1 - "));
}

function recurringOccurrenceTimeLabel(event) {
  return compactEventTimeLabel(event)
    .replace(/^([A-Za-z]{3,9},\s+[A-Za-z]{3,9}\s+\d{1,2})\s+-\s+/i, "")
    .replace(/^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sun|Mon|Tue|Wed|Thu|Fri|Sat),?\s+/i, "")
    .trim();
}

function currentWeekEndDate() {
  const now = new Date();
  const end = new Date(now);
  end.setDate(now.getDate() + ((7 - now.getDay()) % 7));
  end.setHours(23, 59, 59, 999);
  return end;
}

function eventSeriesThisWeekCount(event) {
  const start = Number(event?.startSort || 0);
  if (!Number.isFinite(start) || start <= 0) return 0;
  const weekEnd = currentWeekEndDate().getTime();
  return occurrencesForEvent(event)
    .filter(item => item.id !== event.id)
    .filter(item => Number.isFinite(item.startSort) && item.startSort > start && item.startSort <= weekEnd)
    .length;
}

function weekdayListLabel(days) {
  const short = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  if (!days.length) return "";
  if (days.length === 7) return "Every day";
  const contiguous = days.every((day, index) => index === 0 || day === days[index - 1] + 1);
  if (contiguous && days.length > 2) return `${short[days[0]]}-${short[days[days.length - 1]]}`;
  return days.map(day => short[day]).join(", ");
}

function recurringCardScheduleParts(event) {
  const all = occurrencesForEvent(event)
    .map(item => ({ item, date: eventDateValue(item) }))
    .filter(entry => entry.date)
    .sort((a, b) => a.date - b.date);
  if (all.length < 2) return null;
  const days = [...new Set(all.map(entry => entry.date.getDay()))].sort((a, b) => a - b);
  if (days.length < 2) return null;

  const byTime = new Map();
  all.forEach(({ item, date }) => {
    const time = recurringOccurrenceTimeLabel(item);
    const key = time || "Time varies";
    if (!byTime.has(key)) byTime.set(key, new Set());
    byTime.get(key).add(date.getDay());
  });

  if (byTime.size === 1) {
    const [[time]] = byTime;
    return { days: weekdayListLabel(days), detail: time };
  }

  const detail = [...byTime.entries()]
    .map(([time, timeDays]) => ({ time, days: [...timeDays].sort((a, b) => a - b) }))
    .sort((a, b) => a.days[0] - b.days[0])
    .map(group => `${weekdayListLabel(group.days)} ${group.time}`)
    .join(" / ");
  return { days: weekdayListLabel(days), detail };
}

function isHappyHourEvent(event) {
  return String(event?.cat || event?.category || "").toLowerCase() === "happy-hours";
}

function happyHourPreviewTime(event) {
  if (!isHappyHourEvent(event)) return "";
  const today = localDateKey(new Date());
  const todayOccurrence = occurrencesForEvent(event)
    .find(item => {
      const date = eventDateValue(item);
      return date && localDateKey(date) === today;
    });
  return todayOccurrence ? recurringOccurrenceTimeLabel(todayOccurrence) : "";
}

function eventCardTimeLine(event) {
  const happyHourTime = happyHourPreviewTime(event);
  if (happyHourTime) return happyHourTime;
  const recurring = recurringCardScheduleParts(event);
  if (recurring) return recurring.detail ? `${recurring.days} | ${recurring.detail}` : recurring.days;
  const time = compactEventTimeLabel(event);
  if (/^ongoing$/i.test(time)) return time;
  const moreThisWeek = eventSeriesThisWeekCount(event);
  if (!time) return moreThisWeek ? `+${moreThisWeek} more this week` : "";
  return moreThisWeek ? `${time} + ${moreThisWeek} more this week` : time;
}

function eventCardTimeHtml(event) {
  const happyHourTime = happyHourPreviewTime(event);
  if (happyHourTime) return `<strong>${escapeHtml(happyHourTime)}</strong>`;
  const recurring = recurringCardScheduleParts(event);
  if (recurring) {
    return recurring.detail
      ? `<strong>${escapeHtml(recurring.days)}</strong> <span class="event-card-more-week">| ${escapeHtml(recurring.detail)}</span>`
      : `<strong>${escapeHtml(recurring.days)}</strong>`;
  }
  const time = compactEventTimeLabel(event);
  if (/^ongoing$/i.test(time)) return escapeHtml(time);
  const moreThisWeek = eventSeriesThisWeekCount(event);
  if (!time) return moreThisWeek ? `<span class="event-card-more-week">+${moreThisWeek} more this week</span>` : "";
  return moreThisWeek
    ? `<strong>${escapeHtml(time)}</strong> <span class="event-card-more-week">+${moreThisWeek} more this week</span>`
    : `<strong>${escapeHtml(time)}</strong>`;
}

function primaryEventTag(event) {

}

function eventArtLabel(event) {
  const category = String(event.cat || event.category || "").toLowerCase();
  const labels = {

  };
  if (labels[category]) return labels[category];

  const text = `${event.cat || ""} ${event.category || ""} ${event.tag || ""} ${tagText} ${event.title || ""}`.toLowerCase();
  if (/\b(nightlife|nightclub|club|bar|lounge|rooftop|cocktail|dance party|after dark|late night)\b/.test(text)) return "Nightlife";
  if (/\b(concert|music|pop|rock|jazz|classical|dj|band|singer|songwriter|vinyl)\b/.test(text)) return "Concerts";
  if (/\b(family|families|kid|kids|children|all ages|all-ages|story\s*time|storytime|youth|bluey|disney|puppet|toddler)\b/.test(text)) return "Kids";
  if (/\b(embassy|ambassador|international|cultural|culture|heritage|global|foreign soil)\b/.test(text)) return "Culture";
  if (/\b(museum|smithsonian|hirshhorn|renwick|portrait gallery|american art museum|air and space|natural history|american history)\b/.test(text)) return "Museums";
  if (/\b(theatre|theater|performing|arts?|gallery|comedy|film|cinema)\b/.test(text)) return "Performing arts";
  if (/\b(baseball|mlb|nba|nfl|nhl|soccer|sports?|game)\b/.test(text)) return "Sports";
  if (/\b(food|drink|wine|beer|cocktail|restaurant|brunch|market)\b/.test(text)) return "Food & drink";
  if (/\b(festival|fair)\b/.test(text)) return "Festivals";
  if (/\b(expo|conference|convention)\b/.test(text)) return "Community";
  if (/\b(run|yoga|fitness|wellness|pickleball)\b/.test(text)) return "Sports";

function cleanLocationPart(value) {
  const text = String(value || "").trim();
  if (!text || /^location in description$/i.test(text) || /^undefined|null$/i.test(text)) return "";
  return text;
}

function isGenericLocationName(value) {
  return /^(washington,?\s*dc|dc|district of columbia|wharf|shaw|noma|downtown|national mall|u street|h street|navy yard|penn quarter|georgetown|dupont(?: circle)?|logan circle|adams morgan|capitol hill|columbia heights|petworth|brookland|ivy city|foggy bottom|waterfront|southwest|northeast|northwest|southeast|southwest)$/i.test(String(value || "").trim());
}

function venueFromEventDescription(event) {
  const description = String(event?.desc || "").replace(/&amp;/g, "&").trim();
  if (!description) return "";
  const matches = [...description.matchAll(/\bat\s+([A-Z0-9][A-Za-z0-9&'\u2019.,+\- ]{2,80}?)(?:[.!?]|$)/g)];
  for (const match of matches.reverse()) {
    const candidate = cleanLocationPart(match[1].replace(/\s+/g, " ").replace(/[,.;:]+$/g, ""));
    if (candidate && !isGenericLocationName(candidate) && !/^(the )?(source|event|show|door|venue)$/i.test(candidate)) return candidate;
  }
  return "";
}

function eventLocationLine(event) {
  const venue = cleanLocationPart(event.venue);
  const area = cleanLocationPart(event.area);
  const describedVenue = venueFromEventDescription(event);
  const displayVenue = (!venue || venue.toLowerCase() === area.toLowerCase() || isGenericLocationName(venue)) && describedVenue ? describedVenue : venue;
  if (displayVenue && area && displayVenue.toLowerCase() !== area.toLowerCase()) return `${displayVenue} / ${area}`;
  return displayVenue || area || "Washington, DC";
}

function eventNeighborhoodLine(event) {
  return [event.area, event.neighborhood, event.venue_address, event.address, eventLocationLine(event)]
    .map(value => cleanLocationPart(value))
    .filter(Boolean)
    .filter((value, index, all) => all.findIndex(item => item.toLowerCase() === value.toLowerCase()) === index)
    .join(" ");
}

    return DISCOVER_CITY_SECTIONS;
  }
  const matches = CITY_SECTION_PATTERNS
    .filter(([, pattern]) => pattern.test(text))
    .map(([name]) => name);
  return matches.length ? matches : ["Downtown"];
}

function eventNeighborhoodMatches(event, value) {

  const normalized = String(value || "").trim().toLowerCase();
  if (DISCOVER_CITY_SECTIONS.some(section => section.toLowerCase() === normalized)) {
    return eventCitySections(event).some(section => section.toLowerCase() === normalized);

const WEEKDAY_TITLE_PATTERN = "(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)";

function weekdayStrippedSeriesTitle(title) {
  const clean = String(title || "").trim().replace(/\s+/g, " ");
  return clean
    .replace(new RegExp(`^${WEEKDAY_TITLE_PATTERN}\\s+`, "i"), "")
    .replace(new RegExp(`\\s+${WEEKDAY_TITLE_PATTERN}$`, "i"), "")
    .trim();

function isWeekdayNamedRecurringSeries(event, strippedTitle) {
  const title = String(event?.title || "").trim();
  if (!title || !strippedTitle || strippedTitle.toLowerCase() === title.toLowerCase()) return false;
  const category = String(event?.cat || event?.category || "").toLowerCase();
  const tags = Array.isArray(event?.tags) ? event.tags.join(" ") : "";
  const text = `${title} ${event?.desc || ""} ${event?.description || ""} ${event?.tag || ""} ${tags}`.toLowerCase();
  return ["happy-hours", "trivia-nights", "farmers-markets"].includes(category)
    || /\b(weekly|every|recurring|league|series)\b/.test(text);

function recurringSeriesDisplayTitle(event) {
  const stripped = weekdayStrippedSeriesTitle(event?.title);
  if (!isWeekdayNamedRecurringSeries(event, stripped)) return "";

function recurringSeriesTitleKey(event) {

function eventDisplayTitle(event) {
  const title = String(event?.title || "").trim();
  if (!title) return "";
  const venue = cleanLocationPart(event?.venue || event?.venueName || eventLocationLine(event));
  const normalizedTitle = normalizedTitlePart(title);
  const normalizedVenue = normalizedTitlePart(venue);
  const venueLedTitle = normalizedVenue && (
    normalizedTitle === `${normalizedVenue} trivia night`
    || normalizedTitle === `${normalizedVenue} trivia nights`
    || normalizedTitle === `${normalizedVenue} happy hour`
    || normalizedTitle === `${normalizedVenue} happy hours`
  );
  if (venueLedTitle && String(event?.cat || "").toLowerCase() === "trivia-nights") return "Trivia Night";
  if (venueLedTitle && String(event?.cat || "").toLowerCase() === "happy-hours") return "Happy Hour";
  const seriesTitle = recurringSeriesDisplayTitle(event);
  if (seriesTitle && occurrencesForEvent(event).length > 1) return seriesTitle;
  return title;

// Event card, Too Good To Go-inspired: framed rounded photo with a category pill
// (and optional social-proof pill), then a clean info block â€” bold title + heart,

function eventRow(event, variant = "", opts = {}) {
  const showBadge = opts.showBadge !== false;
  const displayTitle = eventDisplayTitle(event);

  const timeLine = eventCardTimeHtml(event);
  // Tag pills removed from the card: most were seeded filler ("Curtain Call",
  // "Late Set", "Interactive") rather than anything true about the event. The
  // category pill on the artwork carries the only label worth showing here.
  const fallbackImage = eventFallbackImageSrc(event);
  const imageSrc = eventCardImageSrc(event);
  const hasDisplayImage = eventHasDisplayImage(event);
