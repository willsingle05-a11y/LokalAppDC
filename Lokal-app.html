<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Lokal DC</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
:root {
  --cream: #f5f7fa;
  --paper: #ffffff;
  --ink: #111827;
  --muted: #667587;
  --line: #dce6ed;
  --steel: #3a7ca5;
  --steel-soft: #e0eef7;
  --blue: #1d4e6b;
  --blue-soft: #e0eef7;
  --yellow: #78a9c7;
  --pink: #6e9db8;
  --navy: #111827;
  --shadow: 0 10px 28px rgba(17, 24, 39, .09);
  --radius: 22px;
}

* { box-sizing: border-box; }
html { background: #e7edf2; }
body {
  margin: 0;
  color: var(--ink);
  background: #e7edf2;
  font-family: Aptos, "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
button { border: 0; color: inherit; cursor: pointer; font: inherit; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.app-stage { min-height: 100vh; }
.app-sidebar { display: none; }
.production-app .app-stage {
  display: block;
  padding: 0;
}
.production-app .app-sidebar { display: none !important; }
.app-shell {
  position: relative;
  width: min(100%, 620px);
  min-height: 100vh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--cream);
  box-shadow: 0 0 45px rgba(50, 40, 30, .12);
}
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.share-shortcut { padding: 8px 10px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 10px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
.header-icon { position: relative; padding: 5px; color: var(--steel); background: transparent; font-size: 14px; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  padding: 10px 18px;
  background: rgba(246, 240, 231, .92);
  border-bottom: 1px solid rgba(231, 223, 212, .8);
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 10px; background: transparent; text-align: left; }
.brand-mark {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border-radius: 14px;
  color: var(--paper);
  background: var(--steel);
  font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 23px;
  font-weight: 700;
}
.brand b { display: block; font-size: 15px; letter-spacing: 2px; }
.brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: 1.5px; }
.icon-button { display: grid; place-items: center; padding: 0; background: transparent; }
main { min-height: calc(100vh - 68px); padding-bottom: 92px; }
.page { padding: 20px 18px 32px; animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.eyebrow { margin: 0 0 5px; color: var(--steel); font-size: 10px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; }
h1, h2, h3, p { margin-top: 0; }
h1, h2 { font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: -.6px; }
h1 { margin-bottom: 9px; font-size: 37px; line-height: 1.02; }
h2 { margin-bottom: 12px; font-size: 25px; line-height: 1.05; }
h3 { margin-bottom: 5px; font-size: 15px; line-height: 1.15; }
.lede { max-width: 420px; margin-bottom: 19px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.section { margin-top: 27px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-heading h2 { margin: 0; }
.discover-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.discover-heading h1 { margin-bottom: 12px; font-size: 31px; }
.filter-button { padding: 8px 11px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 10px; font-weight: 900; }
.search-box { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 3px 11px rgba(42,57,52,.04); }
.search-box span { color: var(--steel); font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; line-height: .5; }
.search-box input { width: 100%; border: 0; color: var(--ink); background: transparent; font: inherit; font-size: 12px; outline: 0; }
.age-note { margin: 8px 0 11px; padding: 9px 11px; border-radius: 11px; color: var(--blue); background: var(--blue-soft); font-size: 11px; font-weight: 800; line-height: 1.35; }
.mini-lists { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 2px; scrollbar-width: none; }
.mini-lists button { flex: 0 0 142px; padding: 11px; border-radius: 14px; color: white; background: var(--blue); text-align: left; }
.mini-lists button:nth-child(2) { background: var(--navy); }.mini-lists button:nth-child(3) { background: var(--steel); }
.mini-lists b, .mini-lists span { display: block; }.mini-lists b { font-size: 12px; }.mini-lists span { margin-top: 4px; font-size: 9px; opacity: .78; }
.feed-section { margin-top: 22px; }
.feed-label { margin-bottom: 3px; color: var(--blue); font-size: 8px; font-weight: 900; letter-spacing: .7px; text-transform: uppercase; }
.live-dot { color: var(--steel); font-size: 10px; font-weight: 900; text-transform: uppercase; }
.text-button { color: var(--blue); background: transparent; font-size: 12px; font-weight: 800; }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 1px 1px 6px; scrollbar-width: none; }
.chip, .filter-chip {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--blue);
  background: var(--paper);
  font-size: 11px;
  font-weight: 800;
}
.chip.active, .filter-chip.active { border-color: var(--blue); color: white; background: var(--blue); }

.event-stack { display: grid; gap: 12px; }
.event-row {
  display: grid;
  grid-template-columns: 98px 1fr;
  min-height: 118px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--paper);
  box-shadow: 0 3px 11px rgba(42,57,52,.045);
  text-align: left;
  transition: transform .18s ease, box-shadow .18s ease;
}
.event-row:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.event-art { position: relative; display: flex; align-items: end; min-height: 118px; padding: 8px; overflow: hidden; color: white; background: var(--blue); }
.event-art:before, .hero-art:before {
  position: absolute;
  top: -25px;
  right: -22px;
  width: 95px;
  height: 95px;
  border: 12px solid rgba(255,255,255,.18);
  border-radius: 50%;
  content: "";
}
.event-art:after, .hero-art:after {
  position: absolute;
  right: 10px;
  bottom: 18px;
  width: 54px;
  height: 54px;
  border: 1px solid rgba(255,255,255,.32);
  border-radius: 50%;
  content: "";
}
.cat-nightlife { background: linear-gradient(150deg, #344d73, #152b44); }
.cat-music { background: linear-gradient(150deg, #cf714f, #eaa65b); }
.cat-art { background: linear-gradient(150deg, #846894, #e2909a); }
.cat-fitness { background: linear-gradient(150deg, #467e66, #183f3a); }
.cat-food { background: linear-gradient(150deg, #e59840, #bb523d); }
.art-label { position: relative; z-index: 1; font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
.event-copy { display: flex; flex-direction: column; justify-content: center; padding: 12px; }
.event-meta { margin: 0 0 4px; color: var(--steel); font-size: 10px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
.event-copy p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
.event-location { display: block; margin-top: 2px; color: var(--ink); font-size: 12px; font-weight: 850; line-height: 1.35; }
.event-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.event-tag { display: inline-flex; align-items: center; padding: 4px 7px; border: 1px solid rgba(17,24,39,.18); border-radius: 999px; color: var(--ink); background: var(--bg); font-size: 9px; font-weight: 800; }
.event-source-credit { margin: 8px 0 0; color: var(--muted); font-size: 10px; font-weight: 800; }
.event-source-credit a { color: var(--blue); text-decoration: none; }
.detail-tags { margin: 2px 0 12px; }
.signal { display: flex; align-items: center; gap: 6px; margin-top: 9px; color: var(--blue); font-size: 10px; font-weight: 800; }
.avatars { display: flex; padding-left: 4px; }
.avatar {
  display: grid;
  width: 27px;
  height: 27px;
  margin-left: -5px;
  place-items: center;
  border: 2px solid var(--paper);
  border-radius: 50%;
  color: white;
  background: var(--blue);
  font-size: 8px;
  font-weight: 900;
}
.avatar:nth-child(2n) { background: var(--steel); }
.avatar:nth-child(3n) { background: var(--navy); }
.avatar-me { width: 40px; height: 40px; margin: 0; border-color: white; background: var(--navy); }

.feature-card { position: relative; overflow: hidden; border-radius: 22px; color: white; background: var(--navy); text-align: left; }
.feature-card .hero-art { min-height: 196px; padding: 20px; background: linear-gradient(145deg, rgba(34,60,82,.1), rgba(34,60,82,.8)), linear-gradient(135deg, #c97759, #233d53 67%); }
.feature-card h3 { position: relative; z-index: 1; max-width: 260px; margin-top: 45px; font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 500; }
.feature-card p { position: relative; z-index: 1; margin: 0; font-size: 12px; opacity: .88; }
.feature-signal { position: absolute; top: 16px; left: 16px; z-index: 2; padding: 7px 10px; border-radius: 999px; background: rgba(255,253,248,.95); color: var(--ink); font-size: 10px; font-weight: 900; }

.bottom-nav {
  position: fixed;
  right: 10px;
  bottom: 9px;
  left: 10px;
  z-index: 12;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  width: min(calc(100% - 20px), 600px);
  height: 64px;
  margin: 0 auto;
  padding: 7px 8px 8px;
  border: 1px solid rgba(231,223,212,.9);
  border-radius: 19px;
  background: rgba(255,254,250,.94);
  box-shadow: 0 8px 24px rgba(42,57,52,.12);
  backdrop-filter: blur(12px);
}
.nav-item { display: grid; justify-items: center; gap: 2px; color: #96a09b; background: transparent; font-size: 8px; }
.nav-item.active { color: var(--blue); }
.nav-item svg { width: 21px; height: 21px; stroke-width: 2; }

.modal-backdrop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: end; justify-content: center; background: rgba(20,34,32,.45); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { position: relative; width: min(100%, 620px); max-height: 91vh; overflow-y: auto; border-radius: 25px 25px 0 0; background: var(--paper); animation: slide .28s ease; }
@keyframes slide { from { transform: translateY(35px); } to { transform: translateY(0); } }
.modal-close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; color: white; background: rgba(23,58,53,.58); font-size: 20px; }
.detail-hero { position: relative; min-height: 210px; padding: 22px; color: white; }
.detail-hero h1 { position: relative; z-index: 1; max-width: 360px; margin-top: 75px; font-size: 35px; }
.detail-hero p { position: relative; z-index: 1; margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.detail-location { position: relative; z-index: 1; display: block; max-width: 360px; margin-top: 8px; font-size: 13px; font-weight: 900; }
.detail-body { padding: 20px 18px 30px; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 7px; margin: 16px 0; }
.action, .primary, .secondary { padding: 11px 10px; border-radius: 12px; font-size: 11px; font-weight: 900; }
.action { color: var(--blue); background: var(--blue-soft); }
.action.selected { color: white; background: var(--blue); }
.primary { color: white; background: var(--steel); }
.secondary { color: var(--blue); background: var(--blue-soft); }
.detail-description { color: var(--muted); font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.45; }
.detail-source-credit { margin: 13px 0 0; color: var(--muted); font-size: 11px; font-weight: 800; text-align: center; }
.detail-source-credit a { color: var(--blue); text-decoration: none; }
.attendee-line { display: flex; align-items: center; gap: 9px; margin: 14px 0; font-size: 12px; font-weight: 800; }

.map-page { padding: 0; }
.map-top { padding: 18px; }
.map-canvas {
  position: relative;
  min-height: calc(100vh - 232px);
  overflow: hidden;
  background: #dce6dc;
}
.map-canvas:before {
  position: absolute;
  inset: -50px;
  opacity: .78;
  background:
    linear-gradient(118deg, transparent 0 19%, #f6f0e7 19% 23%, transparent 23% 100%),
    linear-gradient(12deg, transparent 0 39%, #f6f0e7 39% 43%, transparent 43% 100%),
    linear-gradient(98deg, transparent 0 59%, #f6f0e7 59% 63%, transparent 63% 100%),
    linear-gradient(163deg, transparent 0 68%, #f6f0e7 68% 71%, transparent 71% 100%);
  content: "";
}
.neighborhood { position: absolute; color: rgba(23,58,53,.5); font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
.pin { position: absolute; z-index: 2; display: grid; width: 38px; height: 38px; place-items: center; border: 3px solid white; border-radius: 50% 50% 50% 9px; color: white; background: var(--steel); box-shadow: 0 5px 10px rgba(48,61,57,.2); font-size: 11px; font-weight: 900; transform: rotate(-45deg); }
.pin span { transform: rotate(45deg); }
.pin.music { background: var(--steel); }.pin.nightlife { background: var(--navy); }.pin.art { background: #9e6f95; }.pin.fitness { background: var(--blue); }.pin.food { background: #ca8c3c; }
.map-card { position: absolute; right: 14px; bottom: 14px; left: 14px; z-index: 4; display: none; }
.map-card.visible { display: block; }

.tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: #ebe4d9; }
.tab-button { padding: 10px; border-radius: 11px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 900; }
.tab-button.active { color: var(--blue); background: var(--paper); box-shadow: 0 2px 5px rgba(40,50,45,.08); }
.activity-card, .group-card, .stat-card { padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); }
.activity-card { display: flex; gap: 11px; }
.activity-card + .activity-card { margin-top: 9px; }
.activity-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.activity-card b { color: var(--ink); }
.activity-time { display: block; margin-top: 4px; color: #a09c94; font-size: 10px; }
.group-card { margin-top: 14px; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.group-icon { display: grid; width: 45px; height: 45px; place-items: center; border-radius: 15px; color: white; background: var(--navy); font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; }
.group-head div:nth-child(2) { flex: 1; }
.group-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
.group-divider { margin-top: 24px; }
.community-grid, .group-list { display: grid; gap: 8px; }
.community-card { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); text-align: left; }
.community-card span:nth-child(2) { display: grid; flex: 1; gap: 2px; }.community-card small { color: var(--muted); font-size: 10px; }.community-card em { color: var(--steel); font-size: 10px; font-style: normal; font-weight: 800; }
.group-mini-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.group-mini-tags i { padding: 3px 6px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 8px; font-style: normal; font-weight: 900; }
.group-access { padding: 5px 7px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 8px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; }
.group-access.private { color: #725b7f; background: #eee4f0; }
.group-icon.run { background: var(--blue); }.group-icon.book { background: #9e6f95; }.group-icon.art { background: var(--steel); }
.social-tabs { margin-top: 13px; }
.create-sheet { padding: 21px 18px 25px; }
.create-sheet h2 { margin-bottom: 5px; font-size: 30px; }
.create-sheet .lede { margin-bottom: 14px; }
.group-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 13px; }
.group-type { padding: 11px 7px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--paper); font-size: 10px; font-weight: 900; }
.group-type.selected { border-color: var(--blue); color: white; background: var(--blue); }
.create-sheet input { width: 100%; margin-bottom: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--paper); font: inherit; font-size: 12px; }
.group-detail { padding: 21px 18px 25px; }
.group-detail h2 { margin-bottom: 4px; font-size: 29px; }
.group-detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 13px; }
.detail-pill { padding: 6px 8px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 9px; font-weight: 900; }
.group-description { color: var(--muted); font-size: 12px; line-height: 1.45; }
.group-detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 14px 0; }
.member-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; padding: 10px; border-radius: 12px; background: #f8f5ef; }
.member-line span { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; }
.message-list { display: grid; gap: 7px; margin-top: 9px; }
.message { max-width: 88%; padding: 9px 10px; border-radius: 12px 12px 12px 3px; color: var(--ink); background: var(--blue-soft); font-size: 11px; line-height: 1.4; }
.message.me { justify-self: end; border-radius: 12px 12px 3px 12px; color: white; background: var(--blue); }
.message small { display: block; margin-top: 3px; opacity: .68; font-size: 8px; font-weight: 900; }
.message-compose { display: flex; gap: 7px; margin-top: 10px; }
.message-compose input { width: 100%; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--paper); font: inherit; font-size: 11px; }
.interest-list { display: grid; gap: 7px; margin-top: 9px; }
.interest-event { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border-radius: 12px; background: #f8f5ef; }
.interest-event b, .interest-event small { display: block; }.interest-event b { font-size: 11px; }.interest-event small { margin-top: 3px; color: var(--muted); font-size: 9px; }
.follow-list { display: grid; gap: 8px; }
.follow-card { display: flex; align-items: center; gap: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); text-align: left; }
.follow-card span:nth-child(2) { display: grid; flex: 1; gap: 2px; }.follow-card small { color: var(--muted); font-size: 10px; }.follow-card em { color: var(--steel); font-size: 10px; font-style: normal; font-weight: 800; }
.follow-button { padding: 6px 8px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 9px; font-weight: 900; }
.follow-button.selected { color: white; background: var(--blue); }
.following-rail { display: flex; gap: 9px; overflow-x: auto; margin-bottom: 15px; padding: 2px 1px 6px; scrollbar-width: none; }
.following-chip { display: grid; flex: 0 0 86px; justify-items: center; gap: 5px; padding: 10px 7px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); text-align: center; }
.following-chip .group-icon { width: 36px; height: 36px; border-radius: 12px; font-size: 16px; }
.following-chip b { font-size: 10px; line-height: 1.15; }.following-chip small { color: var(--steel); font-size: 8px; font-weight: 900; text-transform: uppercase; }
.filter-sheet, .notification-sheet, .list-sheet, .invite-sheet { padding: 21px 18px 25px; }
.filter-sheet h2, .notification-sheet h2, .list-sheet h2, .invite-sheet h2 { margin-bottom: 6px; font-size: 30px; }
.filter-block { margin-top: 16px; }.filter-block .eyebrow { margin-bottom: 8px; }
.filter-options { display: flex; flex-wrap: wrap; gap: 6px; }.filter-options button { padding: 8px 10px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 10px; font-weight: 900; }.filter-options button.selected { color: white; background: var(--blue); }
.notification-empty { padding: 26px 0 34px; text-align: center; }.notification-empty b { display: block; margin-bottom: 6px; font-size: 15px; }.notification-empty p { margin: 0 auto; max-width: 30ch; color: var(--muted); font-size: 12px; line-height: 1.4; }

.plan-summary { margin-top: 19px; padding: 15px; border-radius: 17px; background: var(--steel-soft); }

.onboarding { position: fixed; inset: 0; z-index: 40; display: grid; align-items: start; justify-items: center; overflow-y: auto; overscroll-behavior: contain; padding: 18px; background: var(--cream); -webkit-overflow-scrolling: touch; }
.onboard-card { width: min(100%, 560px); max-height: none; padding-bottom: max(18px, env(safe-area-inset-bottom)); }
.onboard-logo { display: grid; width: 54px; height: 54px; margin-bottom: 34px; place-items: center; border-radius: 18px; color: white; background: var(--steel); font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 33px; font-weight: 700; }

.birth-field { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .7px; text-transform: uppercase; }
.preference-grid { max-height: 310px; overflow-y: auto; padding-right: 3px; }
.contacts-art { display: grid; min-height: 130px; margin: 20px 0; place-items: center; border-radius: 19px; background: var(--blue-soft); }
.contacts-art .avatar { width: 47px; height: 47px; font-size: 12px; }
.skip-button { width: 100%; margin-top: 8px; padding: 11px; color: var(--blue); background: transparent; font-size: 12px; font-weight: 900; }
#toast { position: fixed; right: 18px; bottom: 87px; left: 18px; z-index: 50; max-width: 430px; margin: 0 auto; padding: 12px 15px; border-radius: 12px; color: white; background: var(--ink); font-size: 12px; font-weight: 800; opacity: 0; pointer-events: none; transform: translateY(8px); transition: .2s ease; }
#toast.show { opacity: 1; transform: translateY(0); }

@media (min-width: 700px) {
  .app-shell { margin: 16px auto; min-height: calc(100vh - 32px); border-radius: 24px; }
  .bottom-nav { bottom: 25px; }
  .modal { margin-bottom: 16px; border-radius: 25px; }
}

@media (min-width: 1040px) {
  body { background: #e6ddd0; }
  .app-stage { display: grid; grid-template-columns: 330px 620px; justify-content: center; gap: 44px; padding: 24px 38px; }
  .app-sidebar { display: block; align-self: center; }
  .app-sidebar h1 { margin: 24px 0 15px; font-size: 54px; }
  .sidebar-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 49px; font-size: 18px; letter-spacing: 3px; }
  .sidebar-note { margin-top: 31px; padding: 17px; border-left: 3px solid var(--steel); background: rgba(255,253,248,.55); }
  .sidebar-note p:last-child { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .sidebar-actions { display: flex; align-items: center; gap: 17px; margin-top: 20px; }
  .app-shell { width: 620px; margin: 0; min-height: calc(100vh - 48px); border-radius: 25px; }
  .bottom-nav { right: auto; left: calc(50% - 113px); bottom: 34px; width: 600px; }
  .modal { margin-bottom: 24px; }
  .production-app body { background: #e7edf2; }
  .production-app .app-stage { display: block; padding: 0; }
  .production-app .app-shell { margin: 0 auto; min-height: 100vh; }
}



/* Round 2: palette, typography, and feature overrides */
body { font-family: Aptos, "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.app-shell { overflow-x: hidden; overflow-y: visible; padding-bottom: 78px; }
.bottom-nav { position: fixed; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nav-item { min-width: 0; }
.header-icon { color: var(--blue); }
.header-icon svg { width: 22px; height: 22px; stroke-width: 1.8; }
/* Hidden until refreshNotificationBadge() finds something the account actually
   received. The dot used to be unconditional, which made it meaningless. */
.header-icon i { display: none; position: absolute; top: 3px; right: 2px; width: 7px; height: 7px; border: 1px solid var(--paper); border-radius: 50%; background: var(--steel); }
.header-icon.has-unread i { display: block; }
#profile-shortcut { grid-auto-flow: column; grid-template-columns: auto minmax(0, max-content); gap: 7px; max-width: 174px; }
#profile-shortcut .account-label { overflow: hidden; max-width: 118px; color: var(--ink); font-size: 11px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
.following-chip { flex-basis: 190px; min-height: 186px; align-content: center; gap: 10px; }
.following-chip .group-icon { width: 88px; height: 88px; border: 4px solid var(--steel-soft); border-radius: 50%; font-size: 30px; }
.following-chip b { font-size: 14px; }.following-chip small { font-size: 9px; }
.story-sheet { max-height: min(88vh, 760px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.story-progress { display: flex; gap: 5px; margin: 0 36px 18px 0; }
.story-progress span { flex: 1; height: 3px; border-radius: 9px; background: var(--line); }
.story-progress span.active { background: var(--steel); }
.story-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.story-heading .group-icon { width: 50px; height: 50px; flex: 0 0 50px; border-radius: 50%; }
.story-controls { position: sticky; bottom: -25px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px -18px -25px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 94%, transparent); }
.story-controls small { color: var(--muted); font-weight: 800; white-space: nowrap; }
.notification-card { width: 100%; background: transparent; text-align: left; }
.request-notification { display: block; }
.request-actions { margin-top: 8px; }
.request-actions button:last-child { color: #a4564a; background: #f7e9e4; }
.lokal-score { display: inline-flex; align-items: baseline; gap: 5px; padding: 7px 9px; border-radius: 12px; font-family: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; }
.lokal-score small { font-size: 9px; letter-spacing: .6px; text-transform: uppercase; }
.score-breakdown { display: grid; gap: 8px; margin: 14px 0; }
.score-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px; border: 1px solid rgba(58, 124, 165, .14); border-radius: 13px; background: #f5f7fa; }
.score-row span { display: grid; gap: 3px; }

}
.compact-score-block small {

}
.compact-score-block em {

}
.score-mini-progress {

  height: 7px;
  overflow: hidden;

}
.score-mini-progress i {

.compact-profile-section .profile-taste-chips { margin-bottom: 0; }
.compact-profile-section .section-heading { margin-bottom: 7px; }
.profile-insights {
  padding-bottom: 8px;
}
.profile-pulse {

.insight-grid {

}
.insight-card {
  padding: 13px 9px;

.insight-card b {
  display: block;
  color: #16A085;
  font-size: 24px;
  line-height: 1;
}
.insight-card small {

.category-bars {

  gap: 8px;

  border-radius: 13px;

}
.category-bar span {

  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
}
.category-bar small {

  font-size: 9px;
  font-weight: 900;
}
.category-bar i {

}
.insight-receipts {

}
.insight-receipts .receipt {

@keyframes growBar { from { width: 18%; opacity: .45; } to { width: var(--level); opacity: 1; } }
@keyframes pulseDot { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1.25); opacity: 1; } }
@keyframes softFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* ============================================================
   UI Redesign v2 â€” teal design system + new components.
   Loaded after base.css and round2.css, so it intentionally
   overrides earlier rules. Light background is preserved.
   ============================================================ */

:root {
  --accent: #00C9A7;
  --accent-strong: #00b294;
  --heart: #FF6B9D;
  --urgent: #FF4757;
  --warm: #FF7B54;
  --display: "Barlow Condensed", "Aptos Display", Aptos, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "Courier New", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* Warm onboarding palette (the founders' welcome letter) */
  --onboard-cream: #F7F5EF;
  --onboard-green: #2D5A2D;
  --onboard-ink: #1a1a1a;
  /* Rounded, friendly card font (Too Good To Go-style) */
  --card-font: "Poppins", "Barlow Condensed", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ---- Typography ---- */
h1, h2, h3,
.brand b, .sidebar-brand b,
.event-card-title, .score-big, .score-level-tag,
.tonight-head h2, .attend-copy b {
  font-family: var(--display);
}
h1 { font-weight: 900; }
h2 { font-weight: 800; }
h3 { font-weight: 700; }

.eyebrow,
.feed-label, .event-meta, .settings-label, .suggestion-type,
.stop-label, .rank-badge, .step-count {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ---- Teal accent: replace remaining mint surfaces ---- */
.brand-mark, .wide-button, .primary,
.chip.active, .filter-chip.active, .action.selected, .group-type.selected,
.message.me, .follow-button.selected, .hype-button.selected, .select-tile.selected,
.profile-avatar, .avatar-me, .group-icon,
.feature-card, .stop-card.anchor, .anchor-summary,
.attended-button.selected, .share-channel,
.taste-choice.selected, .privacy-toggle input {
  background: var(--accent);
}
.privacy-toggle input { accent-color: var(--accent); }
.nav-item.active { color: var(--accent); }
.header-icon i, .story-progress span.active,
.chip.active, .filter-chip.active { box-shadow: inset 0 -3px 0 var(--accent); }
.following-chip .group-icon, .community-card.pinned { border-color: rgba(0, 201, 167, .7); }
.lokal-score { color: var(--accent-strong); }

/* ============================================================
   CHANGE 1 â€” Event cards (used everywhere eventRow renders)
   ============================================================ */
.event-card {
  position: relative;
  display: block;
  width: 100%;
  min-height: 165px;
  padding: 0;
  overflow: hidden;
  border-radius: 16px;
  background-color: var(--blue);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  box-shadow: 0 4px 14px rgba(17, 24, 39, .12);
  isolation: isolate;
  text-align: left;
  transition: transform .18s ease, box-shadow .18s ease;
}
.event-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(17, 24, 39, .16); }

/* full-bleed tap target that opens the detail modal */
.event-card-hit {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  background: transparent;
}

.event-card-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  padding: 4px 9px;
  border: 1px solid currentColor;
  border-radius: 999px;
  background: rgba(0, 0, 0, .55);
  font-family: var(--display);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  pointer-events: none;
}

.event-card-actions {
  position: absolute;
  top: 9px;
  right: 9px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.card-icon-btn {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: #fff;
  background: rgba(0, 0, 0, .42);
  backdrop-filter: blur(5px);
  pointer-events: auto;
  transition: background .15s ease, transform .15s ease;
}
.card-icon-btn:hover { background: rgba(0, 0, 0, .62); transform: scale(1.06); }
.card-icon-btn svg { width: 16px; height: 16px; stroke-width: 2; }
.card-icon-btn svg path { transition: fill .08s ease, stroke .08s ease; }
.card-save svg { fill: none; }
.card-save.is-saved svg { fill: var(--heart); stroke: var(--heart); }
.event-card-bottom {
  position: absolute;
  inset: auto 0 0 0;
  z-index: 2;
  display: grid;
  gap: 6px;
  padding: 12px 13px 13px;
  pointer-events: none;
}
.card-friends { display: flex; padding-left: 5px; }
.card-friend-avatar {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-left: -5px;
  border: 1px solid #fff;
  border-radius: 50%;
  color: #fff;
  background: var(--accent);
  font-size: 7px;
  font-weight: 900;
}
.card-friend-avatar:nth-child(2n) { background: var(--warm); }
.card-friend-avatar:nth-child(3n) { background: #5f9fc3; }

.event-card-meta {
  color: rgba(255, 255, 255, .88);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.event-card-title {
  margin: 0;
  color: #fff;
  font-size: 19px;
  font-weight: 900;
  line-height: 1.0;
  text-shadow: 0 1px 10px rgba(0, 0, 0, .35);
}
.event-card-hero .event-card-title { font-size: 24px; }
.event-card-half .event-card-title { font-size: 17px; }

.event-card .event-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.event-card .event-tag {
  padding: 4px 8px;
  border: 1px solid rgba(255, 255, 255, .35);
  border-radius: 999px;
  color: #fff;
  background: rgba(255, 255, 255, .14);
  font-size: 9px;
  font-weight: 800;
}

.event-card-urgency {
  justify-self: start;
  margin-top: 1px;
  padding: 4px 9px;
  border-radius: 999px;
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.event-card-urgency.urgency-free { background: var(--accent); }
.event-card-urgency.urgency-spots { background: var(--urgent); }
.event-card-urgency.urgency-fast { background: var(--warm); }

/* card size variants */
.event-card-hero { min-height: 200px; }
.event-card-half { min-height: 165px; }

/* ============================================================
   CHANGE 2 â€” Discover screen
   ============================================================ */
/* Friends activity strip */
.activity-strip {
  display: flex;
  gap: 13px;
  margin: 0 -18px 16px;
  padding: 2px 18px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.activity-strip::-webkit-scrollbar { display: none; }
.activity-chip {
  flex: 0 0 auto;
  display: grid;
  justify-items: center;
  gap: 5px;
  width: 64px;
  background: transparent;
  text-align: center;
}
.activity-ring {
  display: grid;
  place-items: center;
  width: 50px;
  height: 50px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: #fff;
}
.activity-ring .avatar {
  width: 44px;
  height: 44px;
  margin: 0;
  border: 0;
  font-size: 13px;
}
.activity-chip b { font-family: var(--display); font-size: 12px; font-weight: 700; }
.activity-chip small { color: var(--muted); font-size: 8px; font-weight: 800; line-height: 1.25; }

/* Happening tonight */
.tonight-section { margin: 4px 0 18px; }
.tonight-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.tonight-head h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.tonight-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--urgent);
  animation: tonightPulse 1.5s ease-in-out infinite;
}
@keyframes tonightPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, .55); opacity: 1; }
  50% { box-shadow: 0 0 0 7px rgba(255, 71, 87, 0); opacity: .65; }
}

/* Hero / pair feed pattern */
.feed-grid { display: grid; gap: 8px; }
.feed-pair-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ============================================================

}

  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent);

/* ============================================================
   LANDING-ALIGNED THEME (final overrides)
   Inter + JetBrains Mono, warm cream, neon green + mint glow,
   black pill CTAs, softer shadows, live ticker. Matches
   https://lokal-pulse-dc.base44.app while keeping all logic.
   ============================================================ */
:root {
  --accent: #16A085;
  --accent-strong: #0E7C66;
  --mint: #75F0CB;
  --cream-warm: #F8F6F2;
  --ink-green: #171C1A;
  --display: "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Warm surfaces + near-black green ink */
html, body { color: var(--ink-green); background: #ece7df; }
.app-shell, .page, main, .onboarding, .app-stage { background: var(--cream-warm); }
.topbar { background: rgba(248, 246, 242, .92); border-bottom-color: rgba(23, 28, 26, .08); }
.bottom-nav { background: rgba(248, 246, 242, .96); }

/* Inter headings; uppercase, bold page titles like the landing hero */
h1, h2, h3, .brand b { color: var(--ink-green); font-family: var(--display); }
h1 { font-weight: 900; letter-spacing: -.01em; }
h2 { font-weight: 800; letter-spacing: -.01em; }
h3 { font-weight: 800; }
.discover-heading h1, .category-detail-heading h1 { text-transform: uppercase; }
.brand b, .onboard-logo, .intro-art span { color: #16A085; }

/* JetBrains Mono for eyebrows / labels / meta â€” the techy "alive" signature */
.eyebrow, .feed-label, .event-card-meta, .event-card-badge, .feed-count, .sync-note,
.following-chip small, .activity-chip small, .suggestion-type, .stop-label, .rank-badge,
.section-label, .more-near-you, .step-count, .planner-actions span, .elr-meta,
.settings-group-label, .settings-label, .event-card-loc, .elr-badge, .event-card-urgency,
.event-card-urgency-dot, .score-level-tag {
  font-family: var(--mono);
  letter-spacing: .02em;
}
.event-card-badge { font-weight: 700; }

/* Neon-green accent surfaces (replacing the older mint hardcodes) */
.chip.active, .filter-chip.active, .action.selected, .group-type.selected,
.message.me, .follow-button.selected, .hype-button.selected, .select-tile.selected,
.taste-choice.selected, .attended-button.selected, .share-channel,
.profile-avatar, .avatar-me, .group-icon, .feature-card, .stop-card.anchor, .anchor-summary,
.action.rsvp-action.selected, .event-card-urgency.urgency-free, .event-card-urgency.urgency-going,
.invite-banner-btn { color: #fff; }
.chip.active, .filter-chip.active, .action.selected, .group-type.selected,
.message.me, .follow-button.selected, .hype-button.selected, .select-tile.selected,

/* Mint glow on the live elements */

.nav-item.active svg { filter: drop-shadow(0 0 6px rgba(22, 160, 133, .55)); }

/* Black pill primary CTAs (landing "GET EARLY ACCESS" signature) */

.explore-cta { box-shadow: 0 10px 26px rgba(23, 28, 26, .2); }

/* Softer, larger diffuse shadows (landing depth) */

}
.event-card { border-radius: 16px; }
.search-box { border-color: rgba(23, 28, 26, .1); background: rgba(255, 255, 255, .85); }

/* Live event ticker */
.live-ticker {
  position: relative;

  border-top: 1px solid rgba(23, 28, 26, .08);
  border-bottom: 1px solid rgba(23, 28, 26, .08);
  background: rgba(22, 160, 133, .06);

}

}

@keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .live-ticker-track { animation: none; } }

/* ============================================================
   Feed "View more", taller Saved calendar days, alive Profile
   ============================================================ */
.view-more-feed {

  margin: 10px 0 2px;
  padding: 12px;

  background: rgba(22, 160, 133, .08);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.view-more-feed:hover { background: rgba(22, 160, 133, .15); }

/* Saved calendar: show the full week at once (all 7 days, no horizontal scroll),
   with taller cells so multiple events per day are easy to see. */
.planner-calendar { grid-template-columns: repeat(7, 1fr); gap: 5px; overflow-x: visible; }
.planner-day { min-height: 220px; padding: 6px 5px; }
.planner-day-head b { font-size: 13px; }
.planner-day-head span { font-size: 7px; }
.planner-day-events { gap: 5px; }
.planner-day-event { grid-template-columns: 6px 1fr; gap: 5px; padding: 5px; }
.planner-day-event strong { font-size: 9px; line-height: 1.15; }
.planner-day-event small { font-size: 8px; }
.day-explore { font-size: 9px; }

/* Followable venue result in Discover search + venue sheet */
.venue-result { justify-content: space-between; }
.venue-result .group-icon { width: 40px; height: 40px; border-radius: 12px; font-size: 16px; }
.venue-follow-btn { display: inline-flex; margin: 2px 0 4px; padding: 9px 18px; }

/* ============================================================
   Event card v3 â€” image on top, text below (no text over photo)
   ============================================================ */
.event-card {
  display: grid;
  grid-template-rows: auto auto;
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(58, 124, 165, .12);
  border-radius: 16px;
  background: #fff;
  background-image: none !important;
  box-shadow: 0 8px 30px rgba(23, 28, 26, .07);
  text-align: left;
  isolation: isolate;
}
.event-card:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(23, 28, 26, .12); }
.event-card-media {
  position: relative;
  height: 172px;
  background-color: var(--accent);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}
.event-card-media .event-card-hit { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; background: transparent; }
.event-card-actions { position: absolute; top: 9px; right: 9px; bottom: auto; left: auto; z-index: 2; display: flex; align-items: center; gap: 6px; pointer-events: none; }
.event-card-actions .card-icon-btn { pointer-events: auto; }
.event-card-body {
  display: grid;
  gap: 5px;
  width: 100%;
  padding: 12px 13px 13px;
  background: #fff;
  text-align: left;
  cursor: pointer;
}
.event-card-toprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.event-card-cat { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.event-card-meta { color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.event-card-title { margin: 1px 0 0; color: var(--ink-green); font-family: var(--display); font-size: 19px; font-weight: 800; line-height: 1.08; text-shadow: none; }
.event-card-loc { color: var(--muted); font-size: 12px; font-weight: 600; }
.event-card-tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 3px; }
.event-card .event-tag { padding: 3px 9px; border: 0; border-radius: 999px; background: rgba(22, 160, 133, .12); color: var(--accent-strong); font-size: 10px; font-weight: 700; }
.event-card-urgency { padding: 3px 9px; border-radius: 999px; font-size: 9px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; }
.event-card-urgency.urgency-spots { color: #fff; background: var(--urgent); }
.event-card-urgency.urgency-fast { color: #fff; background: var(--warm); }
.event-card-urgency.urgency-free, .event-card-urgency.urgency-going { color: #fff; background: var(--accent); }
.event-card .card-friends { display: flex; }
.event-card .card-friend-avatar {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  margin-left: -5px;
  border: 1.5px solid #fff;
  border-radius: 50%;
  color: #fff;
  background: var(--accent);
  font-size: 7px;
  font-weight: 900;
}
.event-card .card-friend-avatar:first-child { margin-left: 0; }

/* Paginated feed stack + sub-filters */
.feed-stack { display: grid; gap: 9px; }
.tonight-section .feed-stack { gap: 8px; }
.sub-filters { display: grid; gap: 6px; margin: 0 0 10px; }
.sub-filter-row { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding: 1px 1px 4px; scrollbar-width: none; }
.sub-filter-row::-webkit-scrollbar { display: none; }
.sub-filter-row .filter-chip { flex: 0 0 auto; padding: 6px 11px; font-size: 10px; }
.sub-filter-label { flex: 0 0 auto; margin-right: 2px; color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.sub-filter-row .pick-chip { border-style: dashed; }
.view-more-feed { margin-top: 12px; }

/* Refresh as an icon (was a text button) */
.icon-refresh { display: inline-grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--accent-strong); cursor: pointer; }
.icon-refresh svg { width: 15px; height: 15px; }
.icon-refresh:hover { background: rgba(22, 160, 133, .12); }

/* Collapsed When/Where/Type filter pills + dropdown panel */
.filter-pills { display: flex; gap: 8px; }
.filter-pill { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px; padding: 8px 12px; border: 1px solid rgba(58, 124, 165, .22); border-radius: 999px; background: #fff; color: var(--ink-green); font-family: var(--display); font-size: 12px; font-weight: 600; cursor: pointer; }
.pill-count { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 16px; height: 16px; margin-left: auto; padding: 0 4px; border-radius: 999px; background: var(--accent-strong); color: #fff; font-family: var(--mono); font-size: 9px; font-weight: 800; }
.filter-pill-wrap { position: relative; flex: 1 1 0; min-width: 0; display: flex; }
.filter-pill-wrap .filter-pill { flex: 1 1 0; width: 100%; }
.filter-dropdown { position: absolute; top: calc(100% + 8px); left: 0; z-index: 50; width: max-content; min-width: 210px; max-width: min(320px, 90vw); margin-top: 0; }
.filter-dropdown.align-end { left: auto; right: 0; }
.check-list { display: grid; gap: 2px; }
.check-list-scroll { max-height: 246px; overflow-y: auto; }
.check-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-green); font-family: var(--display); font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
.check-row:hover { background: rgba(22, 160, 133, .08); }
.check-row.checked { color: var(--accent-strong); }
.check-box { flex: 0 0 auto; display: grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid rgba(58, 124, 165, .32); border-radius: 6px; background: #fff; }
.check-row.checked .check-box { border-color: var(--accent-strong); background: var(--accent-strong); }
.check-box svg { width: 12px; height: 12px; color: #fff; stroke-width: 3; }
.dropdown-clear { margin-top: 4px; padding: 6px 4px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; text-align: left; cursor: pointer; }
.dropdown-clear:hover { color: var(--accent-strong); }
.filter-pill svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--muted); }
.filter-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter-pill .pill-caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; opacity: .5; transition: transform .18s ease; }
.filter-pill.open { border-color: var(--accent-strong); }
.filter-pill.open .pill-caret { transform: rotate(180deg); }
.filter-pill.has-value { border-color: var(--accent-strong); background: rgba(22, 160, 133, .1); }
.filter-pill.has-value svg { color: var(--accent-strong); }
.filter-panel { margin-top: 9px; padding: 11px 12px; border: 1px solid rgba(58, 124, 165, .16); border-radius: 14px; background: #fff; box-shadow: 0 8px 26px rgba(23, 28, 26, .07); display: grid; gap: 10px; }
.filter-group { display: grid; gap: 6px; }
.filter-group-head { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.filter-group-head svg { width: 12px; height: 12px; }
.filter-chip-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
.filter-chip-wrap .filter-chip { flex: 0 0 auto; padding: 6px 11px; font-size: 10px; }
.filter-chip-wrap .pick-chip { border-style: dashed; }

/* Inline "Saved" confirmation on the card save button (replaces the save toast) */
.card-save { position: relative; }
.card-save.just-saved::after {
  content: "Saved \2713";
  position: absolute;
  top: calc(100% + 5px);
  right: 0;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent-strong);
  color: #fff;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  z-index: 6;
  animation: savedPop 1.5s ease forwards;
}
@keyframes savedPop { 0% { opacity: 0; transform: translateY(-4px) scale(.85); } 14% { opacity: 1; transform: translateY(0) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-2px); } }

/* Demote the sync/status line so it reads as quiet metadata */
.sync-note { margin: 4px 2px 10px; padding: 0; border: 0; background: transparent; font-size: 10px; color: var(--muted); opacity: .7; }
.sync-note span { font-family: var(--mono); letter-spacing: .01em; }
.sync-note .icon-refresh { width: 22px; height: 22px; color: var(--muted); }
.sync-note .icon-refresh svg { width: 13px; height: 13px; }

/* Masonry feed: cards size to their image (variable height), multiple per row */
.feed-masonry { columns: 174px; column-gap: 8px; }
.feed-masonry .event-card { width: 100%; margin: 0 0 8px; break-inside: avoid; -webkit-column-break-inside: avoid; }
.event-card-media { height: auto; min-height: 0; }
.event-card-img { display: block; width: 100%; height: auto; }
.event-card-title { font-size: 16px; }
.event-card-body { padding: 10px 11px 11px; }
.event-card-reason {
  align-self: start;
  margin-bottom: 2px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(22, 160, 133, .12);
  color: var(--accent-strong);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .02em;
}
.event-card-reason::before { content: "\2605  "; }

/* Happening Today â€” DC photo with events popping up across the city */
.tonight-map { margin: 0 -18px 16px; }
.tonight-map .tonight-head { margin: 0; padding: 14px 18px 10px; }
.tonight-canvas {
  position: relative;
  height: 300px;
  overflow: hidden;
  background-image: linear-gradient(160deg, rgba(8, 20, 14, .48), rgba(8, 20, 14, .8)), url("https://images.unsplash.com/photo-1501466044931-62695aada8e9?w=1200&q=80&auto=format&fit=crop");
  background-position: center;
  background-size: cover;
}
.tonight-pin {
  position: absolute;
  max-width: min(74%, 260px);
  padding: 7px 11px;
  overflow: hidden;
  border: 1px solid rgba(22, 160, 133, .45);
  border-radius: 14px;
  color: #fff;
  background: rgba(8, 24, 16, .82);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .02em;
  opacity: 0;
  transform: translate(-50%, -50%) scale(.6);
  animation: pinPop .55s cubic-bezier(.2, .9, .3, 1.4) forwards, pinFloat 5.5s ease-in-out infinite;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  text-align: left;
}
.tonight-pin:hover { border-color: #16A085; background: rgba(8, 24, 16, .92); }
.tonight-pin-dot { flex: 0 0 auto; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #16A085; box-shadow: 0 0 8px rgba(22, 160, 133, .9); }
.tonight-pin-copy { min-width: 0; display: grid; gap: 1px; }
.tonight-pin-copy b,
.tonight-pin-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tonight-pin-copy b { font-size: 10px; line-height: 1.15; }
.tonight-pin-copy small { color: rgba(255,255,255,.72); font-size: 8px; line-height: 1.1; }
@keyframes pinPop { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes pinFloat { 0%, 100% { margin-top: 0; } 50% { margin-top: -7px; } }
@media (prefers-reduced-motion: reduce) { .tonight-pin { animation: none; opacity: 1; transform: translate(-50%, -50%); } }

/* Profile, alive */
@keyframes scoreGlow { 0%, 100% { text-shadow: 0 0 20px rgba(22, 160, 133, .3); } 50% { text-shadow: 0 0 34px rgba(22, 160, 133, .6); } }
@keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes avatarPop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
.profile-page .score-big { animation: scoreGlow 3s ease-in-out infinite; }
.profile-page .score-progress i { transform-origin: left; animation: barGrow .9s cubic-bezier(.2, .8, .2, 1) both; }
.profile-page .profile-avatar { animation: avatarPop .5s ease-out both; }
.profile-page .profile-card,
.profile-page .score-block,
.profile-page .profile-taste-chips,
.profile-page .invite-banner,
.profile-page .attend-head,
.profile-page .attend-list { animation: riseIn .5s ease-out both; }
.profile-page .profile-card { animation-delay: .03s; }
.profile-page .score-block { animation-delay: .09s; }
.profile-page .profile-taste-chips { animation-delay: .15s; }
.profile-page .invite-banner { animation-delay: .19s; }
.profile-page .attend-head { animation-delay: .23s; }
.profile-page .attend-list { animation-delay: .27s; }
.profile-page .score-level-tag { animation: scoreGlow 3s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .profile-page .score-big,
  .profile-page .score-progress i,
  .profile-page .profile-avatar,
  .profile-page .score-level-tag,
  .profile-page .profile-card,
  .profile-page .score-block,
  .profile-page .profile-taste-chips,
  .profile-page .invite-banner,
  .profile-page .attend-head,
  .profile-page .attend-list { animation: none; }
}

/* Modal media uses real images so venue/event photos do not crop or shift after click. */
.detail-hero.has-image,

/* ===== Onboarding: immersive welcome + animated steps ===== */
/* Step 0 â€” full-bleed Capitol photo, animated rotating message, single CTA. */
.onboard-immersive {
  padding: 0;
  align-items: stretch;
  justify-items: stretch;
  overflow: hidden;
  background: #0a1712;
}
.welcome-bg {
  position: absolute;
  inset: -6%;
  z-index: 0;
  background-image: url("https://images.unsplash.com/photo-1501466044931-62695aada8e9?w=1400&q=80&auto=format&fit=crop");
  background-position: center 38%;
  background-size: cover;
  transform: scale(1.08);
  animation: welcomeKen 26s ease-in-out infinite alternate;
}
.welcome-scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    radial-gradient(120% 80% at 50% 8%, rgba(22, 160, 133, .18), transparent 60%),
    linear-gradient(180deg, rgba(6, 16, 12, .30) 0%, rgba(6, 16, 12, .58) 46%, rgba(5, 12, 9, .96) 100%);
  pointer-events: none;
}
.welcome-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: max(30px, env(safe-area-inset-top)) 26px max(34px, env(safe-area-inset-bottom));
  color: #fff;
}
.welcome-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
  animation: riseIn .7s ease-out both;
}
.welcome-brand {
  font-family: var(--display, "Aptos Display", sans-serif);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .22em;
}
.welcome-place {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .72);
}
.welcome-message {
  margin-top: auto;
  margin-bottom: 26px;
}
.welcome-eyebrow {
  margin-bottom: 14px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent, #16A085);
  animation: riseIn .8s ease-out .1s both;
}
/* Rotating headline: lines stack, each fades/rises in turn on a shared loop. */
.welcome-rotator {
  position: relative;
  min-height: 2.1em;
  font-family: var(--display, "Aptos Display", sans-serif);
  font-size: clamp(30px, 9vw, 42px);
  font-weight: 900;
  line-height: 1.04;
  letter-spacing: -.01em;
}
.welcome-rotator span {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateY(16px);
  filter: blur(6px);
  animation: welcomeRotate 13s cubic-bezier(.2, .8, .2, 1) infinite;
}
.welcome-rotator span:nth-child(1) { animation-delay: 0s; }
.welcome-rotator span:nth-child(2) { animation-delay: 3.25s; }
.welcome-rotator span:nth-child(3) { animation-delay: 6.5s; }
.welcome-rotator span:nth-child(4) { animation-delay: 9.75s; }
.welcome-tagline {
  margin-top: 18px;
  max-width: 22em;
  font-size: 15px;
  line-height: 1.5;
  color: rgba(255, 255, 255, .82);
  animation: riseIn .9s ease-out .2s both;
}
.welcome-cta {
  width: 100%;
  padding: 17px;
  border-radius: 16px;
  color: #06140d;
  background: var(--accent, #16A085);
  font-size: 15px;
  font-weight: 900;
  letter-spacing: .01em;
  box-shadow: 0 14px 34px rgba(22, 160, 133, .34);
  animation: riseIn 1s ease-out .34s both, ctaBreath 3.4s ease-in-out 1.4s infinite;
}
.welcome-cta:hover { background: #0ceaa8; }
.welcome-cta:active { transform: translateY(1px); }

@keyframes welcomeKen {
  from { transform: scale(1.08) translate(0, 0); }
  to   { transform: scale(1.16) translate(-1.5%, -2%); }
}
@keyframes welcomeRotate {
  0%    { opacity: 0; transform: translateY(16px); filter: blur(6px); }
  6%    { opacity: 1; transform: translateY(0); filter: blur(0); }
  22%   { opacity: 1; transform: translateY(0); filter: blur(0); }
  28%   { opacity: 0; transform: translateY(-14px); filter: blur(6px); }
  100%  { opacity: 0; transform: translateY(-14px); filter: blur(6px); }
}
@keyframes ctaBreath {
  0%, 100% { box-shadow: 0 14px 34px rgba(22, 160, 133, .34); }
  50%      { box-shadow: 0 16px 44px rgba(22, 160, 133, .55); }
}

/* Steps 1â€“3 â€” clean cards that slide in, floating labels, staggered tiles. */
.onboard-steps { align-items: start; }
.onboard-step-card {
  width: min(100%, 560px);
  animation: onboardSlide .42s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes onboardSlide {
  from { opacity: 0; transform: translateX(22px); }
  to   { opacity: 1; transform: translateX(0); }
}
.onboard-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 26px;
}
.onboard-back {
  display: grid;

  width: 40px;
  height: 40px;
  border: 1px solid var(--line, rgba(23, 28, 26, .14));

}
.onboard-back:hover { background: rgba(22, 160, 133, .1); }
.onboard-progress {

}
.onboard-progress span {

  border-radius: 999px;
  background: rgba(23, 28, 26, .13);

}

  width: 34px;

}
.onboard-title {
  margin-bottom: 6px;

}

.onboard-fields {
  display: grid;

}
.float-field {
  display: grid;
  gap: 7px;
  animation: riseIn .5s ease-out both;
}
.float-field:nth-of-type(2) { animation-delay: .07s; }
.float-field > span {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;

  text-transform: uppercase;

}
.float-field input {
  width: 100%;
  padding: 15px 16px;

  border-radius: 14px;

  font-weight: 600;

}
.float-field input:focus {

}
.onboard-tiles .select-tile {
  text-align: center;
  animation: riseIn .5s ease-out both;
}
.onboard-tiles .select-tile:nth-child(1) { animation-delay: .02s; }
.onboard-tiles .select-tile:nth-child(2) { animation-delay: .05s; }
.onboard-tiles .select-tile:nth-child(3) { animation-delay: .08s; }
.onboard-tiles .select-tile:nth-child(4) { animation-delay: .11s; }
.onboard-tiles .select-tile:nth-child(5) { animation-delay: .14s; }
.onboard-tiles .select-tile:nth-child(6) { animation-delay: .17s; }
.onboard-tiles .select-tile:nth-child(n+7) { animation-delay: .2s; }
.onboard-steps .select-tile.selected {
  border-color: var(--accent, #16A085);
  color: #06140d;
  background: var(--accent, #16A085);
}
.onboard-steps .settings-label { margin-top: 4px; }
.onboard-steps .wide-button {
  margin-top: 20px;
  border-radius: 15px;
}

@media (prefers-reduced-motion: reduce) {
  .welcome-bg,
  .welcome-cta,
  .onboard-step-card,
  .welcome-rotator span,
  .onboard-title,
  .float-field,
  .onboard-tiles .select-tile { animation: none; }
  .welcome-rotator span:nth-child(1) { opacity: 1; transform: none; filter: none; }
  .welcome-rotator span:nth-child(n+2) { display: none; }
}

.event-card-media .event-card-img.is-logo-image,
.event-card-media .event-card-img.is-fallback-image {
  object-fit: contain;
  box-sizing: border-box;
  padding: 14%;
}
.event-card.has-logo-image .event-card-media {
  background-image: none !important;
  background-color: #fff;
}
.event-card.has-knockout-image .event-card-media,
.detail-hero.has-knockout-image {
  background: #111715 !important;
}
.event-card-media .event-card-img.is-knockout-image,
.detail-hero-img.is-knockout-image {
  background: #111715;
}
.event-card-media .event-card-hit { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; background: transparent; }

/* Glassy overlay pills (category top-left, social proof top-right) */
.event-card-pill {
  position: absolute;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100% - 22px);
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .94);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  color: #1a1a1a;
  font-family: var(--card-font);
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;

}

/* Share stays on the photo as a glassy white button (top-right) */
.event-card-media .event-card-actions { position: absolute; top: 10px; right: 10px; bottom: auto; left: auto; z-index: 2; display: flex; gap: 6px; pointer-events: none; }
.event-card-media .card-icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: #33403a;
  background: rgba(255, 255, 255, .94);

  backdrop-filter: blur(4px);
  box-shadow: 0 3px 10px rgba(23, 28, 26, .14);

}
.event-card-media .card-icon-btn:hover { background: #fff; transform: scale(1.06); }
.event-card-media .card-icon-btn svg { width: 16px; height: 16px; }

/* Info block below the photo */
.event-card-info { display: grid; gap: 1px; padding: 7px 10px 7px; text-align: left; }
.event-card-titlerow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px; min-width: 0; overflow: hidden; }
.event-card-title-btn { min-width: 0; padding: 0; background: transparent; border: 0; text-align: left; cursor: pointer; }
.event-card-title {
  display: -webkit-box;
  margin: 0;
  overflow: hidden;
  color: #1a1a1a;

  font-size: 17px;
  font-weight: 700;
  line-height: 1.14;
  letter-spacing: -.01em;
  text-shadow: none;

}
.event-card-hero .event-card-title { font-size: 22px; }

/* The heart sits in the title row as a quiet, tappable icon */
.event-card-titlerow .card-save {

  height: 28px;
  margin: -2px 0 0 0;
  border-radius: 50%;

}
.event-card-titlerow .card-save:hover { background: rgba(23, 28, 26, .06); color: #5c6b64; transform: none; }
.event-card-titlerow .card-save svg { width: 20px; height: 20px; }
.event-card-titlerow .card-save.is-saved { color: var(--onboard-green); }
.event-card-titlerow .card-save.is-saved svg { fill: var(--onboard-green); stroke: var(--onboard-green); }

.event-card-subinfo { display: grid; gap: 3px; padding: 0; background: transparent; border: 0; text-align: left; cursor: pointer; }
.event-card-venue {
  overflow: hidden;
  color: #46504a;
  font-family: var(--card-font);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.25;

.event-card-info .event-card-meta {

/* Dashed "receipt" perforation + price row */

.event-card-bottom2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; min-width: 0; }
.event-card-bottom2 .event-card-tags { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; overflow: hidden; }

/* ============================================================
   Lokal Design System â€” warm paper, ink primary, mint accent.
   Ported from the "Lokal Design System" canvas (turn 3 / 3a).

   Loaded after base.css, round2.css and redesign.css, so it
   intentionally overrides all three. The rule from the canvas:
   mint is ~10% of the surface â€” the wordmark, the active tab,
   tint chips and the score bar. Never a field behind content.
   ============================================================ */

:root {
  /* Canvas + surfaces */
  --cream: #FFFFFF;
  --paper: #FFFFFF;
  --line: rgba(25, 26, 25, .10);

  /* Ink is the primary action colour, not a blue */
  --ink: #191A19;
  --navy: #191A19;
  --blue: #191A19;
  --muted: #55564F;

  /* Mint accent + its tints */
  --accent: #00C897;
  --accent-strong: #008663;
  --mint-tint: #E9F8F2;
  --mint-deep: #C7F3E8;
  --steel: #008663;
  --blue-soft: #E9F8F2;
  --steel-soft: #E9F8F2;
  --yellow: #FFC53D;

  /* The canvas uses a hard offset shadow, not a blur */
  --shadow: 0 3px 0 rgba(25, 26, 25, .08);
  --shadow-sm: 0 2px 0 rgba(25, 26, 25, .07);
  --radius: 18px;

  /* Beli sets everything in the native UI face â€” SF Pro on iOS. One family
     across the app, including the small uppercase labels. */
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
  --display: var(--ds-font);
  --card-font: var(--ds-font);
  --mono: var(--ds-font);

  /* One type scale. Every size below comes from this list â€” nothing else. */
  --fs-label: 11px;   /* uppercase eyebrows and tab labels */
  --fs-micro: 12px;   /* counts, timestamps */
  --fs-small: 13px;   /* secondary copy, chips */
  --fs-body: 15px;    /* body copy, inputs, row labels */
  --fs-title: 17px;   /* card and row titles */
  --fs-section: 21px; /* section headings */
  --fs-page: 26px;    /* page titles */
}

html, body { background: #E7E3DB; }
body { color: var(--ink); font-family: var(--ds-font); }
.app-shell { background: var(--cream); box-shadow: 0 0 45px rgba(25, 26, 25, .14); }

/* ---- Typography ------------------------------------------------------ */
h1, h2, h3, .brand b, .event-card-title, .score-big, .score-level-tag,
.tonight-head h2, .attend-copy b, .onboard-title, .section-heading h2 {
  font-family: var(--ds-font);
  color: var(--ink);
}
h1 { font-size: var(--fs-page); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; text-transform: uppercase; }
h2 { font-size: var(--fs-section); font-weight: 800; line-height: 1.15; letter-spacing: -.015em; }
h3 { font-size: var(--fs-title); font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.discover-heading h1 { font-size: var(--fs-page); }

.eyebrow, .feed-label, .settings-group-label, .event-meta {
  color: rgba(25, 26, 25, .45);
  font-family: var(--ds-font);
  font-size: var(--fs-label);
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.lede, .section-helper, .event-copy p, .bio, .detail-description {
  color: var(--muted);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.45;
  text-wrap: pretty;
}


/* ---- Brand ----------------------------------------------------------- */
.topbar { background: var(--cream); border-bottom: 1px solid var(--line); backdrop-filter: none; }
.brand b { color: var(--accent-strong); font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.brand small { color: rgba(25, 26, 25, .5); font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .18em; }
.brand-mark { border-radius: 10px; background: var(--accent-strong); font-family: var(--ds-font); font-size: 15px; font-weight: 800; }

/* ---- Actions --------------------------------------------------------- */
.wide-button, .letter-btn, .explore-cta {
  padding: 13px 26px;
  border-radius: 999px;
  color: #fff;
  background: var(--ink);
  font-family: var(--ds-font);
  font-size: 12.5px;
  font-weight: 900;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.wide-button:hover, .letter-btn:hover, .explore-cta:hover { background: #000; }
.wide-button.secondary, .secondary.wide-button {
  border: 1.5px solid rgba(25, 26, 25, .16);
  color: var(--ink);
  background: var(--paper);
  text-transform: none;
  font-weight: 800;
  letter-spacing: 0;
}
.wide-button.secondary:hover { border-color: var(--ink); background: var(--paper); }
.text-button { color: var(--accent-strong); font-size: 12px; font-weight: 800; }
.filter-button, .share-shortcut {
  padding: 8px 12px;
  border-radius: 999px;
  color: var(--accent-strong);
  background: var(--mint-tint);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: none;
}

/* ---- Chips ----------------------------------------------------------- */
.chip, .filter-chip, .event-tag, .profile-taste-chips span {
  border: 1.5px solid rgba(25, 26, 25, .14);
  border-radius: 999px;
  color: var(--ink);
  background: var(--paper);
  font-size: 11.5px;
  font-weight: 700;
}
.chip:hover, .filter-chip:hover { border-color: var(--ink); }
.chip.active, .filter-chip.active {
  border-color: var(--ink);
  color: #fff;
  background: var(--ink);
  box-shadow: none;
  font-weight: 800;
}
/* Mint tint chips read as metadata, never as a control */
.event-tag {
  padding: 5px 9px;
  border: 0;
  color: var(--accent-strong);
  background: var(--mint-tint);
  font-size: 10px;
  font-weight: 800;
}

/* ---- Cards ----------------------------------------------------------- */
.event-row, .feature-card, .insight-card, .follow-card, .stat-card, .activity-card,
.group-card, .community-card, .interest-event, .friend-feed-card, .share-group,
.suggestion-card, .anchor-pick, .managed-list-row, .attend-row, .occurrence-row {
  border: 0;
  border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}
.event-row { grid-template-columns: 88px 1fr; min-height: 104px; border-radius: 14px; }
.event-row:hover { transform: none; box-shadow: var(--shadow); }
.event-art { min-height: 104px; border-radius: 0; }
.event-location { font-size: 13px; font-weight: 800; }
.feature-card { border-radius: var(--radius); color: var(--ink); background: var(--paper); box-shadow: var(--shadow); }
.feature-card h3 { font-size: 19px; font-weight: 900; letter-spacing: -.025em; }
.feature-signal {
  border-radius: 7px;
  color: #fff;
  background: rgba(25, 26, 25, .72);
  font-size: 10.5px;
  font-weight: 700;
}
/* Dashed hairline separates card meta from its tag chips */
.event-tags { padding-top: 8px; border-top: 1px dashed rgba(25, 26, 25, .18); }

/* ---- Bottom nav ------------------------------------------------------ */
.bottom-nav {
  height: 62px;
  padding: 10px 8px;
  border: 0;
  border-radius: 22px;
  background: var(--paper);
  box-shadow: var(--shadow);
  backdrop-filter: none;
}
.nav-item { color: rgba(25, 26, 25, .55); font-family: var(--ds-font); font-size: 10px; font-weight: 600; }
.nav-item.active { color: var(--accent-strong); font-weight: 800; }
.nav-item svg { width: 22px; height: 22px; stroke-width: 1.7; }
.nav-item.active svg { filter: none; }

/* ---- Sheets ---------------------------------------------------------- */
.modal-backdrop { background: rgba(25, 26, 25, .45); }
.modal { border-radius: 26px 26px 0 0; background: var(--paper); }
.modal-close {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  color: var(--ink);
  background: #FFFFFF;
  box-shadow: 0 0 0 1px rgba(25, 26, 25, .08), 0 2px 6px rgba(25, 26, 25, .08);
  font-size: 15px;
  isolation: isolate;
}
.modal-close:hover { background: #F1F1EE; }
.settings-field input, .settings-field textarea, .float-field input, .search-box {
  border: 1.5px solid rgba(25, 26, 25, .14);
  border-radius: 12px;
  background: var(--paper);
  box-shadow: none;
}
.search-box:focus-within { border-color: var(--ink); }

/* ---- Score bar ------------------------------------------------------- */
.lokal-score, .score-big { color: var(--ink); }
.score-bar, .score-track { background: #EDEAE4; }
.score-bar > span, .score-fill { background: var(--accent); }

/* ============================================================
   Splash â€” mint field, ink mark, city line
   ============================================================ */

.lokal-splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  background: var(--accent);
  transition: opacity .45s ease;
}
.lokal-splash.is-hiding { opacity: 0; pointer-events: none; }
.splash-center { display: flex; flex-direction: column; align-items: center; margin: auto 0; }
.splash-mark {
  position: relative;
  width: 150px;
  height: 172px;
  margin: 0;
}
.splash-dots {
  position: absolute;
  top: 0;
  left: 50%;
  z-index: 2;
  display: block;
  width: 74px;
  height: 24px;
  margin: 0;
  transform: translateX(-50%);
}
.splash-dots i {
  position: absolute;
  bottom: 0;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--mint-deep);
  opacity: 0;
  will-change: opacity, transform;
}
.splash-dots i:nth-child(1) {
  left: 0;
  animation: splashDotSettle .54s 1.08s ease-out forwards;
}
.splash-dots i:nth-child(2) {
  left: 27px;
  width: 20px;
  height: 20px;
  animation: splashDotSettle .54s 1.18s ease-out forwards;
}
.splash-dots i:nth-child(3) {
  right: 0;
  animation: splashDotSettle .54s 1.28s ease-out forwards;
}
.splash-pin {
  position: absolute;
  top: 28px;
  left: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%) translateY(-46vh) scale(.97);
  animation: splashPinDrop 1.06s cubic-bezier(.2, .82, .22, 1.02) forwards;
}
.splash-pin-head { box-sizing: border-box; width: 96px; height: 96px; border: 26px solid var(--ink); border-radius: 50%; }
.splash-pin-stem { width: 11px; height: 52px; border-radius: 0 0 6px 6px; background: var(--ink); }
@keyframes splashPinDrop {
  0% { transform: translateX(-50%) translateY(-46vh) scale(.97); opacity: 0; }
  12% { opacity: 1; }
  78% { transform: translateX(-50%) translateY(10px) scale(1); opacity: 1; }
  90% { transform: translateX(-50%) translateY(-4px) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
}
@keyframes splashDotSettle {
  0% { opacity: 0; transform: translateY(10px) scale(.68); filter: blur(7px); }
  62% { opacity: 1; transform: translateY(-3px) scale(1.08); filter: blur(0); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@media (prefers-reduced-motion: reduce) {
  .lokal-splash { transition: none; }
  .splash-pin,
  .splash-dots i {
    animation: none;
    opacity: 1;
    transform: none;
  }
  .splash-pin { transform: translateX(-50%); }
}

/* ============================================================
   Discover â€” search card, top types, Top 10
   ============================================================ */

.search-card {
  margin-bottom: 16px;
  padding: 4px 14px 12px;
  border-radius: 20px;
  background: var(--paper);
  box-shadow: 0 4px 0 rgba(25, 26, 25, .10);
}
.search-card-row {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 10px 0;
  border-bottom: 1px solid rgba(25, 26, 25, .09);
  background: transparent;
  text-align: left;
}
.search-card-row:last-of-type { border-bottom: 0; padding-bottom: 12px; }
.search-card-row .sc-dot {
  display: grid;
  flex: none;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 50%;
  color: var(--accent-strong);
  background: var(--mint-tint);
}
.search-card-row .sc-dot svg {
  display: block !important;
  width: 17px;
  height: 17px;
  flex: none;
  color: currentColor;
  fill: none !important;
  stroke: currentColor !important;

}
.search-card-row .sc-copy { flex: 1; min-width: 0; }
.search-card-row .sc-copy small {
  display: block;
