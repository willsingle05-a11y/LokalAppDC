// --- Venue name canonicalisation ------------------------------------------
// The same venue arrives under several names â€” "Tryst", "Tryst Bar Events",
// "Tryst Coffee House bar". venueImageKeyName only trims a trailing generic
// word, so those stay three separate keys. Here they are clustered: a shorter
// key that is a prefix of a longer one wins, and the cluster takes the
// shortest, most common spelling as its display name.
const venueCanonical = { built: false, toCanon: new Map(), display: new Map() };

function venueCanonicalReset() {
  venueCanonical.built = false;
  venueCanonical.toCanon.clear();
  venueCanonical.display.clear();
}

// Words that describe what a place is rather than name it. A longer name only
// folds into a shorter one when everything it adds comes from this list â€”
// "Tryst" + "coffee house bar" merges, but "The Royal" and "Royal Sands Social
// Club" stay apart, and so does "The Royal Embassy of Saudi Arabia".
const VENUE_GENERIC_TOKENS = new Set([
  "the", "a", "an", "of", "and", "at", "on", "dc", "washington",
  "bar", "bars", "cafe", "cafÃ©", "coffee", "house", "lounge", "tavern", "pub",
  "kitchen", "grill", "grille", "restaurant", "eatery", "bistro", "diner",
  "brewing", "brewery", "taproom", "beer", "wine", "winery", "cocktail",
  "events", "event", "venue", "hall", "room", "rooms", "space", "spaces",
  "theatre", "theater", "music", "live", "stage", "studio", "gallery",
  "company", "co", "inc", "llc", "group"
]);

function venueTokenKey(name) {
  return venueNameTokens(name).join("");
}

function venueTokens(name) {
  // Parenthesised text is kept as words so "(Navy Yard)" and "Navy Yard" agree.
  return String(name || "")
    .toLowerCase()
    .replace(/[()]/g, " ")
    .split(/[^a-z0-9]+/)
    .filter(Boolean);
}

// Distinctive tokens are what actually identify the place.
function venueNameTokens(name) {
  const tokens = venueTokens(name);
  while (tokens.length > 1 && VENUE_GENERIC_TOKENS.has(tokens[0])) tokens.shift();
  return tokens;
}

function venueFoldsInto(shortTokens, longTokens) {
  if (!shortTokens.length || longTokens.length <= shortTokens.length) return false;
  for (let i = 0; i < shortTokens.length; i += 1) {
    if (shortTokens[i] !== longTokens[i]) return false;
  }
  // Everything the longer name adds has to be a generic descriptor.
  return longTokens.slice(shortTokens.length).every(token => VENUE_GENERIC_TOKENS.has(token));
}

function buildVenueCanonicalIndex() {
  const counts = new Map();
  const names = new Map();
  const note = raw => {
    const name = typeof cleanLocationPart === "function" ? cleanLocationPart(raw) : String(raw || "").trim();
    if (!name) return;
    const key = venueTokenKey(name);
    if (key.length < 3) return;
    counts.set(key, (counts.get(key) || 0) + 1);
    const seen = names.get(key) || new Map();
    seen.set(name, (seen.get(name) || 0) + 1);
    names.set(key, seen);
  };
  (Array.isArray(events) ? events : []).forEach(event => note(event.venue));
  (Array.isArray(venueDirectory) ? venueDirectory : []).forEach(venue => note(venue.name));

  // Representative spelling per key, then fewest-tokens first so the base name
  // becomes the cluster root.
  const repName = new Map();
  names.forEach((bucket, key) => {
    const best = [...bucket.entries()].sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0];
    repName.set(key, best ? best[0] : key);
  });
  const keys = [...counts.keys()].sort((a, b) => {
    const delta = venueNameTokens(repName.get(a)).length - venueNameTokens(repName.get(b)).length;
    return delta || a.length - b.length || a.localeCompare(b);
  });

  const roots = [];
  keys.forEach(key => {
    const tokens = venueNameTokens(repName.get(key));
    const root = roots.find(candidate => venueFoldsInto(candidate.tokens, tokens));
    if (root) { venueCanonical.toCanon.set(key, root.key); return; }
    roots.push({ key, tokens });
    venueCanonical.toCanon.set(key, key);
  });

  // Display name: the shortest spelling in the cluster, most common breaking ties.
  const clusterNames = new Map();
  keys.forEach(key => {
    const root = venueCanonical.toCanon.get(key);
    const bucket = clusterNames.get(root) || new Map();
    (names.get(key) || new Map()).forEach((count, name) => bucket.set(name, (bucket.get(name) || 0) + count));
    clusterNames.set(root, bucket);
  });
  clusterNames.forEach((bucket, root) => {
    const best = [...bucket.entries()].sort((a, b) => a[0].length - b[0].length || b[1] - a[1] || a[0].localeCompare(b[0]))[0];
    if (best) venueCanonical.display.set(root, best[0]);
  });
  venueCanonical.built = true;
}

function venueCanonicalKey(name) {
  if (!venueCanonical.built) buildVenueCanonicalIndex();
  const key = venueTokenKey(name);
  return venueCanonical.toCanon.get(key) || key;
}

function canonicalVenueName(name) {
  if (!venueCanonical.built) buildVenueCanonicalIndex();
  const clean = typeof cleanLocationPart === "function" ? cleanLocationPart(name) : String(name || "").trim();
  // Branch qualifiers are part of the cluster key now, so "Atlas Brew Works
  // (Navy Yard)" and "Atlas Brew Works Navy Yard" resolve to one name while
  // the Ivy City taproom stays its own venue.
  return venueCanonical.display.get(venueCanonicalKey(clean)) || clean;
}

// --- Recurring series ------------------------------------------------------
const REPEAT_DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
const REPEAT_DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// Weekdays a series actually lands on, taken from the loaded occurrences
// rather than from wording in the title.
function eventSeriesWeekdays(event) {
  const all = typeof occurrencesForEvent === "function" ? occurrencesForEvent(event) : [event];
  const days = new Set();
  all.forEach(item => {
    const date = eventDateValue(item);
    if (date) days.add(date.getDay());
  });
  return { days: [...days].sort((a, b) => a - b), count: all.length };
}

function eventDedupeKey(event) {
  return `${recurringSeriesTitleKey(event)}|${venueImageKeyName(event.venue || eventLocationLine(event))}`;
}

function normalizedFeedDedupeTitle(event) {
  return String(event.title || "")
    .toLowerCase()
    .replace(/\([^)]*\)/g, " ")
    .replace(/:.+$/g, " ")
    .replace(/\bwashington\s+mystics\b/g, "mystics")
    .replace(/\bvs\.?\b/g, "vs")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function feedDedupeKey(event) {
  const day = event.startDate || (Number.isFinite(event.startSort) ? localDateKey(new Date(event.startSort)) : "");
  const hour = Number.isFinite(event.startSort) ? Math.floor(event.startSort / 60000) : eventDisplayTime(event);
  return `${day}|${hour}|${normalizedFeedDedupeTitle(event)}|${venueImageKeyName(event.venue || eventLocationLine(event))}`;
}

// Feed-only dedupe: collapse repeated title+venue occurrences to a single card.
// Assumes `list` is already sorted ascending by start, so the first match kept
// is the next upcoming occurrence.
function dedupeFeedEvents(list) {
  const seen = new Set();
  const series = new Set();
  return list.filter(event => {
    const key = feedDedupeKey(event);
    if (seen.has(key)) return false;
    // One card per series. A weekly happy hour used to return a card for every
    // future occurrence; the card now carries a strip of the days it repeats on.
    const seriesKey = eventDedupeKey(event);
    if (series.has(seriesKey)) return false;
    series.add(seriesKey);
    seen.add(key);
    return true;
  });
}

// All occurrences of the same title+venue across the loaded event set, sorted
// by start. Used by the detail modal so the full recurring schedule stays
// visible even though the feed only shows one card.
function occurrencesForEvent(event) {
  const key = eventDedupeKey(event);
  return events
    .filter(item => eventDedupeKey(item) === key)
    .sort(sortEventsByStart);
}

// --- Recurring-event detection (drives the "add to calendar weekly" button) ---
const ICS_WEEKDAY_CODES = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const ICS_CODE_LABEL = { SU: "Sunday", MO: "Monday", TU: "Tuesday", WE: "Wednesday", TH: "Thursday", FR: "Friday", SA: "Saturday" };
const RECUR_DAY_WORDS = { sunday: "SU", monday: "MO", tuesday: "TU", wednesday: "WE", thursday: "TH", friday: "FR", saturday: "SA" };
const RECUR_ORDINALS = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, last: -1 };
const RECUR_ORDINAL_LABEL = { 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", "-1": "last" };

function weekdayCodeFromDate(dateStr) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr || ""))) return null;
  const date = new Date(`${dateStr}T00:00:00`);
  return Number.isNaN(date.getTime()) ? null : ICS_WEEKDAY_CODES[date.getDay()];
}

function weeklyRecurrenceLabel(codes) {
  const names = codes.map(code => ICS_CODE_LABEL[code]);
  return names.length === 1 ? `every ${names[0]}` : `every ${names.join(" & ")}`;
}

// Infer cadence from the gap between a series' occurrences (e.g. the wharf
// "Grooves in the Grove" rows or "Music in the Circle" every Saturday).
function inferRecurrenceFromOccurrences(event) {
  const times = occurrencesForEvent(event)
    .map(item => (/^\d{4}-\d{2}-\d{2}$/.test(String(item.startDate || "")) ? new Date(`${item.startDate}T00:00:00`).getTime() : NaN))
    .filter(value => !Number.isNaN(value))
    .sort((a, b) => a - b);
  if (times.length < 2) return null;
  const gaps = [];
  for (let i = 1; i < times.length; i++) gaps.push(Math.round((times[i] - times[i - 1]) / 86400000));
  const typical = gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length / 2)];
  const code = weekdayCodeFromDate(event.startDate);
  if (!code) return null;
  if (typical === 7) return { freq: "WEEKLY", interval: 1, byday: [code], label: `every ${ICS_CODE_LABEL[code]}` };
  if (typical === 14) return { freq: "WEEKLY", interval: 2, byday: [code], label: `every other ${ICS_CODE_LABEL[code]}` };
  if (typical >= 28 && typical <= 31) return { freq: "MONTHLY", interval: 1, byday: [code], label: `monthly on ${ICS_CODE_LABEL[code]}` };
  return null;
}

// Returns a recurrence rule { freq, interval, byday[], label } or null for one-offs.
function eventRecurrence(event) {
  if (!event) return null;
  const text = `${event.title || ""} ${event.desc || ""}`.toLowerCase();
  // Monthly by position: "first friday", "every second saturday", "third tuesday".
  const monthly = text.match(/\b(first|second|third|fourth|fifth|last)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
  if (monthly) {
    const ordinal = RECUR_ORDINALS[monthly[1]];
    const code = RECUR_DAY_WORDS[monthly[2]];
    if (ordinal && code) return { freq: "MONTHLY", interval: 1, byday: [`${ordinal}${code}`], label: `every ${RECUR_ORDINAL_LABEL[ordinal]} ${ICS_CODE_LABEL[code]}` };
  }
  // Explicit weekly cadence: "weekly", "every week", "every tuesday", "fridays".
  const weeklySignal = /\b(weekly|every week|each week|recurring)\b/.test(text)
    || /\bevery\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/.test(text)
    || /\b(sundays|mondays|tuesdays|wednesdays|thursdays|fridays|saturdays)\b/.test(text);
  if (weeklySignal) {
    const codes = [];
    Object.entries(RECUR_DAY_WORDS).forEach(([word, code]) => {
      if (new RegExp(`\\b${word}s?\\b`).test(text) && !codes.includes(code)) codes.push(code);
    });
    if (!codes.length) { const code = weekdayCodeFromDate(event.startDate); if (code) codes.push(code); }
    if (codes.length) {
      codes.sort((a, b) => ICS_WEEKDAY_CODES.indexOf(a) - ICS_WEEKDAY_CODES.indexOf(b));
      return { freq: "WEEKLY", interval: 1, byday: codes, label: weeklyRecurrenceLabel(codes) };
    }
  }
  // Inherently recurring categories repeat weekly on their own weekday.
  if (["happy-hours", "trivia-nights", "farmers-markets"].includes(String(event.cat || "").toLowerCase())) {
    const code = weekdayCodeFromDate(event.startDate);
    if (code) return { freq: "WEEKLY", interval: 1, byday: [code], label: `every ${ICS_CODE_LABEL[code]}` };
  }
  return inferRecurrenceFromOccurrences(event);
}

function isHighlighted(event) { return [4, 5].includes(event.id); }

function eventNumericPrice(event) {
  if (event.price === "Free") return 0;
  const match = String(event.price || "").match(/\$?(\d+(?:\.\d+)?)/);
  return match ? Number(match[1]) : null;
}

function eventStartHour(event) {
  if (event.startHour !== undefined && event.startHour !== null) return event.startHour;
  const match = String(event.time || "").match(/(\d{1,2})(?::\d{2})?\s*(AM|PM)/i);
  if (!match) return null;
  let hour = Number(match[1]) % 12;
  if (match[2].toUpperCase() === "PM") hour += 12;
  return hour;
}

function eventStartSortValue(event) {
  if (Number.isFinite(event.startSort)) return event.startSort;
  if (event.startSort === Number.POSITIVE_INFINITY) return Number.MAX_SAFE_INTEGER;
  const timeText = String(event.time || "");
  const dayOrder = timeText.startsWith("Tonight") ? 0
    : timeText.startsWith("Today") ? 0
      : timeText.startsWith("Fri") ? 1
        : timeText.startsWith("Sat") ? 2
          : timeText.startsWith("Sun") ? 3
            : 99;
  const hour = eventStartHour(event);
  return dayOrder * 24 * 60 * 60 * 1000 + (hour ?? 24) * 60 * 60 * 1000;
}

function eventDateValue(event) {
  if (event.startDate) {
    const date = new Date(`${event.startDate}T00:00:00`);
    if (!Number.isNaN(date.getTime())) return date;
  }
  if (Number.isFinite(event.startSort) && event.startSort < Number.MAX_SAFE_INTEGER) {
    const date = new Date(event.startSort);
    date.setHours(0, 0, 0, 0);
    return date;
  }
  return null;
}

function sameCalendarDate(a, b) {
  return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function matchesDateFilter(event, value) {
  if (!value || value === "Any date") return true;
  const eventDate = eventDateValue(event);
  if (!eventDate) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (value === "Today") return sameCalendarDate(eventDate, today);
  if (value === "This week") {
    const weekEnd = new Date(today);
    weekEnd.setDate(today.getDate() + 6);
    return eventDate >= today && eventDate <= weekEnd;
  }
  if (value === "This weekend") {
    const saturday = new Date(today);
    saturday.setDate(today.getDate() + ((6 - today.getDay() + 7) % 7));
    const sunday = new Date(saturday);
    sunday.setDate(saturday.getDate() + 1);
    return sameCalendarDate(eventDate, saturday) || sameCalendarDate(eventDate, sunday);
  }
  const range = String(value).match(/^(\d{4}-\d{2}-\d{2})\.\.(\d{4}-\d{2}-\d{2})$/);
  if (range) {
    const start = new Date(`${range[1]}T00:00:00`);
    const end = new Date(`${range[2]}T23:59:59`);
    return eventDate >= start && eventDate <= end;
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return event.startDate === value || sameCalendarDate(eventDate, new Date(`${value}T00:00:00`));
  return true;
}

function sortEventsByStart(a, b) {
  const startDelta = eventStartSortValue(a) - eventStartSortValue(b);
  if (startDelta !== 0) return startDelta;
  return String(a.title || "").localeCompare(String(b.title || ""));
}

function matchesTimeFilter(event, value) {
  if (!value || value === "Any time") return true;
  const hour = eventStartHour(event);
  if (hour === null) return false;
  if (value === "Morning") return hour >= 4 && hour < 12;
  if (value === "Afternoon") return hour >= 12 && hour < 16;
  if (value === "Evening") return hour >= 16 && hour < 21;
  if (value === "Late night") return hour >= 21 || hour < 4;
  const custom = String(value).match(/^custom:(\d{1,2}):\d{2}-(\d{1,2}):\d{2}$/);
  if (custom) {
    const startHour = Number(custom[1]);
    const endHour = Number(custom[2]);
    return startHour <= endHour ? (hour >= startHour && hour <= endHour) : (hour >= startHour || hour <= endHour);
  }
  return true;
}


function isMuseumDisplayEvent(event) {
  if (String(event.cat || "").toLowerCase() !== "museums") return true;
  // Show any museum event that has a concrete date/time; only hide the ones with
  // no real schedule ("time varies" / "date to be announced").
  if (/time varies|date to be announced/.test(String(event.time || "").toLowerCase())) return false;
  return Boolean(event.startDate) || Number.isFinite(event.startSort) || eventStartHour(event) !== null;
}
// --- Cross-listed categories ----------------------------------------------
// A few kinds of event honestly belong in more than one place. A Saturday
// farmers market is a market *and* a community event; a band playing a bar is
// live music even when the listing reads as nightlife, food, or community.
// The importer has to pick one `cat`, so instead of re-tagging the source data
// these two signals widen the category filters: the event keeps its home
// category and also answers to the one it obviously belongs in.

// Venue and neighbourhood names that carry the word "market" without the event
// itself being one ("Union Market", "Eastern Market"). Stripped before the
// standalone-word check so a concert at Union Market is not filed as a market.
const MARKET_PLACE_NAMES = /\b(union market|eastern market|market square|marketplace|market street|marketing)\b/g;
const MARKET_PHRASES = /\b(farmers'? market|farmer'?s market|flea market|night market|holiday market|winter market|makers'? market|maker'?s market|artisan market|craft market|street market|vendor market|pop-?up market|open-?air market|neighborhood market|community market|christmas market|bazaar|craft fair|street fair|makers'? fair|vendor fair|swap meet)s?\b/;

function eventIsMarketEvent(event) {
  const title = String(event?.title || "").toLowerCase();
  const text = `${title} ${eventTags(event).join(" ")} ${String(event?.desc || "")}`.toLowerCase();
  if (MARKET_PHRASES.test(text)) return true;
  // Otherwise only trust the word in the event's own title, and only once the
  // place names that merely contain it have been taken out.
  return /\bmarkets?\b/.test(title.replace(MARKET_PLACE_NAMES, " "));
}

// Deliberately narrow: recorded music (DJ sets, karaoke, silent discos) is
// nightlife, not live music, so those stay out unless a live act is also named.
// "Ensemble" is deliberately absent: the importer sprays it on performing-arts
// listings as decorative filler, so it flags film screenings as gigs.
const LIVE_MUSIC_PHRASES = /\b(live music|live band|live jazz|live blues|live bluegrass|live set|live performance|performs? live|performing live|open mic|open-mic|jam session|acoustic|unplugged|singer[- ]songwriter|songwriter night|jazz night|jazz brunch|blues night|bluegrass|go-?go\b|brass band|cover band|house band|residency|\bband\b|\btrio\b|\bquartet\b|\bquintet\b|\bconcert\b|\bgig\b|\brecital\b)\b/;
const RECORDED_MUSIC_PHRASES = /\b(dj set|dj night|dj-|karaoke|silent disco|open decks|vinyl night|playlist)\b/;

function eventIsLiveMusicEvent(event) {
  const text = `${event?.title || ""} ${eventTags(event).join(" ")} ${event?.desc || ""}`.toLowerCase();
  if (!LIVE_MUSIC_PHRASES.test(text)) return false;
  // A karaoke or DJ night that only trips the filter on a stray word stays put.
  return !RECORDED_MUSIC_PHRASES.test(text) || /\b(live music|live band|live set|live performance|open mic)\b/.test(text);
}

// True when `event` should surface under `filter` in addition to its own `cat`.
function eventCrossListsInto(event, filter) {
  const category = String(event?.cat || "").toLowerCase();
  if (filter === "festivals") return category !== "festivals" && eventIsMarketEvent(event);
  if (filter === "live-music") return !["live-music", "concerts"].includes(category) && eventIsLiveMusicEvent(event);
  return false;
}

function matchesFilter(event, filter, applyDiscoverFilters = true) {
  if (!isMuseumDisplayEvent(event)) return false;
  const priceValue = eventNumericPrice(event);
  if (state.age < 21 && ["nightlife", "happy-hours"].includes(event.cat)) return false;
  if (applyDiscoverFilters && state.highlightedOnly && !isHighlighted(event)) return false;
  if (applyDiscoverFilters && state.filter.category && state.filter.category !== "All categories" && event.cat !== state.filter.category) return false;
  if (applyDiscoverFilters && !eventNeighborhoodMatches(event, state.filter.neighborhood)) return false;
  if (applyDiscoverFilters && !matchesDateFilter(event, state.filter.date)) return false;
  if (applyDiscoverFilters && !matchesTimeFilter(event, state.filter.time)) return false;
  if (applyDiscoverFilters && state.filter.price === "Free" && event.price !== "Free") return false;
  if (applyDiscoverFilters && state.filter.price === "Under $20" && (priceValue === null || priceValue >= 20)) return false;
  if (applyDiscoverFilters && state.filter.price === "Under $50" && (priceValue === null || priceValue >= 50)) return false;
  // Museums are numerous and noisy in a mixed feed â€” only show them under the
  // Museums tab, not under "All".
  if (filter === "all" || filter === "for-you") return event.cat !== "museums";
  if (filter === "neighborhoods") return event.cat !== "museums";
  if (filter === "weekend") return !event.time.startsWith("Tonight");
  if (filter === "tonight") return event.time.startsWith("Tonight");
  if (filter === "free") return event.price === "Free";
  if (filter === "food") return eventMatchesFoodDrinkFocus(event);
  // Markets and community overlap on purpose â€” a farmers market answers to both,
  // whichever side the importer happened to file it under.
  if (filter === "community") return event.cat === "community" || event.cat === "expos" || eventIsMarketEvent(event);
  return event.cat === filter || eventCrossListsInto(event, filter);
}

function eventMatchesFoodDrinkFocus(event) {
  const category = String(event.cat || "").toLowerCase();
  if (["happy-hours", "trivia-nights"].includes(category)) return false;
  const text = `${eventTags(event).join(" ")} ${event.title || ""} ${event.desc || ""}`.toLowerCase();
  return /\b(food festival|farmers? market|food market|culinary|chef dinner|tasting|wine tasting|beer festival|brew fest|cocktail class|restaurant week|cookout|brunch|supper club|pop-up dinner|food truck|food vendors?|local food|food tasting)\b/.test(text)
    || (category === "food" && /\b(food|culinary|chef|dinner|tasting|wine|beer|cocktail|restaurant week|cookout|brunch|market|farm)\b/.test(text));
}

function discoverFilterItems() {
  const items = [["all", "All"], ["concerts", "Concerts"], ["live-music", "Live music"], ["happy-hours", "Happy hours"], ["trivia-nights", "Trivia"], ["food", "Food & drink"], ["nightlife", "Nightlife"], ["culture", "Culture"], ["kids", "Kids"], ["performing-arts", "Performing arts"], ["museums", "Museums"], ["sports", "Sports"], ["festivals", "Markets"], ["community", "Community"], ["free", "Free"]];
  return userIsUnder21() ? items.filter(([value]) => !["happy-hours", "nightlife"].includes(value)) : items;
}

function filterChips(active, scope) {
  const items = scope === "home"
    ? discoverFilterItems()
    : (userIsUnder21()
      ? [["all", "All"], ["concerts", "Concerts"], ["live-music", "Live music"], ["trivia-nights", "Trivia"], ["culture", "Culture"], ["kids", "Kids"], ["performing-arts", "Arts"], ["museums", "Museums"], ["sports", "Sports"], ["festivals", "Markets"], ["community", "Community"]]
      : [["all", "All"], ["concerts", "Concerts"], ["live-music", "Live music"], ["happy-hours", "Happy hours"], ["trivia-nights", "Trivia"], ["nightlife", "Nightlife"], ["culture", "Culture"], ["kids", "Kids"], ["performing-arts", "Arts"], ["museums", "Museums"], ["sports", "Sports"], ["festivals", "Markets"], ["community", "Community"]]);
  return items.map(([value, label]) => `<button class="${scope === "home" ? "chip" : "filter-chip"} ${active === value ? "active" : ""}" data-${scope}-filter="${value}">${label}</button>`).join("");
}

function profileToFriendRow(profile) {
  const initials = profile.initials || profile.avatar_initials || profileInitials(profile.fullName || profile.full_name || profile.display_name || "");
  const fullName = profile.fullName || profile.full_name || profile.display_name || "";
  const username = String(profile.username || "").replace(/^@/, "");
  const mutuals = profile.mutuals || "";
  const bio = profile.bio || profile.home_city || (Array.isArray(profile.neighborhoods) ? profile.neighborhoods.join(", ") : "") || "Washington, DC";
  return [initials, fullName, username ? `@${username}` : "", mutuals, bio, profile.id || profile.user_id || ""];
}

function boPoseNameFor(event) {
  const text = [event && event.cat, event && event.tag, event && event.title, event && event.venue]
    .filter(Boolean).join(" ");
  const match = BO_CATEGORY_POSES.find(([pattern]) => pattern.test(text));
  return match ? match[1] : "Hello";
}

// Inline SVG markup for a pose, for places that render markup directly.
function boPoseMarkup(name, attrs = "") {
  const body = BO_POSES[name] || BO_POSES.Hello;
  return `<svg viewBox="0 0 200 200" ${attrs}>${BO_SPRITE}${body}</svg>`;
}

const boDataUriCache = new Map();

// Standalone, self-contained SVG as a data URI, so Bo can stand in anywhere an
// image src is expected.
function boPoseDataUri(name) {
  const key = BO_POSES[name] ? name : "Hello";
  if (boDataUriCache.has(key)) return boDataUriCache.get(key);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><rect width="200" height="200" fill="#FFFFFF"/>${BO_SPRITE}${BO_POSES[key]}</svg>`;
  const uri = `data:image/svg+xml,${encodeURIComponent(svg)}`;
  boDataUriCache.set(key, uri);
  return uri;
}

function boEventImage(event) {
  return boPoseDataUri(boPoseNameFor(event));
}

function formatSupabaseTime(value) {
  if (!value) return "Date to be announced";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }).format(date);
}

function formatSupabaseDate(value) {
  if (!value) return "";
  const date = new Date(`${value}T12:00:00`);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" }).format(date);
}

function formatSupabaseDateAndTime(dateValue, timeValue) {
  const date = formatSupabaseDate(dateValue);
  const time = String(timeValue || "").trim();
  return [date, time].filter(Boolean).join(", ") || "Date to be announced";
}

function formatSupabaseDateWithTbaTime(row) {
  const value = row?.date || String(row?.starts_at || row?.start_time || row?.start_at || "").slice(0, 10);
  return [formatSupabaseDate(value), "Time TBA"].filter(Boolean).join(", ") || "Time TBA";
}

function rowIsExplicitlyFree(row) {
  const tags = Array.isArray(row.tags) ? row.tags.join(" ") : "";
  const text = `${row.price || ""} ${row.price_label || ""} ${row.title || ""} ${row.description || ""} ${tags} ${row.raw_json?.description || ""} ${Array.isArray(row.raw_json?.labels) ? row.raw_json.labels.join(" ") : ""}`.toLowerCase();
  if (String(row.source || "").toLowerCase() === "dc-music-live") return /\b(free admission|free concert|free show|rsvp free|no cover)\b/.test(text);
  return row.is_free === true || /\b(free|no cover|complimentary|free admission)\b/.test(text);
}

function formatTicketPrice(value) {
  const amount = Number(value);
  if (!Number.isFinite(amount)) return "";
  return amount % 1 === 0 ? `$${amount}` : `$${amount.toFixed(2)}`;
}

function normalizeSupabasePrice(value, isMinimum = false, isExplicitlyFree = false) {
  if (value === null || value === undefined || value === "") return "Price unknown";
  if (String(value).toLowerCase() === "free") return "Free";
  if (Number(value) === 0) return isExplicitlyFree ? "Free" : "Price unknown";
  const price = Number.isFinite(Number(value)) ? formatTicketPrice(value) : (String(value).startsWith("$") ? String(value) : `$${value}`);
  return isMinimum ? `From ${price}` : price;
}

function positivePriceValue(...values) {
  return values.map(value => Number(value)).find(value => Number.isFinite(value) && value > 0);
}

function ticketmasterPriceRange(row) {
  const sources = [
    row.raw_json,
    row.raw_json?._embedded?.events?.[0],
    row.raw_json?.event,
    row.raw_json?.ticketmaster
  ].filter(Boolean);
  for (const source of sources) {
    const ranges = Array.isArray(source.priceRanges) ? source.priceRanges : [];
    const range = ranges.find(item => positivePriceValue(item?.min, item?.lowPrice, item?.price, item?.minPrice));
    if (range) {
      return {
        min: positivePriceValue(range.min, range.lowPrice, range.price, range.minPrice),
        max: positivePriceValue(range.max, range.highPrice, range.maxPrice)
      };
    }
    const offers = Array.isArray(source.offers) ? source.offers : [];
    const offer = offers.find(item => positivePriceValue(item?.lowPrice, item?.price, item?.minPrice));
    if (offer) {
      return {
        min: positivePriceValue(offer.lowPrice, offer.price, offer.minPrice),
        max: positivePriceValue(offer.highPrice, offer.maxPrice)
      };
    }
  }
  return null;
}

function formatListedPriceRange(range) {
  if (!range?.min) return "";
  if (range.max && range.max !== range.min) return `${formatTicketPrice(range.min)}-${formatTicketPrice(range.max)}`;
  return `From ${formatTicketPrice(range.min)}`;
}

function normalizeSupabasePriceFromRow(row) {
  if (["concerts", "live-music"].includes(normalizeImportedCategory(row)) && String(row.source || "").toLowerCase() === "dc-music-live" && /^free$/i.test(String(row.price || row.raw_json?.source_price || "").trim())) return "Price unknown";
  const isExplicitlyFree = rowIsExplicitlyFree(row);
  const listedTicketmasterPrice = String(row.source || "").toLowerCase() === "ticketmaster" ? formatListedPriceRange(ticketmasterPriceRange(row)) : "";
  if (listedTicketmasterPrice) return listedTicketmasterPrice;
  if (row.price !== undefined && row.price !== null && row.price !== "") return normalizeSupabasePrice(row.price, false, isExplicitlyFree);
  const listedApiPrice = formatListedPriceRange(ticketmasterPriceRange(row));
  if (listedApiPrice) return listedApiPrice;
  if (row.price_min !== undefined && row.price_min !== null && row.price_min !== "") {
    if (Number(row.price_min) === 0 && !isExplicitlyFree) return "Price unknown";
    if (row.price_max !== undefined && row.price_max !== null && row.price_max !== "" && Number(row.price_max) !== Number(row.price_min)) {
      return `${normalizeSupabasePrice(row.price_min, false, isExplicitlyFree)}-${normalizeSupabasePrice(row.price_max, false, isExplicitlyFree)}`;
    }
    return normalizeSupabasePrice(row.price_min, true, isExplicitlyFree);
  }
  return "Price unknown";
}

function persistSupabaseSession(accessToken) {
  if (!accessToken) return;
  const userId = decodeJwtPayload(accessToken).sub;
  localStorage.setItem(supabaseStorageKeys.accessToken, accessToken);
  if (userId) localStorage.setItem(supabaseStorageKeys.userId, userId);
}

function fallbackInteractionUserId() {
  let userId = localStorage.getItem(supabaseStorageKeys.interactionUserId);
  if (!userId) {
    userId = typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "00000000-0000-4000-8000-000000000000";
    localStorage.setItem(supabaseStorageKeys.interactionUserId, userId);
  }
  return userId;
}

function currentInteractionUserId() {
  const token = localStorage.getItem(supabaseStorageKeys.accessToken);

function interactionEventId(event) {

function queuePendingEventInteraction(record) {

function supabaseJsonHeaders(extra = {}) {

async function existingEventInteraction(userId, eventId) {

async function saveEventInteraction(eventId, kind = "save", active = true) {
  const event = events.find(item => item.id === Number(eventId));

  if (!supabaseEventId) return { skipped: "no-supabase-event-id" };
  const dbType = kind === "rsvp" ? "going" : kind === "remove" ? "unsave" : kind;
  const record = {
    user_id: currentInteractionUserId(),
    event_id: supabaseEventId,
    kind: dbType,
    active,
    title: event?.title || "",
    category: event?.cat || "",
    tags: event?.tags || []
  };
  if (typeof recordAppAction === "function") {
    const actionName = dbType === "going"
      ? (active ? "event_rsvped" : "event_rsvp_removed")
      : dbType === "unsave" || !active
        ? "event_unsaved"
        : "event_saved";
    recordAppAction(actionName, {
      eventId: event?.id || "",
      supabaseEventId,
      title: event?.title || "",
      category: event?.cat || "",
      venue: event?.venue || "",
      neighborhood: event?.neighborhood || "",
      active
    });
  }
  try {
    const existing = await existingEventInteraction(record.user_id, record.event_id);
    if (active && !existing) {
      const response = await fetch(`${supabaseConfig.url}/rest/v1/event_interactions`, {
        method: "POST",
        headers: { ...supabaseInteractionHeaders(), Prefer: "return=minimal" },

function cleanSupabaseDescription(value) {
  const cleaned = String(value || "")
    .replace(/^Sourced from [\w.-]+(?:\.com)?\s*-\s*/i, "")
    .replace(/^Sourced from [\w.-]+(?:\.com)?\.?\s*/i, "")
    .replace(/\s*Sourced from [\w.-]+(?:\.com)?\.?\s*/ig, " ")
    .replace(/\s*\[\.\.\.\]\s*$/g, "...")
    .trim();
  return cleaned || "More details are coming soon.";
}

function cleanImportedText(value) {
  return String(value || "")
    .replace(/^Sourced from [\w.-]+(?:\.com)?\s*-\s*/i, "")
    .replace(/^Sourced from [\w.-]+(?:\.com)?\.?\s*/i, "")
    .replace(/\s*Sourced from [\w.-]+(?:\.com)?\.?\s*/ig, " ")
    .trim();
}

function isAddressOnlyVenue(value) {
  return /United States of America|Washington, DC 20|Street |Avenue |Road |Northwest|Northeast|Southwest|Southeast|^\d+\s/i.test(String(value || ""));
}

function extractLocationFromDescription(value) {
  const description = cleanImportedText(value);
  const details = { venue: "", address: "", description };
  if (!description) return details;
  const labeled = description.match(/(?:^|\n)\s*(address|location|where|venue)\s*:\s*([^\n\r]+)/i);
  if (labeled) {
    const label = labeled[1].toLowerCase();
    const location = labeled[2].trim().replace(/[.;,]+$/g, "");
    if (location) {
      if (label === "address" || isAddressOnlyVenue(location)) details.address = location;
      else details.venue = location;
    }
    details.description = description
      .replace(new RegExp(`\\n?\\s*${labeled[1]}\\s*:\\s*${labeled[2].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*`, "i"), "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  return details;
}

function rawEventApiAddress(row) {
  return row.raw_json?.geo?.address?.formatted_address || row.raw_json?.entities?.find(entity => entity.formatted_address)?.formatted_address || extractLocationFromDescription(row.description || row.desc).address || "";
}

function rawEventApiVenueName(row) {
  const entity = row.raw_json?.entities?.find(item => ["venue", "place"].includes(item.type) && item.name && !isAddressOnlyVenue(item.name));
  return entity?.name || extractLocationFromDescription(row.description || row.desc).venue || inferVenueNameFromText(`${row.title || ""} ${row.description || ""} ${row.raw_json?.description || ""}`);
}

function rawImageUrl(value) {
  if (!value) return "";
  if (typeof value === "string") return value;
  return value.url || value.image_url || value.thumbnail_url || value.original_url || "";
}

function imageCandidateScore(value) {
  const url = rawImageUrl(value);
  if (!url) return -1;
  if (typeof value === "string") return /thumb|thumbnail|small|w_?\d{2,3}/i.test(value) ? 1 : 250000;
  const width = Number(value.width || value.w || value.size?.width || 0);
  const height = Number(value.height || value.h || value.size?.height || 0);
  let score = width && height ? width * height : 250000;
  if (/retina|large|original|master|source/i.test(url)) score += 250000;
  if (/tablet|desktop|hero|banner/i.test(url)) score += 100000;
  if (/thumb|thumbnail|small|icon|logo/i.test(url)) score -= 150000;
  return score;
}

function bestRawImageUrl(value) {
  const list = (Array.isArray(value) ? value : [value]).flat();
  return list
    .map(item => ({ url: rawImageUrl(item), score: imageCandidateScore(item) }))
    .filter(item => item.url)
    .sort((a, b) => b.score - a.score)[0]?.url || "";
}

function rawEventApiImage(row) {
  const direct = bestRawImageUrl([row.image_url, row.image, row.raw_json?.image_url, row.raw_json?.image]);
  if (direct) return direct;
  const eventImage = bestRawImageUrl(row.raw_json?.images);
  if (eventImage) return eventImage;
  const entities = Array.isArray(row.raw_json?.entities) ? row.raw_json.entities : [];
  return entities
    .map(entity => bestRawImageUrl([entity.image, entity.image_url, entity.logo, entity.thumbnail, entity.images]))
    .filter(Boolean)[0] || "";
}

function inferVenueNameFromText(value) {
  const text = cleanImportedText(value);
  const patterns = [
    /\bat\s+([A-Z][A-Za-z0-9&'â€™.\- ]{2,70}?)(?:[.,!|]| for | with | featuring | in Washington| in D\.C\.|$)/,
    /\b@\s*([A-Z][A-Za-z0-9&'â€™.\- ]{2,70}?)(?:[.,!|]|$)/,
    /\|\s*([A-Z0-9][A-Za-z0-9&'â€™.\- ]{2,45}?)\s*(?:\||$)/
  ];
  for (const pattern of patterns) {
    const match = text.match(pattern);
    const candidate = match?.[1]?.trim();
    if (candidate && !isAddressOnlyVenue(candidate) && !/hosted by|washington d\.?c\.?$/i.test(candidate)) return candidate;
  }
  return "";
}

function normalizeSupabaseVenue(row) {
  const extracted = extractLocationFromDescription(row.description || row.desc);
  const venue = cleanImportedText(row.venue_name || row.venue || row.location_name || "");
  const inferredVenue = rawEventApiVenueName(row) || extracted.venue || inferVenueNameFromText(`${row.title || ""} ${row.description || ""} ${row.raw_json?.description || ""}`);
  const genericVenue = isAddressOnlyVenue(venue) || (typeof isGenericLocationName === "function" && isGenericLocationName(venue));
  if (row.source !== "manual" && genericVenue) return inferredVenue || venue || "Location in description";
  return venue || inferredVenue || "Location in description";
}

function normalizeSupabaseArea(row) {
  const extracted = extractLocationFromDescription(row.description || row.desc);
  return row.neighborhood || row.area || extracted.address || "Washington, DC";
}

function supabaseLocationText(row) {
  return `${row.venue_address || ""} ${row.address || ""} ${rawEventApiAddress(row)} ${row.neighborhood || ""} ${row.area || ""} ${row.venue_name || ""} ${row.venue || ""} ${row.raw_json?.geo?.address?.locality || ""} ${row.raw_json?.geo?.address?.region || ""} ${row.raw_json?.geo?.address?.country_code || ""}`.toLowerCase();
}

function isSupabaseEventInDc(row) {
  const text = supabaseLocationText(row);
  const nonDcText = /\b(arlington|alexandria|bethesda|silver spring|national harbor|vienna|fairfax|falls church|rockville|hyattsville|college park|landover|tysons|mclean|reston|gaithersburg|laurel|bowie|annapolis|baltimore|md\b|va\b|virginia|maryland)\b/.test(text);
  const knownDcVenue = /\b(miracle theatre|sixth\s*&\s*i|mlk library|martin luther king jr memorial library|rock creek park tennis center|politics and prose|kennedy center|national theatre|warner theatre|the anthem|union stage|9:30 club|930 club|the atlantis|howard theatre|echostage|capital one arena|nationals park|carefirst arena)\b/.test(text);
  const dcText = knownDcVenue || /washington,\s*(dc|d\.c\.)|washington,\s*district of columbia|district of columbia|\bdc\b|\bd\.c\.\b|\bnw\b|\bne\b|\bsw\b|\bse\b/.test(text);
  if (nonDcText && !dcText) return false;
  if (dcText) return true;
  if (row.latitude !== null && row.latitude !== undefined && row.longitude !== null && row.longitude !== undefined) {
    const lat = Number(row.latitude);
    const lng = Number(row.longitude);
    if (Number.isFinite(lat) && Number.isFinite(lng)) return lat >= 38.79 && lat <= 38.995 && lng >= -77.12 && lng <= -76.90;
  }
  if (row.lat !== null && row.lat !== undefined && row.lng !== null && row.lng !== undefined) {
    const lat = Number(row.lat);
    const lng = Number(row.lng);
    if (Number.isFinite(lat) && Number.isFinite(lng)) return lat >= 38.79 && lat <= 38.995 && lng >= -77.12 && lng <= -76.90;
  }
  return dcText;
}

function bestSupabaseDescription(row) {
  const values = [
    row.raw_json?.full_description,
    row.raw_json?.detail_description,
    row.raw_json?.description,
    row.description,
    row.desc,
    row.raw_json?.listing?.summary
  ].map(value => String(value || "").trim()).filter(Boolean);
  if (String(row.source || "").toLowerCase() !== "thingstododc") return values[0] || "";
  const complete = values
    .filter(value => !/\[\s*\.\.\.\s*\]|\.\.\.$/.test(value))
    .sort((a, b) => b.length - a.length)[0];
  return complete || values.sort((a, b) => b.length - a.length)[0] || "";
}

function normalizeSupabaseDescription(row) {
  const extracted = extractLocationFromDescription(bestSupabaseDescription(row));
  return cleanSupabaseDescription(extracted.description);
}

function hasReliableSupabaseStart(row) {
  // Discovery should only show events with a real scheduled start. Date-only
  // rows are kept in Supabase, but they should not appear in the app feed.
  const category = normalizeImportedCategory(row);
  const hasClockText = /(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i.test(String(row.time || ""));
  const source = row.starts_at || row.start_time || row.start_at;
  if (category === "sports" && source && !hasClockText) {
    const parts = eventStartTimePartsFromRow(row);
    if (parts && parts.hour === 0 && parts.minute === 0) return false;
  }
  if (row.starts_at || row.start_time || row.start_at) return Number.isFinite(eventStartSortFromRow(row));
  return Boolean(row.date && eventStartTimePartsFromRow(row));
}

function eventStartTimePartsFromRow(row) {
  const source = row.starts_at || row.start_time || row.start_at;
  if (source) {
    const date = new Date(source);
    if (!Number.isNaN(date.getTime())) {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", hour12: false }).formatToParts(date);
      return {
        hour: Number(parts.find(part => part.type === "hour")?.value || 0) % 24,
        minute: Number(parts.find(part => part.type === "minute")?.value || 0)
      };
    }
  }
  const timeText = String(row.time || row.start_time || row.start_at || "");
  const match = timeText.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i);
  if (!match) return null;
  let hour = Number(match[1]) % 12;
  if (match[3].toUpperCase() === "PM") hour += 12;
  return { hour, minute: Number(match[2] || 0) };
}

function eventStartHourFromRow(row) {
  const parts = eventStartTimePartsFromRow(row);
  return parts ? parts.hour : null;
}

function eventStartSortFromRow(row) {
  const source = row.starts_at || row.start_time || row.start_at;
  if (source) {
    const date = new Date(source);
    if (!Number.isNaN(date.getTime())) return date.getTime();
  }
  const parts = row.date ? eventStartTimePartsFromRow(row) : null;
  if (row.date && parts) {
    const date = new Date(`${row.date}T00:00:00`);
    if (!Number.isNaN(date.getTime())) return date.getTime() + parts.hour * 60 * 60 * 1000 + parts.minute * 60 * 1000;
  }
  return Number.MAX_SAFE_INTEGER;
}

function startOfDiscoveryWindowSortValue() {
  return Date.now();
}

function endOfDiscoveryWindowSortValue() {
  const end = new Date();
  // 21-day window so concerts, live music, and museum events (most dated more
  // than a week out) appear alongside the daily recurring happy hours/trivia.
  end.setDate(end.getDate() + 21);
  end.setHours(23, 59, 59, 999);
  return end.getTime();
}
function localDateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function discoveryWindowQueries() {
  const start = new Date(startOfDiscoveryWindowSortValue());
  const end = new Date(endOfDiscoveryWindowSortValue());
  const selectAndStatus = "select=*&status=eq.published";
  const today = localDateKey(start);
  return [
    `${selectAndStatus}&date=gte.${today}&date=lte.${localDateKey(end)}`,
    `${selectAndStatus}&starts_at=gte.${encodeURIComponent(start.toISOString())}&starts_at=lte.${encodeURIComponent(end.toISOString())}`
  ];
}


function isEventInDiscoveryWindow(event) {
  if (!Number.isFinite(event.startSort) || event.startSort === Number.MAX_SAFE_INTEGER) return false;
  return event.startSort >= startOfDiscoveryWindowSortValue() && event.startSort <= endOfDiscoveryWindowSortValue();
}

// Venue images pulled from the Supabase `venues` table (venues.image_url),
// used as a fallback when an event has no image of its own. Matched by a
// normalized venue name, mirroring the server-side venue_image_key().
let venueImageMap = {};
function venueImageKeyName(value) {
  // Mirrors the server-side public.venue_image_key() so client matches line up.
  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/\s*\([^)]*\)\s*/g, " ")
    .replace(/^the\s+/, "")
    .replace(/\s+(bar|cafe|lounge|tavern|dc)$/, "")
    .replace(/[^a-z0-9]+/g, "");
}
let venueImageKeys = [];
function venueImageForRow(row) {
  const key = venueImageKeyName(row.venue_name || row.venue);
  if (!key) return "";
  if (venueImageMap[key]) return venueImageMap[key];
  // Fuzzy fallback: event venue names are often more specific than the venue row
  // (e.g. "Atlas Brew Works Navy Yard" vs "Atlas Brew Works"). Match when one
  // normalized name is a prefix/substring of the other. Keys are sorted longest
  // first so the most specific venue wins.
  for (const vk of venueImageKeys) {
    if (vk.length < 6) continue;
    if (key.startsWith(vk) || vk.startsWith(key) || key.includes(vk) || vk.includes(key)) return venueImageMap[vk];
  }
  return "";

// PostgREST caps every response at 1000 rows regardless of the requested limit,
// so a single fetch silently drops most of an over-subscribed discovery window
// (thousands of daily happy-hour/trivia/music rows push later-dated events past
// the cap). Page through with offset until a short page signals the end. A stable
// id tiebreaker keeps slices from overlapping or skipping across pages.
async function fetchSupabaseEventPages(query) {
  const pageSize = 1000;
  const order = "starts_at.asc.nullslast,date.asc.nullslast,id.asc";
  const rows = [];
  for (let offset = 0; offset < 20000; offset += pageSize) {
    const response = await fetch(`${supabaseConfig.url}/rest/v1/events?${query}&order=${order}&limit=${pageSize}&offset=${offset}`, {
      cache: "no-store",
      headers: { apikey: supabaseConfig.publishableKey, "Cache-Control": "no-cache" }
    });
    if (!response.ok) throw new Error(`Supabase returned ${response.status}`);
    const page = await response.json();
    rows.push(...page);
    if (page.length < pageSize) break;
  }
  return rows;
}

async function syncSupabaseEvents(showToast = false) {
  state.eventSync = { status: "loading", label: "Checking shared events..." };
  state.eventsLoadTimedOut = false;
  setTimeout(() => {
    if (state.eventSync.status === "loading") {
      state.eventsLoadTimedOut = true;
      if (state.route === "home") renderHome();
    }
  }, 5000);
  if (state.route === "home") renderHome();
  await syncSupabaseVenueImages();
  await syncVenueVerificationStatus();
  try {
    const rowSets = await Promise.all(discoveryWindowQueries().map(fetchSupabaseEventPages));
    const rows = [...new Map(rowSets.flat().map(row => [row.id, row])).values()];
    if (rows.length) {
      const dcRows = rows.filter(isSupabaseEventInDc);
      const normalized = dcRows.map(normalizeSupabaseEvent);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      state.todayStoryEvents = normalized
        .filter(event => Number.isFinite(event.startSort) && event.startSort < Number.MAX_SAFE_INTEGER)
        .filter(event => sameCalendarDate(new Date(event.startSort), today));
      const discoveryWindowEvents = normalized.filter(isEventInDiscoveryWindow);
      events = discoveryWindowEvents;
      state.eventSync = { status: "synced", label: `${events.length} upcoming DC event${events.length === 1 ? "" : "s"}` };
    } else {
      events = [];
      state.todayStoryEvents = [];
      state.eventSync = { status: "empty", label: "No upcoming DC events found yet" };
    }
  } catch {
    events = [];
    state.todayStoryEvents = [];
    state.eventSync = { status: "error", label: "Events could not load" };
  }
  // The venue name clusters are derived from the loaded events, so they have to
  // be rebuilt whenever the event set is replaced.
  if (typeof venueCanonicalReset === "function") venueCanonicalReset();
  reconcileUserPlans();
  await syncSupabaseFriendInterests();
  if (state.route === "home") renderHome();
  openSharedEventFromUrl();
  if (showToast) toast(state.eventSync.label);
}

function openSharedEventFromUrl() {
  if (state.sharedEventOpened) return;
  const params = new URLSearchParams(location.search);
  const eventParam = params.get("event");
  if (!eventParam) return;
  const shouldOpen = params.get("openEvent") === "1" || params.get("shared") === "1";
  if (!shouldOpen) {
    params.delete("event");
    const nextSearch = params.toString();
    history.replaceState(null, "", `${location.pathname}${nextSearch ? `?${nextSearch}` : ""}${location.hash}`);
    state.sharedEventOpened = true;
    return;
  }
  const sharedEvent = events.find(event => String(event.sourceId || event.id) === String(eventParam) || String(event.id) === String(eventParam));
  if (!sharedEvent) return;
  state.sharedEventOpened = true;
  params.delete("event");
  params.delete("openEvent");
  params.delete("shared");
  const nextSearch = params.toString();
  history.replaceState(null, "", `${location.pathname}${nextSearch ? `?${nextSearch}` : ""}${location.hash}`);
  openDetail(sharedEvent.id);
}

async function syncSupabaseFriendInterests() {
  const friends = currentFriendProfiles();
  const eventMap = eventSourceIdMap();
  if (!friends.length || !eventMap.size) {
    state.friendEventInterests = new Map();
    state.friendEventInterestsLoaded = true;
    return;
  }
  const friendById = new Map(friends.map(friend => [String(friend.id), friend]));
  const eventIds = Array.from(eventMap.keys());
  const friendIds = friends.map(friend => friend.id);
  const chunks = [];
  for (let index = 0; index < eventIds.length; index += 80) chunks.push(eventIds.slice(index, index + 80));
  const next = new Map();
  try {
    for (const eventChunk of chunks) {
      const response = await fetch(`${supabaseConfig.url}/rest/v1/rpc/friend_event_interests`, {
        method: "POST",
        headers: supabaseJsonHeaders(),
        body: JSON.stringify({ friend_ids: friendIds, event_ids: eventChunk.map(Number) })
      });
      if (!response.ok) throw new Error(`Supabase friend interests returned ${response.status}`);
      const rows = await response.json();
      rows.forEach(row => {
        const friend = friendById.get(String(row.user_id));
        const event = eventMap.get(String(row.event_id));
        if (!friend || !event) return;
        const key = String(event.sourceId || event.id);
        if (!next.has(key)) next.set(key, []);
        const list = next.get(key);
        if (!list.some(item => item.name === friend.name)) list.push(friend);
      });
    }
    state.friendEventInterests = next;
    state.friendEventInterestsLoaded = true;
  } catch (error) {
    console.warn("[supabase] friend event interests unavailable:", error.message);
    state.friendEventInterestsLoaded = false;
  }
}

function formatSignupPhone(value) {
  const digits = value.replace(/\D/g, "");
  if (digits.length === 10) return `+1${digits}`;
  if (digits.length === 11 && digits.startsWith("1")) return `+${digits}`;
  if (value.trim().startsWith("+") && digits.length >= 10) return `+${digits}`;
  throw new Error("Enter a 10 digit phone number with area code.");
}

function formatDisplayPhone(value) {
  const digits = String(value || "").replace(/\D/g, "");
  const local = digits.length === 11 && digits.startsWith("1") ? digits.slice(1) : digits;
  if (local.length !== 10) return value || "";
  return `(${local.slice(0, 3)}) ${local.slice(3, 6)}-${local.slice(6)}`;
}

function calculateAge(birthdate) {
  const birthday = new Date(`${birthdate}T12:00:00`);
  const today = new Date();
  let age = today.getFullYear() - birthday.getFullYear();
  if (today < new Date(today.getFullYear(), birthday.getMonth(), birthday.getDate())) age--;
  return age;
}

function validateBirthday(birthdate) {
  const birthday = new Date(`${birthdate}T12:00:00`);
  const today = new Date();
  if (!birthdate || Number.isNaN(birthday.getTime())) throw new Error("Enter a valid birthday.");
  if (birthday >= today) throw new Error("Birthday must be a date in the past.");
  if (calculateAge(birthdate) < 14) throw new Error("You must be at least 14 years old to use Lokal.");
}

function profileInitials(fullName) {
  return fullName.split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase() || "L";

async function supabaseAuthRequest(path, body) {

      apikey: supabaseConfig.publishableKey,
      "Content-Type": "application/json"
    },

  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.msg || data.message || data.error_description || "Supabase could not complete that request.");
  return data;
}

function decodeJwtPayload(token) {
  try {
    const payload = token.split(".")[1];
    return JSON.parse(atob(payload.replace(/-/g, "+").replace(/_/g, "/")));
  } catch {
    return {};
  }
}

function validateSignupEmail(email) {
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error("Enter a valid email address.");
}

// One rule, applied everywhere a password is set: long enough, and not a bare
// string of digits â€” it has to contain letters.
const SIGNUP_PASSWORD_MIN = 8;

function validateSignupPassword(password) {
  const value = String(password || "");
  if (value.length < SIGNUP_PASSWORD_MIN) throw new Error(`Use a password with at least ${SIGNUP_PASSWORD_MIN} characters.`);
  if (!/[a-zA-Z]/.test(value)) throw new Error("Your password needs to include at least one letter.");
}

// An email address gets one Lokal account. Checked against the profiles table
// before signup runs, so the duplicate is caught while the user is still on the
// form rather than surfacing as a Supabase error three screens later.
async function emailAlreadyRegistered(email) {
  const value = String(email || "").trim().toLowerCase();
  if (!value) return false;
  const stored = getLokalCredentials();
  if (stored?.email && stored.email === value && localStorage.getItem("lokalHasAccount") === "true") return true;
  try {
    // ilike with no wildcards is a case-insensitive equality, which is what we
    // want â€” stored addresses are not normalised to lower case everywhere.
    const url = `${supabaseConfig.url}/rest/v1/profiles?select=id&email=ilike.${encodeURIComponent(value)}&limit=1`;
    const response = await fetch(url, { headers: supabaseJsonHeaders() });
    if (!response.ok) return false;
    const rows = await response.json();
    return Array.isArray(rows) && rows.length > 0;
  } catch {
    // Offline or blocked: don't block a legitimate signup on a failed lookup.
    // Supabase still rejects a duplicate address at signup time.
    return false;
  }
}

function isDuplicateAccountError(error) {
  return /already registered|already exists|already been registered|already has a lokal account|duplicate key|user_repeated_signup/i.test(String(error?.message || ""));
}

      owner_name: profile.ownerName || profile.fullName || "",
      birthdate: profile.birthdate,
